seo:
  title: Cleaners in the Northern Rivers NSW | TLB Cleaning
  description: House, holiday let and commercial cleaning across the Northern
    Rivers NSW — Lismore, Ballina, Byron Bay, Lennox Head, Brunswick Heads and
    the towns around them.
headingLines:
  - Cleaners across
  - the Northern Rivers.
lead: From the Lismore hills out to Byron Bay and Ballina on the coast. One
  local team on a set day, not whoever is nearest.
intro:
  - Lismore and Alstonville inland, then Ballina, Lennox Head, Byron Bay and
    Brunswick Heads along the coast. An hour end to end, and two quite different
    cleaning jobs inside it.
  - Inland it is older housing stock, a lot of timber, and mould and damp that
    arrive with the wet rather than with neglect. On the coast it is salt haze
    on glass, sand in every track, and a holiday-let calendar that turns the
    whole thing over each Saturday.
  - Byron Shire also carries its own short-stay rules, which changed what a
    letting year looks like for a lot of owners here.
