hostFaq:
  heading: Working with us on your property
  items:
    - question: Do I have to tell you every time I get a booking?
      answer: No, that is the part we take off you. We work from your calendar rather
        than from your messages, so a new booking or a moved date flows through
        without you relaying it. You will still hear from us when something
        needs a decision.
    - question: Can you do a same-day turnover?
      answer: Yes, and most of our short-stay work is same-day. Checkout to check-in
        is usually three or four hours, which is enough for a full reset with
        the right number of people on it.
    - question: What gets restocked, and how is it charged?
      answer: On Turnover + Restock and Full Property Care, we top up loo paper, soap,
        dishwashing, tea, coffee and kitchen staples, and set up the welcome
        touches. Supplies are itemised on your invoice, so you see exactly what
        was used.
    - question: I'm not there. How do I know it was done?
      answer: You get photos after every turnover, the same day, plus anything we've
        flagged. On Full Property Care we also run regular property checks and
        send you a report, so you know the place is right between stays too.
    - question: What happens if a guest leaves the place in a state?
      answer: We clean it and we tell you, with what we found, the same day. An
        extra-hours charge only ever happens after we have told you and you have
        said yes, so you will not find a surprise on an invoice. If it is bad
        enough to be a claim, you have it in writing from us while it still
        matters.
    - question: Who pays the tradie if something breaks?
      answer: You do, and only after you've said yes. We tell you what's wrong, with a
        photo, and once you say yes, we send one of the licensed trades we work
        with. The work is itemised on your TLB invoice, so you only deal with
        us.
    - question: Will it be the same cleaner every time?
      answer: Wherever we can, yes, and it makes a real difference on a short-stay
        property, someone who knows where the spare linen lives and which door
        sticks is faster and misses less. When your regular cleaner is away you
        get someone else from our team who has been briefed on your property,
        not a stranger from a platform.
    - question: Is there a lock-in?
      answer: No. There's no lock-in contract, no minimum term and no exit fee.
    - question: What happens if I get in touch?
      answer: We ask about the property, how often it turns over and what presentation
        you want, and we look at it in person if it is local. Then you get a
        price and a scope in writing. No obligation, no lock-in contract. If it
        suits, we set it up around your calendar and it starts happening.
faq:
  heading: Airbnb cleaning services, common questions
  items:
    - question: How much does Airbnb cleaning cost?
      answer: Short-stay turnovers are usually priced as a flat rate per changeover
        rather than hourly, because a host needs to know the number before they
        set their cleaning fee. The rate moves with the size of the property,
        how many bedrooms and bathrooms turn over, whether linen is included and
        how tight the same-day window is. Ask for it against a written scope,
        not an hourly rate.
    - question: Is short-term rental cleaning different from Airbnb cleaning?
      answer: No, it's the same job. Short-term rental cleaning covers any short-stay
        listing, whether it's on Airbnb, Stayz, Booking.com or your own site. We
        work off whichever booking calendar you use.
    - question: Should the guest cleaning fee cover the whole turnover?
      answer: "Usually it covers most of it, and hosts who try to make it cover
        everything tend to lose bookings. The fee is visible at checkout and a
        high one reads as a red flag on a short stay. The common approach is to
        set the fee at or a little under the real turnover cost and treat the
        rest as a cost of doing business, then price the nightly rate
        accordingly. Check your platform's current rules before you rely on any
        of this: how cleaning fees are displayed, refunded on cancellation and
        counted toward your total is set by the platform, and it changes."
    - question: Who supplies the linen and towels?
      answer: It goes one of two ways, and it is worth settling before the first
        clean. Either the host keeps three sets per bed on site and the cleaner
        turns and launders them, or a linen service delivers hired linen and
        takes the used sets away. Hired linen costs more per turnover and
        removes the laundry bottleneck, which is what usually breaks a same-day
        changeover.
    - question: How long does a turnover actually take?
      answer: "A one-bedroom apartment is usually an hour to ninety minutes with one
        person. A three-bedroom house with two bathrooms is closer to three
        hours, or half that with two cleaners on it, which is how a same-day
        changeover gets done inside a three-hour window at all. Laundry is the
        part that does not compress: if the linen has to be washed and dried on
        site between guests, that sets the floor, not the cleaning."
    - question: Are there rules about how many nights I can let my place?
      answer: "In NSW, short-term rental accommodation is regulated: properties
        generally have to be listed on the state register, meet fire-safety
        requirements and comply with a code of conduct, and non-hosted letting
        is capped at a set number of nights a year in some areas. The Byron
        Shire has its own reduced cap, applied unevenly across the shire, so two
        listings a few streets apart can sit under different limits. Queensland
        is different again and several Gold Coast rules are set locally. Check
        the current position with your council and the NSW planning portal
        before you rely on a number. This is general information, not planning
        advice, and the rules in this region have changed more than once."
