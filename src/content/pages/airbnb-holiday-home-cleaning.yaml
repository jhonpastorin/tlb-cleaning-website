definition:
  body:
    - type: paragraph
      text: "Airbnb cleaning is the turnover clean between one guest checking out and
        the next checking in: the whole property reset, linen changed, bathrooms
        and kitchen done, consumables restocked and the place presented ready
        for arrival. TLB Cleaning does Airbnb and holiday let turnovers across
        the Northern Rivers, the Tweed and the Southern Gold Coast."
    - type: paragraph
      text: A turnover, a changeover and a short-stay clean are the same job under
        three names. It is not a house clean on a shorter timeline. The
        difference is that it is scheduled off a booking calendar rather than a
        weekly slot, it has a hard deadline set by someone else, and
        presentation counts as much as cleanliness, because it is being
        photographed and reviewed by the person walking in.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
shortStay:
  heading: Short-term rental and holiday home cleaning
  body:
    - type: paragraph
      text: Short-term rental cleaning is the same turnover for any short-stay
        listing, whether it's on Airbnb, Stayz, Booking.com or your own site. We
        work off whichever booking calendar you use.
    - type: paragraph
      text: Holiday home cleaning goes a step further. Alongside the turnovers, we
        look after the place between stays, with property checks, restocking and
        a licensed tradie organised when something's not right. It's built for
        owners who live away and want the whole property taken care of.
