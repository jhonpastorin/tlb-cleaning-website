worthKnowing:
  heading: A turnover is priced per clean. It is judged per review.
  body:
    - A turnover is the only clean on this site whose result gets published. A
      missed shower screen is a private annoyance in a family home and a
      permanent three-star sentence on a listing, and it lands on the review
      that sits at the top of your page for the next six months.
    - So the number worth comparing is not the price per turnover. It is what
      happens when a guest checks out at eleven and the next one arrives at two,
      and whether anybody is going to tell you the toaster is broken before a
      guest does.
whySameTeam:
  heading: Why short-term rental cleaners disappear, and what to ask before you book one
  body:
    - type: paragraph
      text: Short-stay cleaning has the highest turnover of cleaners of any work we
        do, and it is not because the job is hard. It is because it is scheduled
        around other people, it clusters on Fridays and Sundays, and a sole
        operator with six listings physically cannot cover a Saturday when four
        of them change over at once. So the good ones get busy, then they get
        overcommitted, then one weekend they do not show, and it is your guest
        standing on the verandah, not theirs.
    - type: paragraph
      text: That is the whole reason TLB is a team rather than one person with a car.
        Capacity is what makes a Saturday changeover boring, and boring is the
        entire product. When you are choosing between quotes, the questions
        worth asking are how many people the business actually employs, what
        happens when your regular cleaner is sick, and who answers the phone at
        nine on a Sunday morning.
    - type: paragraph
      text: The person in your property is on our team, we know which property is
        yours, and there is one local number to ring, which is a low bar until
        the weekend you need it.
