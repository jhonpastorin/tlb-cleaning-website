faq:
  heading: "Deep cleaning: frequently asked questions"
  items:
    - question: What is included in a deep clean?
      answer: "The surfaces a regular clean does not reach: up high, down low, inside
        and behind. Cornices, tops of doors, light fittings, fan blades, vents,
        skirtings, floor edges, inside cupboards, behind appliances, window
        tracks, grout and shower screen build-up. Our deep cleaning page
        publishes the full room-by-room list."
    - question: What is the difference between a deep clean and a regular clean?
      answer: A regular clean works on the surfaces you use and holds a standard week
        to week. A deep clean works on the ones you do not and gets back to that
        standard once. It is not the same job done harder; the task lists
        genuinely differ, most obviously on inside cupboards, tracks, skirtings
        and build-up.
    - question: Is a deep clean the same as a bond clean?
      answer: No. A bond clean is measured against the entry condition report and
        includes work a deep clean quotes separately, most notably inside the
        oven and inside every cupboard and drawer. A deep clean is measured
        against a baseline you set. The bond clean is the more thorough and the
        more expensive of the two.
    - question: How long does a deep clean take?
      answer: Longer than a regular clean, because it is detail work rather than
        surface work, and the honest answer depends on the size and condition of
        the property. It is quoted per job for that reason. An empty property is
        considerably faster than a furnished one, which is why moving-in deep
        cleans are the quickest of all.
    - question: Do I need a deep clean before starting a regular clean?
      answer: Not always, but usually it costs less. A deep clean first does the
        backlog once at the right price, and every regular visit afterwards fits
        the hours it is priced for. The alternative is either a very long first
        visit or several normal visits spent chipping away at build-up at full
        rate.
    - question: Should I tidy before a deep clean?
      answer: Yes, and it is the best hour you will spend on the job. Cleaning around
        belongings is slower and finishes worse than cleaning a clear surface.
        You do not need to clean anything, just clear the floors and the
        benches. Everything else is what you are paying us for.
