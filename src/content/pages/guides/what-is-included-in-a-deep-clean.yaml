seo:
  title: What Is Included in a Deep Clean? | TLB Cleaning
  description: What a deep clean covers that a regular clean does not, where it
    stops short of a bond clean, and how to tell which of the three your house
    actually needs.
hero:
  kicker: Guide · Homes and hosting
  headingLines:
    - A deep clean is not
    - a regular clean done harder.
  lead: What is actually in a deep clean, what a regular clean leaves alone on
    purpose, where a bond clean goes further, and how to tell which of the three
    your house needs.
  image:
    src: /src/assets/home_cleaning/inside_your_home/deep_cleaning/deep-cleaning-tidy-living-room-kept-up-by-regular-visits.jpg
    alt: A calm, tidy living room with clear surfaces and a made-up sofa, kept up by
      regular visits
definition:
  body:
    - type: paragraph
      text: "A deep clean is a one-off, room-by-room reset that covers the surfaces a
        regular clean does not reach: inside and behind things, up high, down
        low, and the built-up grime that a weekly visit has no time in it for.
        It returns a house to a baseline. A regular clean then holds it there."
    - type: paragraph
      text: "The simplest way to tell the two apart is what gets touched. A regular
        clean works on the surfaces you use. A deep clean works on the ones you
        do not: the tops of doors, behind the appliances, the tracks, the grout,
        the skirtings, the vents and the light fittings."
  backgroundImage: /src/assets/home_cleaning/inside_your_home/deep_cleaning/deep-cleaning-comparing-clean-types-with-a-checklist.jpg
categories:
  heading: What makes a deep clean deep
  lead: Five groups of work, organised by where the work actually is, and one
    honest note about what none of them can do.
  items:
    - heading: Up high
      body:
        - Cornices and ceiling corners, the tops of doors and door frames, light
          fittings and shades, ceiling fan blades, the tops of wardrobes and
          cupboards, exhaust fan covers, air vents and returns.
        - None of it is visible from where you sit and all of it is obvious the
          moment someone looks up. It is also where a house holds most of its
          dust.
    - heading: Down low
      body:
        - Skirting boards all the way round, the edges and corners of every
          floor, behind doors, under the toe-kick, the floor waste in the
          laundry.
        - Vacuuming a room and vacuuming its edges are different amounts of
          time, and the edges are where the difference between a tidy house and
          a clean one actually shows.
    - heading: Inside and behind
      body:
        - Inside and outside of cupboards, behind and beside the appliances
          where they can be moved safely, inside the rangehood, the fridge
          seals, the dishwasher filter.
        - This is the group people mean when they say a house feels clean rather
          than looks clean, and it is almost entirely absent from a regular
          visit for the good reason that there are not enough hours in one.
    - heading: Build-up rather than mess
      body:
        - Soap scum on a shower screen, grout that has gone grey, the film on a
          splashback, the tide line in a toilet, the greasy haze above a
          cooktop.
        - None of it appears overnight and none of it comes off in a normal
          wipe. It takes dwell time and the right product, which is the part a
          rushed clean skips because it looks like waiting around.
    - heading: The detail work
      body:
        - Window sills, reveals and tracks, light switches and power points,
          door handles, architraves, wardrobe rails and shelves, curtain and
          blind dusting.
        - Individually trivial and collectively most of the hours. A deep clean
          is not one big job, it is roughly two hundred small ones.
    - heading: What it is still not
      body:
        - It is not a repair, it is not a declutter and it is not a renovation.
          Cleaning removes what has settled on a surface; it does not restore a
          surface that has worn, faded, chipped or stained through.
        - A good deep clean tells you which is which. Some of what looks like
          dirt is a finish that has gone, and knowing that saves you paying
          twice to find out.
cleanTable:
  heading: Regular, deep, or bond
  cornerLabel: Which clean covers what
  lead: The same house, three different jobs. Read down the column you think you
    want, then check the rows you were not expecting.
  columns:
