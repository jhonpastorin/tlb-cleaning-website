  footnote: Most people book a deep clean first and set up a regular clean
    afterwards. It costs less that way round, because the deep clean does the
    heavy work once rather than paying for a very long first regular visit.
order:
  heading: Deep clean first, then regular. Not the other way around.
  body:
    - If you are setting up an ongoing clean for a house that has not had one,
      the best order is a deep clean once and then a regular schedule on top of
      it. The heavy work gets done at the right price for heavy work, and every
      visit after that fits the hours it is priced for.
    - Going the other way means either a very long, expensive first regular
      visit, or three or four normal visits during which the backlog is slowly
      chipped at while you pay full price and wonder why the house does not feel
      finished. It usually costs more and it always feels worse.
willItFix:
  heading: Will it fix the thing that is actually bothering you?
  lead: Three of these six are a yes. The other three are worth knowing before you
    book, because a deep clean will not touch them.
  items:
    - icon: spray-bottle
      title: Grey grout
      description: Usually yes, substantially. Grout that is dirty comes back a long
        way with dwell time and agitation. Grout that is stained through, or
        that has failed and gone porous, is a regrouting job and no amount of
        scrubbing changes that.
    - icon: spark
      title: A shower screen that never looks clean
      description: Usually yes. Soap scum is a film and it comes off with the right
        product and enough contact time. Etched glass, where minerals have
        pitted the surface itself, does not, and it looks the same until someone
        tries.
    - icon: idea
      title: A smell you cannot find
      description: Sometimes. Kitchen bins, fridge seals, the dishwasher filter and
        the laundry floor waste account for most of them. If it is damp in a
        wall or a carpet backing, that is a different problem and a deep clean
        will not touch it.
    - icon: house
      title: Mould spotting in the bathroom
      description: Surface mould on tiles and silicone, often. Anything growing behind
        paint, in a ceiling or through a wall is not a cleaning job at all, and
        we have a separate page about that for a reason.
    - icon: puzzle
      title: Carpet that has gone dull in the traffic lanes
      description: No, not from a deep clean. That is carpet cleaning, which is a
        separate job with separate equipment, and it is quoted separately by
        nearly everyone including us.
    - icon: target
      title: A house that is just cluttered
      description: No, and it is worth saying plainly. Cleaning around belongings is
        slower and finishes worse than cleaning an empty surface. An hour of
        putting things away before we arrive is the highest-value hour of the
        whole job.
exclusions:
  heading: What is quoted separately, and what is not cleaning at all
  body:
    - "Quoted separately, by us and by most cleaners: inside the oven, inside
      the fridge, carpet steam cleaning, exterior windows, walls needing a full
      wash rather than spot cleaning, balconies, garages and anything at height.
      They are real jobs with real time in them, and a deep clean price that
      silently includes all of them is a price that will move on the day."
    - "Not cleaning at all: repairs, painting, gardening, rubbish and hard waste
      removal, decluttering, pest control, and anything that needs a licensed
      trade. If a property needs one of those we will say so when we quote,
      rather than leaving you to find out afterwards."
    - "And the honest one: cleaning cannot restore a finish that has gone. Worn
      timber, etched glass, failed grout, stained silicone and faded paint all
      look like dirt from across a room. We would rather tell you which is which
      before you pay than afterwards."
when:
  heading: When people book one
  body:
    - type: paragraph
      text: "A deep clean is a one-off, so the question is usually when rather than
        how often. The six occasions that account for almost all of them:"
    - type: list
      items:
        - Moving in, before the furniture arrives, which is the easiest version
          of this job and the one that finishes best.
        - Before guests, particularly the ones staying a while over Christmas.
        - After a party, which is self-explanatory.
        - Before a property goes to market, because photographs are unforgiving
          and buyers read a dirty house as a neglected one.
        - The spring reset, or on this coast the after-the-wet reset, which
          lands a little later.
        - After a long absence, an illness, or a stretch where the house got
          away from you. This one is more common than the other five put
          together and nobody needs to explain it.
    - type: paragraph
      text: If none of those is you and the house just needs holding steady, a regular
        clean is the less expensive answer and we will say so.
