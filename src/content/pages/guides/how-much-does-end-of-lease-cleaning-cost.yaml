faq:
  heading: "End of lease cleaning costs: frequently asked questions"
  items:
    - question: How much does end of lease cleaning cost?
      answer: It is quoted per property rather than sold at a list price, because
        condition moves it more than size does. The quote is built from the
        property’s size, how it has been kept, whether it will be empty, how
        many wet areas there are, and which extras the place needs. Ask for the
        quote against a written task list so you can compare it to another one.
    - question: Why are two quotes for the same house so far apart?
      answer: Usually because one includes carpet steam cleaning, exterior windows or
        the oven and the other does not, and neither says so on the front page.
        Add the missing items to the lower quote before comparing. Very often
        that closes the whole gap, and sometimes it reverses which one is lower.
    - question: Is a bond clean more expensive than a deep clean?
      answer: Generally yes, for the same property. A deep clean is measured against a
        baseline you set; a bond clean is measured against someone else’s
        checklist and includes work a deep clean quotes separately, notably
        inside the oven and inside every cupboard. The two are different jobs at
        different standards, not the same job at two prices.
    - question: Does it cost more if the property is still furnished?
      answer: Yes, and by a lot. A furnished bond clean is roughly twice the work,
        because every surface has to be moved around rather than simply cleaned,
        and it still does not finish as well. Booking the clean for the day
        after the removal truck is the single least expensive decision available
        to you.
    - question: Do I need carpet steam cleaning as well?
      answer: It depends on your agreement, your state and the condition of the
        carpet. It is quoted separately by nearly every cleaner, so ask for it
        with the main quote rather than after the inspection. If it is being
        done, book it for after the clean rather than before, or the carpet is
        walked on damp all day.
    - question: What happens if the agent is not satisfied?
      answer: That depends on what the cleaner has committed to before you booked,
        which is why it is worth reading. Most offer a return visit within a
        stated window for items that were in the original scope. None of them
        can promise what an agent will write in a report, so treat a plain
        re-clean policy as the useful thing and a guarantee badge as the thing
        to read the terms of.
