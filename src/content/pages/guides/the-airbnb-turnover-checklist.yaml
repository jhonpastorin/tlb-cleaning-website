seo:
  title: The Airbnb Turnover Checklist | TLB Cleaning
  description: "A short-stay changeover checklist for Byron, Ballina, the Tweed
    and the Southern Gold Coast: the run in order, the linen and restock list,
    and the four things that cost hosts reviews."
hero:
  kicker: Guide · Homes and hosting
  headingLines:
    - Ten till two,
    - and nothing can be left to check later.
  lead: The short-stay changeover in the order it is worked, the linen and
    consumables list, and the four small things that generate most of the
    cleanliness complaints in this region.
  image:
    src: /src/assets/airbnb/airbnb-turnover-making-up-a-bed-with-fresh-white-linen.jpg
    alt: A cleaner making up a bed with fresh white linen in a bright coastal
      bedroom, hospital corners half-done
definition:
  body:
    - type: paragraph
      text: "An Airbnb turnover is the full changeover of a short-stay property
        between one guest checking out and the next checking in: strip and
        remake, clean, restock, reset and check. It is a hospitality job on a
        fixed clock rather than a domestic clean, and the difference shows in
        what gets checked rather than in what gets wiped."
    - type: paragraph
      text: The window in most of this region is checkout at ten and check-in at two,
        which is four hours minus travel, minus linen, minus whatever the last
        guest left behind. Everything below is arranged around that.
  backgroundImage: /src/assets/airbnb/airbnb-cleaning-cleaner-finishing-a-guest-ready-holiday-apartment.jpg
run:
  heading: The run, in order
  body:
    - type: paragraph
      text: The order matters more here than in a house clean, because a turnover has
        a deadline that does not move and two tasks at the end that cannot be
        hurried.
    - type: list
      items:
        - Walk it first, before touching anything. Two minutes with your phone
          out. Damage, missing items, anything left behind, anything that will
          need the owner told. After you have cleaned is too late to say what
          state it was in.
        - Strip everything. All beds, all towels, all bathmats, the tea towels
          and the kitchen cloths, whether or not they look used. Out of the
          property and into the car before the clean starts, so nothing gets
          remade over a wet surface later.
        - Kitchen first. Dishwasher on, fridge emptied and checked, bins out.
          The dishwasher runs while you do everything else, which is the single
          biggest time saving available in a turnover.
        - Bathrooms next, because they need dwell time and because a damp
          bathroom at the end of the run is the thing guests notice first.
        - Bedrooms and living areas, then make the beds. Beds are made after the
          room is cleaned, never before, and they are the job you must not be
          rushing.
        - Restock and reset. Consumables, welcome items, remotes and cushions
          back where the listing photos show them.
        - Floors last, backing out of the property.
        - Then the final look. Stand in the doorway of each room from where a
          guest first sees it and look at the room rather than at your list.
    - type: paragraph
      text: That final look is the step people drop when they are behind, and it is
        the step that catches almost everything the list does not.
checklist:
  heading: The changeover checklist
  lead: Six groups. Strip before you clean, make the beds after, and leave the
    floors until you are walking out.
  items:
    - heading: Arrival and inspection
      body:
        - Photograph anything broken, marked or missing, before touching it.
        - Check for items left behind, including in drawers, under beds and in
          the fridge.
        - Note anything the owner or manager needs to know today rather than at
          the end of the month.
        - Check the last guest actually left. It happens.
        - Open the place up. Windows and doors, air moving, especially after a
          humid week.
    - heading: Linen and beds
      body:
        - Strip every bed, used or not.
        - Check mattress protectors and pillow protectors, every time, not just
          when something is obvious.
        - Look at the mattress itself while it is bare. This is the only moment
          anyone ever does.
        - Make up with fresh linen, pressed or steamed if the listing photos
          show it that way.
        - Cushions, throws and bed runners back to the photographed arrangement.
        - Count what leaves and what returns. Linen loss is the quiet cost of
          hosting.
    - heading: Kitchen
      body:
        - Dishwasher emptied, then loaded and running early.
        - Fridge and freezer emptied of guest food, shelves wiped, seals checked.
        - Every item put back where the listing and the house guide say it lives.
        - Cutlery, crockery and glassware counted and checked for chips.
        - Kettle, toaster, coffee machine emptied, wiped and descaled as needed.
        - Oven, cooktop and rangehood, and the wall behind the cooktop.
        - Bins emptied, liners replaced, bin taken to the kerb if it is
          collection day.
        - Benches, splashback, sink and taps.
    - heading: Bathrooms
      body:
        - Shower screen, tiles, base and drain, including the hair in it.
        - Toilet inside and out, base and behind.
        - Vanity, basin, taps and mirror, front and edges.
        - Exhaust fan cover, which greys quickly in a coastal bathroom.
        - Fresh towels, hand towels and bathmats, folded to match the photos.
        - Consumables restocked and presented, not just left on the bench.
        - Floor last, and dry. A damp bathroom floor at check-in reads as
          unclean even when it is not.
    - heading: Living areas and outside
      body:
        - Surfaces, sills, skirtings and the tops of things guests do not see
          but photograph.
        - Remotes located, wiped, batteries checked, and put where the guide
          says.
        - Sofa cushions lifted, crumbs and sand out, cushions plumped and
          squared.
        - Glass doors and the sliding door track, which on this coast is always
          full of sand.
        - Balcony, deck or courtyard swept, outdoor furniture wiped, ashtrays
          and glasses cleared.
        - Barbecue cleaned if there is one, because nobody wants to be the guest
          who finds it.
        - Floors vacuumed including edges, then mopped, working backwards to the
          door.
    - heading: Restock and reset
      body:
        - Toilet paper, hand soap, dish liquid, dishwasher tablets, bin liners,
          laundry powder.
        - Tea, coffee, sugar and whatever the listing promises.
        - Welcome items presented the way they are photographed.
        - House guide, wifi details and keys back in place.
        - Air conditioning and heating off, or set to whatever the owner’s
          standing instruction is.
        - Lights, appliances and hot water as they should be for an empty
          property.
        - Lock up, and report anything outstanding before you leave the driveway.
failures:
  heading: The four things that actually cost you reviews
  lead: None of them are a missed surface. All four are quick to check once you
    know to look.
  items:
    - icon: spark
      title: Hair
      description: One hair on a pillow or in a shower base undoes an otherwise
        faultless turnover, because it is the one thing a guest reads as "nobody
        cleaned this". Check the drain, the base, the bed and the bathroom floor
        specifically, after you think you have finished.
    - icon: idea
      title: Smell, not dirt
      description: A closed-up coastal property in February smells damp within a day,
        and guests notice a smell before they notice a surface. Air the place
        while you work, run the exhaust fans, and if a property smells at the
        end of every turnover, that is a ventilation problem rather than a
        cleaning one.
    - icon: puzzle
      title: The thing that is missing
      description: A single wine glass, a missing remote, no dishwasher tablets, one
        bath towel short for a party of four. Guests forgive a smudge and
        complain about a shortfall, because a shortfall is something they have
        to solve on their holiday.
    - icon: target
      title: Sand and salt
      description: Specific to where we work, and it catches every new host. Sand in
        the sliding door track, in the sofa, in the shower base, on the deck.
        Salt haze on the glass facing the water. Both are invisible in your own
        home and glaring in someone else’s holiday.
photos:
  heading: Photograph on arrival, not on departure
  body:
    - A finished-property photo proves the place was clean. An arrival photo
      proves what state it was left in, which is the one that matters if
      something has to be raised with a guest. Take both, and take the arrival
      one before you have moved a single thing.
    - "The set worth having every time is short: each bedroom from the doorway,
      each bathroom, the kitchen bench, the living area, and a close-up of
      anything at all that is damaged, marked or missing. Timestamped, and kept
      somewhere that is not a phone that might be replaced next year."
    - None of this is about distrusting guests, almost all of whom are fine. It
      is that the alternative is arguing from memory about a property you clean
      fifty times a year.
notTurnover:
  heading: Two things a turnover is not
  lead: Both of the expensive mistakes hosts make with cleaning are scheduling
    mistakes rather than cleaning ones.
  items:
    - type: image
      image:
        src: /src/assets/airbnb/airbnb-turnover-cleaner-arriving-at-a-holiday-cottage-with-keys.jpg
        alt: A cleaner in an aqua polo arriving at the front door of a holiday cottage
          with a set of keys and a caddy
    - type: text
      heading: A turnover is not a deep clean, and it never becomes one
      body:
        - "A changeover holds a standard. It does not reach the standard, and it
          cannot: the tracks, the grout, the oven, the skirtings, inside the
          cupboards and the tops of things all need time that a four-hour window
          does not contain."
        - So a short-stay property needs a deep clean on a cycle of its own,
          booked into a gap between bookings, in addition to the turnovers.
          Hosts who skip that find the property slowly declines over a season
          while every individual turnover was done properly.
        - The honest scheduling advice is to book the deep clean when the
          calendar has a gap anyway, rather than waiting until a guest mentions
          the grout.
    - type: text
      heading: Linen is a logistics problem, not a cleaning one
      body:
        - "The turnover itself is rarely what runs late. What runs late is
          linen: not enough sets in rotation, one washing machine, a wet load on
          a humid day and a same-day changeover."
        - Three sets per bed is the number most hosts settle on eventually. One
          on the bed, one clean and ready, one in the wash. Two sets works until
          the day it does not, and the day it does not is always a Saturday in
          January.
        - Commercial linen hire solves it outright and costs more per changeover
          than washing at home. Whether that trade is worth it is a maths
          question about your occupancy, not a cleaning question.
    - type: image
      image:
        src: /src/assets/airbnb/airbnb-turnover-restocked-guest-essentials-on-a-kitchen-bench.jpg
        alt: "Restocked guest essentials arranged on a kitchen bench: soap, tea, coffee
          and folded tea towels"
ourService:
  heading: How we run them
  body:
    - type: paragraph
      text: We do turnovers across the Northern Rivers, the Tweed and the Southern
        Gold Coast, timed to the booking calendar rather than to a run sheet
        that suits us.
    - type: paragraph
      text: "The parts hosts usually want to settle before booking anyone are the same
        three every time: who supplies and launders the linen, who restocks the
        consumables and how that is billed, and what happens when a guest checks
        out late. Those answers are on our Airbnb and holiday let page rather
        than here, because they are commitments rather than general advice, and
        a guide is the wrong place to make a commitment."
    - type: paragraph
      text: "What is worth saying here is the general version: the property should be
        handed over by the same small team often enough that they notice when
        something is different, and there should be one number to ring when a
        guest is at the door and something is wrong."
