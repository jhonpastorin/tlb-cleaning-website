faq:
  heading: "Airbnb turnovers: frequently asked questions"
  items:
    - question: How long should an Airbnb turnover take?
      answer: "It depends on the property and how the last guests left it, but the
        constraint is usually the window rather than the work: checkout at ten
        and check-in at two leaves about four hours minus travel and linen. A
        one-bedroom apartment is comfortable in that. A four-bedroom house with
        a same-day changeover needs either two people or a later check-in."
    - question: What should be on an Airbnb cleaning checklist?
      answer: An arrival inspection with photos, a full strip of all linen and towels,
        kitchen with the dishwasher started early, bathrooms, bedrooms with beds
        made after cleaning, living areas and outdoor spaces, restocking of
        consumables, floors last, and a final look from each doorway. The last
        step catches more than the list does.
    - question: Do I need a deep clean as well as turnovers?
      answer: "Yes, on a cycle of its own. A turnover holds a standard within a
        four-hour window and cannot reach one: tracks, grout, ovens, skirtings
        and inside cupboards all need time a changeover does not have. Book it
        into a gap in the calendar rather than waiting for a guest to mention
        it."
    - question: How many sets of linen do I need?
      answer: "Three per bed is what most hosts settle on: one on the bed, one clean
        and ready, one in the wash. Two works until a same-day changeover lands
        on a humid weekend, and then it does not. Commercial hire removes the
        problem entirely at a higher cost per changeover."
    - question: What do guests actually complain about?
      answer: Hair, smell, something missing, and sand. Rarely a surface that was
        missed. A single hair in a shower base does more damage to a review than
        a dusty skirting board, a closed-up property in humid weather smells
        before it looks dirty, and a shortfall of towels or dishwasher tablets
        is a problem the guest has to solve on their holiday.
    - question: Should I use a cleaner or do turnovers myself?
      answer: "Plenty of hosts do their own and do them well. The point at which it
        stops working is usually not the cleaning, it is the calendar:
        back-to-back changeovers, a late checkout, or being an hour away on the
        day it matters. If a single missed turnover would cost you a booking,
        that is the answer."
