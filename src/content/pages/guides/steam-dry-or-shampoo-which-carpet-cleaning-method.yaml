seo:
  title: "Steam, Dry or Shampoo: Which Carpet Cleaning Method? | TLB Cleaning"
  description: "Hot water extraction, low-moisture dry cleaning and rotary shampoo
    compared: how each works, what it is genuinely good at, drying times, and
    which suits wool, viscose and a deadline."
hero:
  kicker: Guide · Homes and hosting
  headingLines:
    - Three methods, one of which
    - is not what its name says.
  lead: Hot water extraction, low-moisture dry cleaning and rotary shampoo. What
    each one actually does to a carpet, how long each takes to dry, and which
    one your floor and your deadline want.
  image:
    src: /src/assets/home_cleaning/appliances/carpet_and_rug/living-room-rug-with-a-worn-traffic-path.jpg
    alt: A living room rug with a visibly worn, darker traffic path running from the
      doorway past the sofa
definition:
  body:
    - type: paragraph
      text: "There are three carpet cleaning methods in common use: hot water
        extraction, low-moisture dry cleaning, and rotary shampoo. They differ
        in how much water goes into the carpet, how much soil comes back out,
        and how long the floor is out of action afterwards."
    - type: paragraph
      text: Steam cleaning and hot water extraction are two names for the same method,
        and neither involves steam. Heated water and cleaning solution are
        pushed into the pile under pressure and drawn straight back out with the
        soil in them. It is the method most carpet manufacturers name in their
        own care instructions, and it removes soil rather than redistributing
        it.
  backgroundImage: /src/assets/commercial_cleaning/carpet/commercial-carpet-extraction-in-an-open-plan-office.jpg
methodTable:
  heading: The three methods, side by side
  cornerLabel: What each one actually does
  lead: Read across a row rather than down a column. Every method here is
    legitimate; they are simply built for different jobs.
  columns:
    - label: Hot water extraction
    - label: Low-moisture / dry
    - label: Rotary shampoo
  rows:
    - label: How it works
      values:
        - Heated water and solution injected under pressure, vacuumed straight
          back out
        - A polymer or absorbent pad or compound that traps soil, then gets
          vacuumed away
        - Foaming detergent worked into the pile with a rotary brush, vacuumed
          once dry
    - label: How much soil it removes
      description: (Including what has settled at the base of the pile)
      values:
        - Most
        - The surface layer
        - The surface layer, and it leaves some behind
    - label: Typical drying time
      description: (Longer in a humid Northern Rivers summer, whichever method)
      values:
        - Several hours
        - Under an hour to a couple of hours
        - Several hours, then a second vacuum
    - label: Reaches the backing
      values:
        - yes
        - no
        - no
    - label: Risk of over-wetting
      values:
        - Real, and it is why technique matters
        - Very low
        - Moderate
    - label: Risk of leaving residue
      values:
        - Low if rinsed properly
        - Low
        - High, and it is this method’s main problem
    - label: Best for
      values:
        - An annual or six-monthly deep clean, and anything actually dirty
        - Maintenance between deep cleans, and floors that cannot be out of
          action
        - Little, now. It survives mostly on older commercial jobs
    - label: Named in most carpet makers’ care instructions
      values:
        - yes
        - Sometimes, as maintenance
        - no
  footnote: "The honest summary: extraction is the clean, low-moisture is the
    maintenance in between, and shampoo is the one that was superseded for a
    reason. A cleaner offering only the fast method for the annual deep clean is
    offering you a lighter job at a similar price."
methods:
  heading: The three methods in full
  lead: What is actually happening to the pile in each case, which is what decides
    the result.
  items:
    - type: image
      image:
        src: /src/assets/home_cleaning/appliances/carpet_and_rug/cleaner-extracting-a-wool-rug.png
        alt: A cleaner in an aqua polo and teal gloves kneeling to draw a carpet
          extraction wand across a pale wool rug
    - type: text
      heading: Hot water extraction, the one people call steam
      body:
        - A wand injects heated water and solution into the pile under pressure
          and vacuums it straight back out in the same pass. The soil leaves the
          building in the waste tank rather than being broken up and left in
          place.
        - "It is the most thorough of the three and the only one that reaches
          down to the base of the pile and the backing, which is where the grit
          that wears carpet out actually lives. It is also the one with a real
          technique requirement: too much water and not enough extraction is how
          a carpet ends up damp underneath and smelling of it a fortnight
          later."
        - Expect the floor to be out of action for a few hours, longer in humid
          weather. Air movement across the pile is what shortens that, not heat.
    - type: text
      heading: Low-moisture and dry methods
      body:
        - "A family of methods rather than one: encapsulation, where a polymer
          crystallises around each soil particle so it can be vacuumed out
          later; bonnet cleaning, where an absorbent pad on a rotary machine
          lifts soil off the tips of the pile; and dry compound, where absorbent
          granules are brushed in and vacuumed out."
        - All three are fast, use very little water, and dry quickly, which
          makes them genuinely useful in an office that has to open, a rental
          between guests, or a hallway that cannot be closed off. What none of
          them do is reach the bottom of the pile.
        - The caution with bonnet work specifically is that a rotary pad run
          hard on a cut pile can fuzz or distort it. It is a maintenance tool,
          and used as one it is fine.
    - type: image
      image:
        src: /src/assets/commercial_cleaning/carpet/commercial-carpet-extraction-along-an-office-corridor.jpg
        alt: A cleaner drawing a carpet extraction wand along an office corridor between
          workstation banks
    - type: text
      heading: Rotary shampoo, and why it faded
      body:
        - A foaming detergent is worked into the pile with a rotary brush, left
          to dry, and vacuumed out. It was the standard method for decades and
          it does lift a lot of surface soil, so a shampooed carpet can look
          impressive on the day.
        - Its problem is what stays behind. Detergent residue left in the pile
          does not stop being sticky, so it collects the next lot of soil, and
          the traffic lanes come back darker and faster than they were before
          the clean. If a carpet has been shampooed repeatedly, the fastest way
          to fix it is a proper extraction clean with a rinse step, which is the
          opposite of what most people expect.
        - You will still meet it, mostly on older commercial contracts and
          occasionally on a very low domestic quote. If a quote is unusually low
          and the method is not named, this is worth asking about.
fibre:
  heading: The method matters less than the fibre
  body:
    - "Before anyone chooses a method, somebody should establish what the floor
      is made of. A fitted synthetic carpet is forgiving. Wool is not: it takes
      less water, a gentler pH and much more care over drying, and it will felt
      or shrink if it is treated like nylon."
    - 'Viscose and rayon are the ones to be careful of, and they turn up
      constantly in the flat-weave rugs sold as "art silk" or "bamboo silk".
      They lose strength when wet and can mark permanently from clean water
      alone. A viscose rug wet-cleaned on the floor of a living room is usually
      not damaged, it is finished. Jute-backed rugs are the other trap:
      over-wetting browns them from the backing up, and the stain comes through
      the face of the rug days later.'
    - So the useful question to ask a carpet cleaner is not which method they
      use. It is what they will do to find out what your floor is, and what they
      will say if the answer is "this one should not be wet-cleaned here". A
      cleaner who has a fibre test and a referral for rug-plant work is telling
      you something about the whole job.
ourMethod:
  heading: Which one we use
  body:
    - type: paragraph
      text: We clean carpet and rugs by hot water extraction, because it is the method
        that removes soil rather than moving it around, and it is the one carpet
        makers name in their own care instructions.
    - type: paragraph
      text: That is not a claim that the fast methods are worthless. Encapsulation and
        dry compound have a real place in maintenance, particularly on
        commercial floors that cannot be closed for an afternoon, and our
        commercial carpet work is built around exactly that constraint. What we
        will not do is sell you a maintenance clean at the price of a deep one.
    - type: paragraph
      text: On rugs we look at the fibre before we look at the machine, and if a rug
        should go to a rug plant rather than be cleaned in your living room, we
        say so instead of taking the job.
choose:
  heading: How to choose, in six lines
  lead: Match the method to the job rather than to the price, and the decision
    makes itself.
  items:
    - icon: target
      title: If it is genuinely dirty, extract
      description: Traffic lanes, sand, pet hair worked into the pile, an annual or
        six-monthly clean. Nothing else reaches the base of the pile, and a
        surface method on a dirty carpet is money spent on the top third of it.
    - icon: spark
      title: If it has to be walked on tonight, go low-moisture
      description: A holiday let between guests, an office that opens at eight, a
        hallway nobody can close off. Fast drying is a real advantage and it is
        worth trading some soil removal for.
    - icon: puzzle
      title: If it is wool, ask about pH and drying before price
      description: Wool takes less water and gentler chemistry, and drying is where
        wool jobs go wrong. A cleaner who talks about drying before they talk
        about the machine is the one to book.
    - icon: idea
      title: If it might be viscose, do not let anyone wet it
      description: Flat-weave rugs sold as art silk or bamboo silk are the usual
        suspects. Get the fibre identified first. This is the one mistake on
        this page that cannot be undone.
    - icon: chart-bars
      title: If it is a bond clean, book the carpets after the clean
      description: Not before. Otherwise the carpet is walked on damp all day while
        the rest of the property is cleaned, and you have paid for the clean
        twice.
    - icon: spray-bottle
      title: If a quote is remarkably low, ask which method
      description: A very low price for an annual deep clean is usually a surface
        method priced as a deep one, or a shampoo. Both look fine on the day.
        Ask, and the answer will tell you what you are buying.
drying:
  heading: Drying, and why February is different
  body:
    - type: paragraph
      text: Humidity is the reason a carpet that dries in three hours in July takes
        most of a day in February. Air cannot take up moisture it is already
        holding, so on a still, humid afternoon on this coast a carpet simply
        stops drying.
    - type: paragraph
      text: "What actually helps:"
    - type: list
      items:
        - Air movement across the pile, not heat. A pedestal fan aimed low along
          the floor does more than an air conditioner set cold.
        - Ventilation as well as circulation. Moving humid air around a closed
          room achieves very little; get some of it out.
        - A dehumidifier if you own one, which beats both.
        - Staying off it, or walking on it only in clean socks. Bare feet and
          shoes both put back what was just removed.
        - Leaving furniture off it until it is dry. Timber legs on damp wool is
          how you get a stain shaped like a chair.
    - type: paragraph
      text: If a cleaner tells you an extraction clean in a humid February will be dry
        in an hour, they are either using a surface method or they have not been
        doing this on the Northern Rivers for long.
readNext:
  heading: Read next
  lead: The three guides that follow on from this one.
faq:
  heading: "Carpet cleaning methods: frequently asked questions"
  items:
    - question: Which carpet cleaning method is best?
      answer: For an annual or six-monthly deep clean, hot water extraction, because
        it is the only one of the three that removes soil from the base of the
        pile rather than the surface. Low-moisture methods are better when the
        floor has to be walked on within the hour. Rotary shampoo has largely
        been superseded because of the residue it leaves.
    - question: Is steam cleaning the same as hot water extraction?
      answer: Yes, and no steam is involved in either. Heated water and cleaning
        solution are injected into the pile under pressure and vacuumed straight
        back out with the soil. Nothing is being sterilised. "Steam cleaning" is
        simply the name that stuck with the public, and the trade name for it is
        hot water extraction.
    - question: How long does carpet take to dry?
      answer: An extraction clean is usually a few hours; low-moisture methods can be
        under an hour. Humidity changes both substantially, and on this coast in
        a wet February everything takes longer. Air movement across the floor
        helps far more than heat, and a dehumidifier helps more than either.
    - question: Can wool carpet and rugs be steam cleaned?
      answer: Wool can be wet-cleaned, but not the way a synthetic can. It needs less
        moisture, a gentler pH and much closer attention to drying, and treated
        like nylon it will felt or shrink. Ask any cleaner what they change for
        wool. If the answer is nothing, that is the answer.
    - question: Why did my carpet get dirty again so quickly?
      answer: Almost always detergent residue left in the pile. It stays tacky, holds
        the next lot of soil, and the traffic lanes come back darker than they
        were before the clean. It is the characteristic failure of shampoo
        methods and of any clean without a proper rinse step, and a rinsing
        extraction clean is what fixes it.
    - question: What about a rug that might be viscose?
      answer: Get the fibre identified before anybody puts water near it. Viscose and
        rayon, often sold as art silk or bamboo silk, lose strength when wet and
        can mark permanently from clean water alone. A rug like that belongs at
        a rug plant with a controlled dry, not on the floor of a living room.
