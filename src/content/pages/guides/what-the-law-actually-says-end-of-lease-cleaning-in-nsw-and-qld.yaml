seo:
  title: End of Lease Cleaning Laws in NSW and QLD | TLB Cleaning
  description: "What tenancy law in NSW and Queensland actually requires when you
    move out: the condition report standard, fair wear and tear, and whether a
    professional clean can be demanded."
hero:
  kicker: Guide · End of lease and tenancy
  headingLines:
    - The law asks how clean it is,
    - not who cleaned it.
  lead: What tenancy law in New South Wales and Queensland actually requires at
    the end of a tenancy, what "fair wear and tear" really means, and when a
    professional clean can and cannot be insisted on.
  image:
    src: /src/assets/home_cleaning/inside_your_home/end_of_lease_and_bond_cleaning/end-of-lease-property-manager-at-a-vacant-handover.jpg
    alt: A property manager standing at the kitchen bench of an empty rental with a
      tablet and a set of keys, taking notes at handover
definition:
  body:
    - type: paragraph
      text: End of lease cleaning is the cleaning a tenant does before handing back
        the keys, and in both New South Wales and Queensland the standard it is
        measured against is the condition the property was in when the tenancy
        started, fair wear and tear excepted. That standard is about the state
        of the property. It is not, on its own, a requirement to hire anybody.
    - type: paragraph
      text: The comparison is made against the condition report completed at the start
        of the tenancy. That document, not a general idea of "clean", is what an
        exit inspection is checked against, which is why a tenant who never
        filled theirs in properly is at a disadvantage before anyone picks up a
        cloth.
  backgroundImage: /src/assets/home_cleaning/inside_your_home/end_of_lease_and_bond_cleaning/end-of-lease-cleaner-wiping-out-an-empty-kitchen-cupboard.jpg
disclaimer:
  heading: This is a guide, not legal advice.
  body:
    - We clean properties, we do not practise law. What follows is a
      plain-English summary of how the process works in each state, written to
      help you read your own agreement and your own condition report. It is
      general information, it is not advice about your tenancy, and it can go
      out of date when a rule changes. The two regulators listed further down
      are the authorities, and both publish free, current guidance.
    - It is also worth saying plainly that we are a cleaning company writing
      about whether you are required to hire a cleaning company. The answer
      below is not the one that suits us best. It is the one that is true.
stateTable:
  heading: The same idea, two sets of paperwork
  cornerLabel: How it works on each side of the border
  lead: Our service area crosses the border at Tweed Heads, so plenty of people
    here move from one system to the other without realising the paperwork
    changed. The cleaning does not change much. This does.
  columns:
    - label: New South Wales
    - label: Queensland
  rows:
    - label: The law
      values:
        - Residential Tenancies Act 2010 (NSW)
        - Residential Tenancies and Rooming Accommodation Act 2008 (Qld)
    - label: The regulator
      values:
        - NSW Fair Trading
        - Residential Tenancies Authority (RTA)
    - label: Who holds your bond
      description: (Not the agent, and not the owner)
      values:
        - NSW Fair Trading, through Rental Bonds Online
        - The RTA
    - label: The document you are measured against
      values:
        - The condition report from the start of the tenancy
        - The entry condition report (Form 1a), compared with the exit report
          (Form 14a)
    - label: The cleaning standard
      values:
        - The condition at the start, fair wear and tear excepted
        - The condition at the start, fair wear and tear excepted
    - label: Where a disagreement goes
      values:
        - NSW Civil and Administrative Tribunal (NCAT)
        - The RTA's free dispute resolution service first, then QCAT
  footnote: "Both systems rest on the same idea: your bond is held by a government
    body rather than by the agent, and nobody can simply take money out of it
    because they are unhappy. If you and the agent disagree, somebody
    independent decides."
wearDamageDirt:
  heading: Wear, damage, dirt
  lead: Three different things, and only one of them is a cleaning job. Most bond
    arguments are really an argument about which category a mark belongs in.
  items:
    - heading: Wear is what time does
      body:
        - Carpet that has flattened along the hallway, paint that has faded on
          the sunny wall, a bench that has dulled, tapware that has lost its
          shine. Nobody did anything to cause it except live there for the
          length of a lease.
        - Cleaning cannot reverse any of it, and it is not supposed to. A clean
          returns a surface to its condition; it does not return it to its age.
    - heading: Damage is what an event does
      body:
        - A burn in the benchtop, a hole in the plaster, a torn flyscreen, a
          stain that went through the carpet backing. Something happened, on a
          particular day, that would not have happened just from time passing.
        - That is a repair question, not a cleaning question, and no cleaner can
          make it go away. What a good one can do is tell you which of your
          marks are which before the inspection rather than after it.
    - heading: Dirt is neither, and it is the only one cleaning fixes
      body:
        - Grease in the oven, soap scum on the screen, dust on the tracks, the
          ring in the toilet. None of it is wear and none of it is damage. It is
          simply not clean yet, and it is entirely within your control.
        - This is the part of the exit report that a bond clean is actually
          aimed at, and it is where almost every deduction that could have been
          avoided comes from.
    - heading: The condition report decides the argument
      body:
        - If a mark was there on day one and the report says so, it is not yours
          to fix. If a mark was there on day one and the report does not say so,
          you are arguing about memory, and memory loses.
        - Which is why the most valuable ten minutes of any tenancy are the ones
          spent filling in the entry report properly, with photographs, before
          the first box comes off the truck.
professionalCleaning:
  heading: '"Professional cleaning required" is not the end of the conversation'
  body:
    - A term in an agreement that requires the property to be professionally
      cleaned at the end of the tenancy, no matter what condition it is in, is a
      different thing from the legal standard, which is about condition. Plenty
      of agreements carry one anyway. Whether it can be enforced against you is
      a question about your agreement and your circumstances, and it is not
      settled by the words being printed on the page.
    - New South Wales is more specific than most people realise. The standard
      form agreement allows an additional term requiring carpets to be
      professionally cleaned, or the premises fumigated, at the end of the
      tenancy only where the tenant was permitted to keep an animal at the
      property. Outside that, a blanket professional-cleaning term sits on much
      shakier ground.
    - None of which means you should ignore a clause. It means you should read
      it, check it against what the regulator for your state publishes, and ask
      the agent which specific items on the report they say are outstanding. An
      agent who can name them is describing a cleaning job. An agent who cannot
      is describing a receipt.
regulators:
  heading: Where to check, rather than take our word for it
  lead: Both regulators publish current, free, plain-English guidance, and both of
    them outrank a cleaning company on this subject.
  items:
    - icon: idea
      title: NSW Fair Trading
      description: The authority for tenancies in Ballina, Byron, Lismore, Tweed and
        everywhere else on the New South Wales side. Holds your bond, publishes
        the standard form agreement, and runs a free enquiry line.
      href: https://www.fairtrading.nsw.gov.au/
    - icon: house
      title: Residential Tenancies Authority (Queensland)
      description: The authority for tenancies in Coolangatta, Currumbin, Palm Beach
        and north. Holds your bond, publishes the entry and exit condition
        report forms, and offers a free dispute resolution service.
      href: https://www.rta.qld.gov.au/
    - icon: target
      title: Your own tenant advocacy service
      description: Both states fund free tenant advice services independent of the
        regulator. If money is actually in dispute rather than merely discussed,
        that is the call worth making before the one to a cleaner.
      href: https://www.fairtrading.nsw.gov.au/
bond:
  heading: What actually happens to the bond
  body:
    - type: paragraph
      text: Your bond is not the agent’s money and it is not sitting in the agency’s
        account. It is lodged with a government body, and it comes back to you
        unless somebody makes a claim on it and that claim stands up.
    - type: paragraph
      text: "Broadly, and in both states, the sequence is the same:"
    - type: list
      items:
        - The tenancy ends and an exit inspection is done, compared against the
          condition report from the start.
        - If nothing is claimed, the bond is released to you.
        - If something is claimed, the other party is told what for and can
          agree or disagree.
        - If it is disputed, an independent body decides. In Queensland that
          starts with the RTA’s free dispute resolution; in New South Wales it
          goes to NCAT.
    - type: paragraph
      text: Each state sets its own time limits at almost every step of that list, and
        they are the detail most likely to change, so we have deliberately not
        put numbers on any of it. Get those from the regulator for your state,
        and get them early rather than after a deadline has passed.
practical:
  heading: So what does this mean for your move?
  body:
    - type: paragraph
      text: "So: nobody can make you produce a receipt for cleaning that the property
        did not need, and a clean you do yourself to the right standard is a
        clean. That is genuinely the law, and it is why this page does not tell
        you that you must book anybody."
    - type: paragraph
      text: What a bond clean actually buys you is the other three things. Somebody
        who has seen a few hundred exit reports and knows which lines get
        marked. The equipment for the jobs that beat a domestic kit, which in
        this region usually means the oven, the shower screen and the tracks.
        And a week of your life back at the exact point in a move where you have
        none left to spend.
    - type: paragraph
      text: If you decide that trade is worth making, our end of lease page publishes
        the full task list before you book, so you can hold the quote against
        it.
