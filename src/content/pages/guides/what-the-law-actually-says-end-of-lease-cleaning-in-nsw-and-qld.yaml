  heading: Read next
  lead: The three guides that follow on from this one.
faq:
  heading: "End of lease cleaning laws: frequently asked questions"
  items:
    - question: Do I legally have to get a professional end of lease clean?
      answer: In both New South Wales and Queensland the legal standard is the
        condition of the property at the end of the tenancy, measured against
        the condition report and allowing for fair wear and tear. It is a
        standard about condition, not about who does the work. A term in your
        agreement may say otherwise, and whether it binds you is a question for
        your regulator rather than for your agent.
    - question: What does "fair wear and tear" actually mean?
      answer: "It is the deterioration that happens from ordinary use over time:
        flattened carpet in a hallway, faded paint, dulled fittings. It is
        excluded from what a tenant has to put right at the end of a tenancy.
        Damage is different, because something specific caused it, and dirt is
        different again, because cleaning removes it."
    - question: Can the agent keep my bond for cleaning?
      answer: "Not on their own. The bond is held by NSW Fair Trading or by the
        Queensland RTA, not by the agency, and money only comes out of it by
        agreement or by decision. If a claim is made and you disagree with it,
        there is a process: the RTA’s dispute resolution in Queensland, and NCAT
        in New South Wales."
    - question: Does a lease clause requiring carpet cleaning stand up?
      answer: It depends on the state and on the clause. In New South Wales the
        standard form agreement permits an end-of-tenancy carpet cleaning or
        fumigation term only where the tenant was allowed to keep an animal at
        the property. Elsewhere, a blanket requirement that ignores the actual
        condition of the carpet is on weaker ground. Check yours with the
        regulator.
    - question: Is the standard "spotless" or "the same as when I moved in"?
      answer: The same as when you moved in, fair wear and tear excepted, which is a
        lower bar than spotless and a higher bar than tidy. If the entry report
        recorded a stain in the carpet before you arrived, that stain is not
        yours. If it recorded nothing and there is one now, the conversation is
        about the stain and not about the standard.
    - question: What if I am moving from NSW to Queensland, or the other way?
      answer: Then you are closing a tenancy under one system and opening one under
        the other, often in the same week and four kilometres apart. Two bonds
        with two different bodies, two condition reports on two different forms.
        The cleaning itself barely changes. The paperwork and the deadlines both
        do, so read each one on its own terms.
