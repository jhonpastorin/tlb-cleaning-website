seo:
  title: The End of Lease Cleaning Checklist | TLB Cleaning
  description: A room-by-room end of lease cleaning checklist for NSW and QLD
    rentals, in the order the job is actually worked, with the lines property
    managers mark first.
hero:
  kicker: Guide · End of lease and tenancy
  headingLines:
    - Everything that gets checked,
    - in the order to do it.
  lead: The full end of lease cleaning checklist for a rental in the Northern
    Rivers, the Tweed or the Southern Gold Coast. Room by room, top to bottom,
    floors last.
  image:
    src: /src/assets/home_cleaning/inside_your_home/end_of_lease_and_bond_cleaning/end-of-lease-cleaner-wiping-out-an-empty-kitchen-cupboard.jpg
    alt: A cleaner in an aqua polo wiping out an empty kitchen cupboard in a vacated
      rental, drawers open and bench cleared
definition:
  body:
    - type: paragraph
      text: An end of lease cleaning checklist is the room-by-room list of tasks a
        rental property is cleaned against before the keys are handed back. It
        exists because an exit inspection is a walk-through against a document,
        so the reliable way to pass one is to work from a document of your own.
    - type: paragraph
      text: The list below is the one TLB Cleaning works to across the Northern
        Rivers, the Tweed and the Southern Gold Coast. It is written so you can
        use it yourself. If you would rather not, our end of lease page prices
        the same list.
  backgroundImage: /src/assets/home_cleaning/inside_your_home/deep_cleaning/deep-cleaning-empty-room-on-moving-out-day.jpg
howTo:
  heading: Do two things before you touch anything
  body:
    - Find your condition report from the start of the tenancy and read it. It
      is the document your exit inspection is compared against, and anything
      already recorded on it is not yours to fix. People clean marks off walls
      that were photographed as pre-existing on day one, every single week.
    - Then photograph the property empty and clean, room by room, once you have
      finished. Not as evidence you distrust anyone, but because two months
      later nobody remembers what a laundry looked like, and a dated photo
      settles it faster than a conversation does.
order:
  heading: Work in this order
  body:
    - type: paragraph
      text: Most of the wasted hours in a bond clean come from working in the wrong
        order. Everything falls downwards, so anything you clean before the
        thing above it gets dirty again.
    - type: list
      items:
        - Empty first. A bond clean on a furnished property takes roughly twice
          as long and never comes out as well, because every surface has to be
          worked around instead of worked on.
        - Start the oven. Whatever you use in it needs time to sit, so it goes
          on before anything else and gets finished last. The same is true of a
          heavily marked shower.
        - Top to bottom in every room. Cobwebs, light fittings, fans, then walls
          and doors, then benches and skirtings, then floors.
        - Wet rooms before dry rooms. Kitchen, bathrooms and laundry carry the
          jobs that need soaking, so they get started early and revisited.
        - Windows, tracks and flyscreens before the final floors. Tracks in
          particular throw grit everywhere the moment you touch them.
        - Floors last, and work backwards out of the property. Vacuum every room
          including edges and corners, then mop your way to the front door.
        - Carpets last of all, if they are being steam cleaned. Book that after
          your clean, not before it, or you will walk over damp carpet all day.
    - type: paragraph
      text: A two-bedroom unit in reasonable condition is a solid day of work done
        this way. It is closer to two if you have never done one before, and the
        oven alone will surprise you.
checklist:
  heading: The checklist, room by room
  lead: Eight groups. Work the wet rooms first and the floors last, and tick as
    you go.
  items:
    - heading: Kitchen
      body:
        - "Oven: racks, trays, door glass inside and between the panes, seals
          and the cavity."
        - Cooktop, knobs and the trim around them.
        - Rangehood, filters and the underside of the canopy.
        - Every cupboard and drawer, inside and out, including the tops of the
          overheads.
        - Benchtops, splashback and the join behind the bench.
        - Sink, drain, plughole and taps, including the base of the taps.
        - The fridge cavity, its walls and the floor under where the fridge
          stood.
        - "Dishwasher: filter, seals, spray arms and the door edge."
        - Bin cupboard, and the smell in it.
        - Floors, including the edges, the corners and under the toe-kick.
    - heading: Bathrooms, ensuites and toilets
      body:
        - Shower screen, both faces of the glass, and the metal frame.
        - Shower tiles, grout, the base and the drain.
        - Bath, including the underside of the lip and the seal along the wall.
        - Vanity inside and out, drawers, and the join where it meets the wall.
        - Basin, taps, plughole and overflow.
        - Mirrors and the shelf or cabinet behind them.
        - Exhaust fan cover and the dust in the vents.
        - "Toilet: bowl, under the rim, seat and hinges, cistern, and the base
          and the floor around it."
        - Towel rails, hooks and the toilet roll holder.
        - Floors, skirting and the corners behind the door.
    - heading: Bedrooms and living areas
      body:
        - "Wardrobes inside: shelves, rails, drawers and the floor of the robe."
        - Wardrobe doors, tracks and mirrors.
        - Skirting boards, all of them, all the way round.
        - Doors, door frames, architraves and the tops of the doors.
        - Light switches, power points and the wall around them.
        - Ceiling fans, blades and the light fitting under them.
        - Cobwebs in the ceiling corners and above the curtain rails.
        - Air conditioner filters and the vent face.
        - Window sills, reveals and the inside of the glass.
        - Vacuum including edges, corners and under anything left behind, then
          mop.
    - heading: Laundry
      body:
        - Tub inside and out, taps and the plughole.
        - Behind and beside the washer and dryer, where they can be moved safely.
        - Dryer lint filter and the vent.
        - Cupboards and shelves inside and out.
        - Benches and the splashback.
        - Floor, including under the appliances and along the skirting.
        - The floor waste and its grate.
    - heading: Windows, tracks and screens
      body:
        - Inside glass in every room, including the sliding doors.
        - Tracks vacuumed first, then washed out, then dried.
        - Flyscreens brushed or washed and put back in the right window.
        - Frames, reveals and sills.
        - Outside glass where it can be reached safely from the ground.
        - Anything above ground level is a job for a pole system or a ladder and
          is not worth an injury.
    - heading: Walls, marks and spots
      body:
        - Spot clean scuffs and marks where the paint surface allows it.
        - Behind doors, along hallways and at switch height, which is where the
          marks actually are.
        - Light fittings and shades, and the insects in them.
        - Air vents and returns throughout.
        - Know when to stop. Scrubbing through low-sheen paint turns a mark into
          a repair, and a repair costs more than the mark did.
    - heading: Outside, balconies and garages
      body:
        - Sweep or blow the balcony, patio and entry.
        - Cobwebs under the eaves and around the doorframes.
        - Garage or carport swept out, including the corners.
        - Oil marks on the driveway or garage floor, if the report recorded none.
        - Bins emptied, rinsed and returned to where they live.
        - Garden and lawn to the state the agreement asks for, which is a
          gardening job rather than a cleaning one.
    - heading: The last twenty minutes
      body:
        - Every cupboard door and drawer opened and checked once more, because
          something is always still in one.
        - Remove your own rubbish. A bin left full is a line on the report.
        - Smoke alarms and remotes left where they belong, spare keys and fobs
          accounted for.
        - Photograph every room, empty and finished.
        - Mop out backwards and leave through the front door.
markedFirst:
  heading: The six lines that get marked first
  lead: Every one of them is quick to check, invisible while you live there, and a
    reliable tell for whether a clean was thorough.
  items:
    - icon: target
      title: The oven, every time
      description: It is the single most commonly marked item on an exit report and
        the one a domestic clean most often under-does. The glass between the
        door panels is the part people miss, and it is the part that gets
        photographed.
    - icon: spark
      title: Shower screens and grout
      description: Soap scum is a film rather than a mark, so it survives an ordinary
        wipe and reappears the moment the glass dries. If it still hazes when
        dry, it is still there.
    - icon: puzzle
      title: Window and door tracks
      description: Nobody thinks of them and everybody with a clipboard checks them,
        because they are the fastest way to tell whether a clean was thorough or
        fast.
    - icon: bloom
      title: Skirting boards and door tops
      description: Both are at the height an inspection notices and neither gets
        touched in ordinary life. Run a finger along the top of a door frame and
        you will see the point.
    - icon: idea
      title: Inside cupboards, and the fridge cavity
      description: Crumbs in an empty drawer, a sticky ring on a shelf, the floor
        under where the fridge stood. All of it invisible while you lived there
        and all of it obvious once the place is empty.
    - icon: chart-bars
      title: The exhaust fan in the bathroom
      description: Grey, furred and directly overhead in a small room with nothing
        else to look at. It takes two minutes and it is missed almost every
        time.
notCleaning:
  heading: Some of this list is not cleaning, and some of it is not yours
  body:
    - Gardens, lawns, repairs, painting and rubbish removal all appear on exit
      reports and none of them are cleaning. Read what your agreement actually
      requires and sort them separately, because a cleaner will not do them and
      a cleaning quote will not cover them.
    - Carpet steam cleaning, exterior windows at height, pest control and full
      wall washing are quoted as separate jobs by us and by nearly everyone
      else. They are on the checklist above because the property may need them,
      not because a standard bond clean price includes them. Ask for them with
      your quote rather than after the inspection.
    - And finishing this list is not a promise about the outcome. What an agent
      writes in a report is their call. Working to the list is how you give
      yourself the best case, not how you guarantee one — be wary of anybody who
      tells you otherwise.
