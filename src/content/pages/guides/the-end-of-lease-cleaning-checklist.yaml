faq:
  heading: "End of lease cleaning checklist: frequently asked questions"
  items:
    - question: How long does an end of lease clean take?
      answer: "A two-bedroom unit in reasonable condition is around a full day for one
        person working to this list, and closer to two if it is your first. A
        team of two on a three-bedroom house is usually most of a day. Condition
        matters far more than floor area: a well-kept four-bedroom can be
        quicker than a neglected two-bedroom."
    - question: What order should I clean in?
      answer: "Empty the property, start the oven soaking, then work top to bottom in
        each room: cobwebs and fans, then walls and doors, then benches and
        skirtings, then floors. Do the wet rooms early because they need
        revisiting, do windows and tracks before the final floors, and mop your
        way out the front door."
    - question: Do I have to clean the carpets?
      answer: That depends on your agreement, your state and the condition of the
        carpet, not on a general rule. Many leases raise it and some raise it
        only where a pet was kept. If carpets are being steam cleaned, book them
        after your clean rather than before, so nobody walks over damp carpet
        all day.
    - question: What do property managers check first?
      answer: The oven, the shower screen and grout, window and door tracks, the tops
        of doors and skirtings, inside cupboards and the fridge cavity, and the
        bathroom exhaust fan. They are all quick to check, all invisible during
        a tenancy, and all reliable signals of whether a clean was thorough or
        rushed.
    - question: Should I clean before or after I move my furniture out?
      answer: After. Always. A bond clean on a furnished property takes roughly twice
        as long, costs more if somebody else is doing it, and never comes out as
        well, because half the surfaces are being worked around. Book the clean
        for the day after the truck, not the day before.
    - question: Can I use this checklist if I hire a cleaner?
      answer: Yes, and you should. Hand it to whoever quotes and ask them which lines
        are in their price and which are extra. A quote that comes back matching
        the list is a scope of works. A quote that comes back as one number with
        no list attached is a guess you cannot compare to anything.
