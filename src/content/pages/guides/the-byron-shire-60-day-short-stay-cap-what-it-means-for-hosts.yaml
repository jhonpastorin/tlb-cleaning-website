faq:
  heading: "The Byron Shire cap: frequently asked questions"
  items:
    - question: What is the Byron Shire 60-day cap?
      answer: A limit of 60 days of letting per year for non-hosted short-term rental
        accommodation across much of Byron Shire, in place since late September
        2024. Non-hosted means the whole property is let while the host is not
        living there. Hosted letting, where the host is present on the property,
        is not subject to the cap.
    - question: Is my property in an exempt area?
      answer: Some precincts within the Shire are mapped as exempt and can still let
        all year, but whether a specific address falls inside one is a boundary
        question. Check it directly with Byron Shire Council rather than relying
        on a summary, a neighbour, or a page like this one. It is a five-minute
        question with an expensive wrong answer.
    - question: Does the cap apply outside Byron Shire?
      answer: No. It is a Byron Shire control. Ballina, Lismore, Tweed and the
        Queensland side of the border each sit under their own arrangements,
        which differ and change independently of one another. If you own in more
        than one area, check each of them separately.
    - question: What does a shorter letting season change about cleaning?
      answer: "Two things. Changeovers compress into peak weeks, so cleaning capacity
        has to be booked for the season rather than the booking. And the house
        is now empty for most of the year, which introduces a maintenance
        problem that constant occupancy used to solve on its own: dust, salt
        film, dry traps and, in a wet season, mould."
    - question: Does an empty holiday house really get mouldy?
      answer: On this coast, a closed-up house through a wet summer with no air moving
        through it is close to ideal conditions for it, particularly in
        wardrobes, behind bedheads and on the cold side of a bathroom wall. It
        is not caused by guests. Somebody opening the place up periodically
        through the wet is the least expensive prevention there is.
    - question: When should the off-season work be done?
      answer: A close-down clean straight after the last guest, a deep clean early in
        the quiet stretch, carpets and upholstery in winter when things actually
        dry, exterior work in late winter before the storms, and a pre-season
        reset with enough room before the first booking to fix whatever it
        finds.
