seo:
  title: "The Byron Shire 60-Day Short-Stay Cap: What It Means for Hosts | TLB
    Cleaning"
  description: What the Byron Shire 60-day cap on non-hosted short-term rentals
    covers, who it exempts, and what a shorter letting year changes about how a
    holiday property is cleaned and maintained.
hero:
  kicker: Guide · Homes and hosting
  headingLines:
    - Sixty days of guests,
    - and three hundred days of empty house.
  lead: What the Byron Shire cap on non-hosted short-term letting actually covers,
    and what a compressed letting year changes about cleaning, maintenance and
    scheduling a coastal property.
  image:
    src: /src/assets/locations/coastal-home-near-the-beach.jpg
    alt: A coastal home on a quiet street a short walk from the beach, shuttered and
      empty on a bright morning
definition:
  body:
    - type: paragraph
      text: The Byron Shire short-stay cap limits non-hosted short-term rental
        accommodation to 60 days of letting per year across much of the Shire.
        It has applied since late September 2024. Non-hosted means the whole
        property is let while the host is not living there; hosted letting,
        where the host is present, is not subject to the cap.
    - type: paragraph
      text: Some mapped precincts within the Shire are excluded and can still let all
        year. Whether a particular property sits inside or outside those
        precincts is a question of where the boundary falls, so it is settled by
        Byron Shire Council’s own map rather than by anything on this page.
  backgroundImage: /src/assets/home/service-airbnb-and-holiday-let-turnovers.jpg
policy:
  heading: Four things worth being clear on
  lead: Deliberately brief. The detail belongs with the Council and the planning
    portal, not with a cleaning company.
  items:
    - heading: It is about non-hosted letting
      body:
        - The cap applies to letting the whole property while you are not there.
          Letting a room, or a granny flat, while you live on the property is
          hosted letting and is treated differently.
        - That distinction does a lot of work, and it is the first thing to
          establish about any given property before working anything else out.
    - heading: Some areas are excluded
      body:
        - Parts of the Shire are mapped as exempt and can continue to let all
          year. Whether an address falls inside one is a boundary question, and
          boundary questions are answered by the map, not by what the neighbours
          are doing.
        - Check it directly with Byron Shire Council before making a decision
          that depends on the answer.
    - heading: Registration applies either way
      body:
        - Short-term rental accommodation in New South Wales has to be
          registered on the state register, and there is a code of conduct and a
          fire safety standard that come with it.
        - None of that is changed by the cap. A property inside an exempt
          precinct still has the same registration obligations as one that is
          capped.
    - heading: It only affects one side of our patch
      body:
        - This is a Byron Shire control. Ballina, Lismore, Tweed and the
          Queensland side of the border all sit under their own arrangements,
          which differ from each other and change independently.
        - If you own in more than one of those, do not assume what you learned
          about one applies to the next.
disclaimer:
  heading: We clean houses. We do not advise on planning controls.
  body:
    - "Everything above is a plain summary written to help a host work out which
      questions to ask. It is not planning advice, it is not legal advice, and
      it can go out of date the moment a control is amended. Two authorities
      hold the real answers: Byron Shire Council for the map and the local
      controls, and the NSW planning portal for registration and the statewide
      framework."
    - If a decision about your property turns on the answer, get it from them or
      from a planner, in writing. The rest of this page is about the part we do
      know something about, which is what happens to a house that is full for
      sixty days and empty for the rest.
authorities:
  heading: Where to get the real answer
  lead: Both of these outrank us on this subject, and the first one is the only
    place that can answer the question about your specific address.
  items:
    - icon: house
      title: Byron Shire Council
      description: The map, the local controls, and the answer to whether a specific
        address sits inside an exempt precinct. This is the one that matters for
        your property.
      href: https://www.byron.nsw.gov.au/
    - icon: office
      title: NSW Planning Portal
      description: "The statewide short-term rental accommodation framework: the
        register, the code of conduct and the fire safety standard, all of which
        apply regardless of any local cap."
      href: https://www.planningportal.nsw.gov.au/
effects:
  heading: What a compressed letting year actually changes
  lead: "This is the part we do know about: what happens to a property that is
    full for sixty days and closed for the rest."
  items:
    - heading: The turnovers compress into peak
      body:
        - Sixty days will not be spread evenly across a year. They will land in
          January, at Easter, over the school holidays and on event weekends,
          which is exactly when every other capped property in the Shire is also
          letting.
        - So the same number of changeovers now happens in a much smaller number
          of weeks, and the people who do them are the constraint. Peak-week
          cleaning capacity in this Shire was already tight before the cap and
          the cap concentrated it further. Book the season, not the booking.
    - heading: An empty coastal house is not a house at rest
      body:
        - Three hundred days closed up near the coast is its own maintenance
          problem, and it is the one most owners underestimate. Salt film builds
          on glass and hardware whether or not anybody is inside. Dust settles.
          Drain traps dry out and the smell comes back up through them. Insects
          find their way in and die on window sills.
        - And in a Northern Rivers wet season, a closed house with no air moving
          through it is the ideal place for mould to start, in wardrobes, behind
          bedheads and along the cold side of a bathroom wall. None of that is
          caused by guests. It is caused by the house being shut.
    - heading: The pre-season clean becomes a real job
      body:
        - "A property that let all year was continuously maintained by its own
          occupancy. A property that sits closed from May to December needs a
          proper reset before the first guest of the season, and it is a deep
          clean rather than a turnover: linen out of storage and aired, every
          trap run, glass done properly, the whole place opened up and dried
          out."
        - It costs far less to book that as a scheduled deep clean in a quiet
          week than to discover on the 23rd of December that it was needed.
    - heading: The long gap is an opportunity, if you use it
      body:
        - "The one genuine upside. Every job that used to be impossible to
          schedule around back-to-back bookings is now easy: carpets,
          upholstery, tile and grout, exterior washing, gutters, windows at
          height, the oven done properly."
        - Those jobs used to be squeezed into a Tuesday in June. Now there is a
          season for them, and a property maintained in the gap presents better
          in the sixty days that count.
    - heading: Every booking matters more
      body:
        - With fewer nights available, a single bad review carries more weight
          and a single cancelled booking is a larger share of the year. The
          tolerance for a turnover that ran late or a bathroom that was still
          damp at check-in goes down accordingly.
        - That is not a reason to panic. It is a reason to have the changeover
          run by someone who does it every week rather than by whoever is free,
          and to have a number to ring when a guest is at the door and something
          is wrong.
    - heading: Some properties change use, and that changes the cleaning
      body:
        - A number of owners in the Shire have moved to long-term or mid-term
          letting, or to hosted arrangements, since the cap. Whether that suits
          any particular property is a decision for the owner and their
          accountant, and we have no view on it.
        - "What it changes for us is straightforward: a tenanted property needs
          routine cleaning and an end of lease clean at the end rather than
          fifty changeovers, and a mid-term let sits somewhere between the two.
          It is a different service, not a smaller one."
patternTable:
  heading: Before the cap, and after it
  cornerLabel: What actually changed about running the property
  lead: For a non-hosted property inside the capped area. Nothing here is about
    revenue, which is your accountant’s question, not ours.
  columns:
    - label: Letting all year
    - label: Letting sixty days
  rows:
    - label: Changeovers per year
      values:
        - Spread across twelve months
        - Compressed into peak weeks
    - label: Booking cleaning capacity
      values:
        - Usually available at short notice
        - Needs to be locked in for the season
    - label: Deep cleans
      values:
        - Squeezed into whatever gap appears
        - Easy to schedule, and now necessary
    - label: Condition between guests
      values:
        - Maintained by constant use
        - Deteriorates quietly while closed
    - label: Mould and damp risk
      values:
        - Lower, because the house is aired constantly
        - Higher, and highest over a closed-up wet season
    - label: Cost of one bad turnover
      values:
        - One night out of many
        - One night out of sixty
    - label: Exterior work, carpets, gutters, windows
      values:
        - Hard to fit in
        - A whole off-season to do it in
  footnote: "The short version: fewer cleans, but each one matters more, and a new
    category of work appears that never existed when the house was never empty."
calendar:
  heading: The off-season, in order
  lead: Six jobs and roughly when to do them. Every one of them used to be
    impossible to schedule around back-to-back bookings.
  items:
    - icon: key
      title: Straight after the last guest
      description: A proper close-down rather than a changeover. Fridge emptied and
        left open, bins out, linen laundered and stored dry rather than left
        made up on beds, traps run, and the place left as ventilated as security
        allows.
    - icon: spray-bottle
      title: "Autumn: the deep clean"
      description: The reset the changeovers never had time for. Tracks, grout, oven,
        skirtings, inside cupboards, the tops of everything. Done once at the
        start of the quiet stretch rather than in a hurry at the end of it.
    - icon: puzzle
      title: "Winter: carpets and upholstery"
      description: The one time of year drying is not fighting humidity, and the one
        time a floor can be out of action for a day without costing a booking.
        This is the right window for it and there is no longer any excuse to
        skip it.
    - icon: house
      title: "Late winter: outside"
      description: Gutters, roof, exterior washing, windows and the driveway, before
        the storms rather than after them. A coastal property presents most of
        its wear on the outside and it is the first thing in a listing photo.
    - icon: idea
      title: "Through the wet: check on it"
      description: A closed house through a Northern Rivers wet season is where mould
        starts. Somebody should open it, look behind the wardrobes and along the
        cold walls, and run the exhaust fans, well before the pre-season clean.
    - icon: target
      title: "Before the first booking: the pre-season reset"
      description: Dust off every surface, glass done, linen out of storage and aired,
        hot water and appliances checked, and the whole property walked as a
        guest would walk it. Book it with room to fix what it finds.
