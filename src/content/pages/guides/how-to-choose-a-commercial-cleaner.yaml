faq:
  heading: "Choosing a commercial cleaner: frequently asked questions"
  items:
    - question: How do I compare commercial cleaning quotes?
      answer: "Send every tenderer the same written scope: areas, tasks, frequencies,
        periodic work, consumables and access. Without that, three quotes are
        three different assumptions and the numbers mean nothing. With it, the
        remaining differences are staffing, supervision and margin, which are
        the things you actually want to choose between."
    - question: What should I ask a commercial cleaner before signing?
      answer: Who does the work and whether they are employed or subcontracted, what
        insurance is current and in whose name, who controls keys and codes,
        what happens when someone is sick, who inspects the work and how often,
        and who answers the phone at seven in the morning. Then read the exit
        terms before the price.
    - question: Why is one commercial cleaning quote so much lower?
      answer: Divide the price by the labour hours the scope actually needs and look
        at the figure. It has to cover wages and on-costs, insurance, equipment,
        consumables, travel, supervision and margin. If it cannot, the quote is
        incomplete rather than efficient. Ask how many labour hours a week the
        price is based on.
    - question: Should I sign a long contract?
      answer: A defined initial term is normal and often gets you a better price,
        because it lets a contractor invest in your site. What to avoid is a
        rolling agreement with a long notice period, notice available only one
        way, an exit fee you find later, or price rises at the contractor’s
        discretion. Read those clauses before the number.
    - question: "Employed cleaners or subcontractors: does it matter?"
      answer: It changes who is accountable, who carries insurance, and how consistent
        the person attending your site is. Both models exist and both can be run
        well. What matters is that you know which one you are buying, and that
        the answer you are given matches the certificates you are shown.
    - question: How often should a commercial site be cleaned?
      answer: It varies by area rather than by site. Bathrooms and kitchens are
        usually the highest frequency, general areas lower, and periodic work
        such as carpets, hard floors, high dusting and glass sits on its own
        cycle. Set the frequency per area in your scope rather than buying a
        single site-wide number.
