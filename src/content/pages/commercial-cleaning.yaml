brandedFaq:
  heading: What local businesses ask us
  items:
    - question: Are we too small a business for you?
      answer: Not at all. A two person office matters to us as much as a large one
        does. We quote the same way, run the same set schedule and send the same
        team whatever the size, and small premises are a large part of what we
        already clean.
    - question: Who is actually in our building after hours?
      answer: The same small team each visit, in TLB uniform, and you can meet them
        before the first one. You will know their names, and keys and alarm
        codes stay with the same people rather than moving around a roster.
        There is one local number to ring if something is not right.
    - question: We are switching from another cleaner. How does that work?
      answer: We walk through the premises, agree the scope in writing, and set a
        start date that suits your notice period. You meet the team who will be
        doing the work before the first clean, so nobody gets shown around
        twice. Anything the last cleaner was doing that you want kept goes
        straight into the scope.
    - question: What if the standard slips after a few months?
      answer: Tell us and we will put it right. That is the deal. The scope is agreed
        in writing, so “done properly” means the same thing to both of us, and
        you can change the schedule whenever you need to.
    - question: Do we have to sign a contract?
      answer: No lock-in, no minimum term and no exit fee. The scope and the price per
        visit go in writing so both of us know what was agreed, not to tie you
        in. If the schedule needs to change, tell us and we change it.
faq:
  heading: Commercial cleaning questions
  items:
    - question: How often should an office be cleaned?
      answer: Most small offices settle on two or three cleans a week, and move to
        daily once headcount, foot traffic or client visits pick up. Bathrooms,
        kitchens and high touch surfaces need attention most often, whatever the
        rest of the schedule looks like. The right frequency comes down to how
        hard the space is actually used, and a quiet three person studio and a
        busy cafe are nothing alike. A walk-through settles it in ten minutes.
    - question: What is the difference between a regular clean and a deep clean?
      answer: "Regular cleaning is the recurring work that keeps a workplace usable:
        bins, bathrooms, kitchens, floors and high touch surfaces on an agreed
        schedule. A deep clean is periodic and heavier. Carpet extraction, high
        dusting, detailed fittings, skirtings, vents and the edges a routine
        visit does not reach. Most workplaces run regular cleaning year round
        and add a deep clean every few months, or after a fit out or a
        renovation."
    - question: Can commercial cleaning be done outside business hours?
      answer: Yes, and most of it is, either before you open or after you close, so
        your team is not working around cleaners. After hours work is usually
        priced differently, because weekday shifts that start early or finish
        late attract penalty rates under the Cleaning Services Award 2020, and
        so do weekends and public holidays. Ask for both options on your quote
        so you can see what each one actually costs.
    - question: Who supplies the cleaning products and equipment?
      answer: The cleaner does. A commercial cleaner brings its own vacuums, mops,
        chemicals and safety data sheets as part of the service. Consumables are
        the thing to check separately. Toilet paper, hand soap, paper towel and
        bin liners are sometimes in the rate and sometimes billed on top. Get it
        written into the scope before you sign anything.
    - question: Do cleaners need a Working With Children Check?
      answer: Yes, where the work is child related, so a childcare centre, preschool,
        school or similar. In NSW, child related work requires a current Working
        With Children Check, and the business engaging the worker is the one
        responsible for verifying it. Ask any cleaner to confirm which of their
        team hold a current check before they work anywhere children are
        present.
