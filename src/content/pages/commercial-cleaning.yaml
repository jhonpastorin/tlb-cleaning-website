definition:
  heading: What commercial cleaning covers
  body:
    - type: paragraph
      text: Commercial cleaning is the ongoing cleaning of a workplace, done to an
        agreed scope on a set schedule, usually before you open or after you
        close. Offices, clinics, venues, strata common areas, retail floors and
        kitchens. TLB Cleaning provides commercial cleaning services across the
        Northern Rivers and the Tweed.
    - type: paragraph
      text: Commercial cleaning, contract cleaning and office cleaning are three names
        for much the same job. What changes between them is the kind of
        workplace and how often we come, not how the work is agreed or how it
        gets checked. This page covers all of it.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
