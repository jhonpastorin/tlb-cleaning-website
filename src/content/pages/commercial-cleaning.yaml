worthKnowing:
  heading: Why two quotes for the same clean can look nothing alike
  body:
    - type: paragraph
      text: Contract cleaners in Australia are covered by the Cleaning Services Award
        2020, which sets a legal minimum for what a cleaner has to be paid,
        before you add super, insurance, equipment and travel. That floor is the
        same for everyone quoting your job.
    - type: paragraph
      text: So the gap between two quotes is almost never a gap in margin. It is a gap
        in hours, or in how many tasks are on the list. Work out which before
        you compare the numbers, because a lower price for fewer hours is a
        different product, not a better deal.
    - type: paragraph
      text: The number that matters is not the hourly rate. It is what is in the
        scope. Ask any cleaner exactly which tasks are included, how often they
        happen, and whether consumables like soap and paper are covered. We put
        ours in writing before we start, and we tell you straight when a clean
        has to happen after hours, because early starts, late finishes, weekends
        and public holidays all carry a penalty rate under the Award. No
        surprises, either way.
