method:
  heading: How our mattress cleaning service works, stage by stage
  lead: Five stages. Putting less water in is the skill, not more.
  items:
    - icon: target
      title: Stripped and checked
      description: "Bedding comes off and we look at what we are dealing with: the
        fabric, the seams, any existing marks and whether there is damage or
        damp underneath. Pillow top, quilted and foam surfaces all take slightly
        different handling."
    - icon: spray-bottle
      title: Vacuumed properly, both sides where we can
      description: A slow pass with a brush head across the surface, into the quilting
        and right along the piped seams, which is where everything collects. If
        the mattress can be turned safely we do the other side too. A lot of the
        result comes from this step alone.
    - icon: spark
      title: Marks treated individually
      description: Body oil marks, spills and old stains each need something
        different, and they are treated by what caused them. We will tell you
        before we start which marks are likely to lift and which have been there
        long enough to be permanent.
    - icon: chart-bars
      title: Low moisture extraction
      description: "A hand tool puts in as little solution as the job needs and pulls
        it straight back out. Deliberately restrained: the inside of a mattress
        cannot be dried out once it is wet, so putting less in is the whole
        skill."
    - icon: office
      title: Dried before the bed goes back together
      description: Air moved across the surface until it is dry to the touch, and we
        book mornings so it has the day. Drying time depends on the mattress,
        the airflow and the weather, and we will tell you what to expect on the
        day. We would rather come back another day than have you make up a
        bed that is not properly dry.
scope:
  heading: What a mattress clean does not do
  body:
    - A clean is not a repair and it is not a rescue. A mattress that has
      collapsed in the middle, lost its support or been soaked right through is
      at the end of its life, and cleaning it will not change that. If that is
      what we find, we will say so and you can put the money towards the
      replacement instead.
worthKnowing:
  heading: Why less water is the whole job
  body:
    - type: paragraph
      text: The thing that decides whether a mattress clean goes well is moisture, and
        it works the opposite way to how people expect. More water does not mean
        a better clean. A mattress is thick, dense and completely enclosed, and
        unlike a carpet you cannot lift it, get air underneath it and dry it
        out. Whatever soaks past the top few centimetres stays there. That is
        why a proper mattress clean uses as little liquid as it can get away
        with, and why anyone offering to shampoo or saturate one is offering you
        a damp mattress.
    - type: paragraph
      text: The other half is timing. We book mattresses in the morning so there is a
        whole day of airflow before anyone needs the bed, and we would genuinely
        rather move the booking than hand back something that is still cool to
        the touch. If a cleaner cannot tell you how long yours will take to dry,
        they have not thought about the part of the job that matters most.
