definition:
  body:
    - type: paragraph
      text: A professional mattress cleaning service is the deep cleaning of the
        mattress itself, not the bedding. It is done in your home with a
        hand-held extraction tool that puts a controlled amount of solution into
        the surface and draws it straight back out, so the top layers are
        cleaned without the mattress being soaked. TLB Cleaning cleans
        mattresses across the Northern Rivers and the Tweed.
    - type: paragraph
      text: It is worth doing because a mattress is the one soft thing in a house that
        never gets washed. Sheets go through the machine weekly, a mattress
        protector occasionally, and the mattress underneath absorbs sweat, body
        oil and skin for eight hours a night for years. Nothing about that is an
        emergency. It is just a job that quietly never gets done.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
