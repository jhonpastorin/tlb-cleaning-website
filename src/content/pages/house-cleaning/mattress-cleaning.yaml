faq:
  heading: Booking a mattress clean
  items:
    - question: Can we sleep in the bed that night?
      answer: That is the plan, and it is why we book mattresses in the morning. We
        use as little moisture as the job allows and get air moving across the
        surface before we leave. How long it takes depends on the mattress, the
        airflow and the weather. If it is a humid week we will tell you honestly rather than have you make
        the bed up over a damp mattress.
    - question: Do we need to strip the bed first?
      answer: It helps a lot if you can. Sheets, protector and pillows off, and
        somewhere to put them. If you would rather we did it, that is fine, just
        tell us when you book so we allow the time. We will not put the bedding
        back on until the surface is properly dry.
    - question: Will old stains come out?
      answer: Some will and some will not, and we will tell you which before we start.
        Recent spills usually lift well. Old marks that have gone through into
        the padding and dried there are often permanent, because the mark is no
        longer on the surface we can reach. Anyone promising a mattress will
        come back looking new has not seen it yet.
    - question: How often is it worth doing?
      answer: Every year or two suits most beds, and more often for a child’s bed or
        if someone in the house sweats heavily at night. Between cleans the
        useful habits are a washable mattress protector, washing it with the
        sheets, and airing the bed before you make it rather than pulling the
        covers straight up.
    - question: What happens if I get in touch?
      answer: Tell us how many beds, what size and roughly how old. We will give you a
        price and book a morning. It can go on the same visit as your regular
        clean, and most people do the whole house at once rather than one bed at
        a time.
nonBrandedFaq:
  heading: Mattress cleaning FAQs
  items:
    - question: Does mattress cleaning get rid of dust mites?
      answer: We are a cleaning business, not a health service, so we will not make
        claims about mites or what they do. What a clean actually does is remove
        dust, hair, skin and surface soil from the mattress and the seams. If
        mites or allergies are the reason you are asking, that is a question for
        your GP or a health service rather than for us, and be cautious of any
        cleaner who answers it confidently.
    - question: How long does a mattress take to dry?
      answer: Several hours for a properly done low moisture clean, and a full day is
        the safe assumption in humid weather. It depends almost entirely on how
        much liquid went in, how much air is moving through the room and the
        humidity that day. A mattress that is still cool to the touch is still
        wet inside, whatever the surface feels like.
    - question: Can a mattress be cleaned with a steam cleaner?
      answer: It is a poor idea for the same reason saturating one is. Steam puts heat
        and moisture into a thick enclosed item that cannot be dried from the
        other side, and moisture that gets down into the foam or springs has no
        way out. Low moisture methods exist precisely because a mattress cannot
        be treated like a floor.
    - question: Is it worth cleaning an old mattress?
      answer: It depends on what is left of it. If the mattress still supports you
        properly and has a few years in it, a clean is an inexpensive way to
        make it pleasant again. If it sags in the middle, has broken down at the
        edges or has been soaked through at some point, cleaning it is money
        spent on something that needs replacing.
    - question: How much does mattress cleaning cost?
      answer: Mattresses are usually priced per mattress by size, so a king costs more
        than a single, with a lower rate per bed when several are done in the
        same visit. Heavy staining or a mattress that has to be turned may add
        to it. That's why we quote rather than publish a flat rate that would be
        wrong for most homes. Tell us the basics and you'll have a price back
        quickly, with no obligation attached to it.
