definition:
  body:
    - type: paragraph
      text: Gutter cleaning is the removal of leaves, bark, silt and debris from the
        gutters, valleys and downpipes of a house so rainwater runs off the roof
        and away from the building. TLB Cleaning clears gutters across the
        Northern Rivers, the Tweed and the Southern Gold Coast, as a one-off or
        on a set schedule.
    - type: paragraph
      text: Gutters here fill faster than most. Eucalypts, paperbarks and tea trees
        drop leaves, bark and seed capsules right through the year rather than
        in one autumn, and a wet summer turns that into a packed mat that holds
        water instead of moving it. That is why a gutter three streets away can
        be fine while yours is overflowing.
  backgroundImage: /src/assets/home_cleaning/outside_your_home/clean-coastal-home-exterior.jpg
onTheDay:
  heading: What our gutter cleaning covers on the day
  lead: You will probably be at work, so here is the whole job.
  steps:
    - step: First
      heading: We look at what is actually in there
      body:
        - A gutter that looks full from the ground can be holding anything from
          dry leaf litter to a mat of soil with plants growing in it. We get
          eyes on it before we quote a schedule, because the two take very
          different amounts of time.
        - We also check the fall, the joins and the fascia while we are up
          there. If a gutter is rusted through or pulling away from the house,
          cleaning it will not fix the leak and we will tell you that instead of
          taking the money.
      image:
        src: /src/assets/home_cleaning/outside_your_home/gutter_cleaning/blocked-gutter-packed-with-leaves.jpg
        alt: A blocked house gutter packed with damp brown eucalypt leaves, bark and
          twigs, with a small seedling growing out of the debris and a stain
          running down the wall below
    - step: Then
      heading: It comes out by hand, into a bucket
      body:
        - Debris is lifted out by hand into a bucket on the ladder, not blown
          off the roof into your garden and not flushed down the downpipes to
          block them further along. Wet litter is heavy and it stains, so it
          goes into a bag on a tarp rather than onto your lawn.
        - Then the bags come with us. You should not be left with four wet sacks
          of leaf litter beside the bins and no way to get rid of them.
      image:
        src: /src/assets/home_cleaning/outside_your_home/gutter_cleaning/cleaner-bagging-gutter-debris-on-the-lawn.jpg
        alt: A cleaner in uniform on the lawn tipping a teal bucket of damp leaf litter
          into a grey garden bag on a tarpaulin, with a ladder against the roof
          edge behind her
    - step: Last
      heading: We flush it and check the downpipes
      body:
        - A clear gutter is only half the job. Water goes through with a hose to
          prove the fall is right and the outlets are running, because a blocked
          downpipe puts the overflow straight back over the edge in the next
          storm.
        - "You get told what we found: a sagging bracket, a rusted join, a
          downpipe that will not clear, a valley that fills every time. Small
          things now, rather than a wet ceiling in February."
      image:
        src: /src/assets/home_cleaning/outside_your_home/gutter_cleaning/clear-gutter-and-downpipe-after-a-clean.jpg
        alt: A completely clear house gutter, the bare metal channel empty and swept,
          with clean water running freely into an unblocked downpipe
ladder:
  heading: Please do not do this one yourself
  body:
    - Most gutter jobs go wrong in the same few ways. The ladder is set on soft
      garden bed or on a slope, it leans against the gutter rather than the
      fascia and flexes when weight comes on it, and then somebody reaches
      sideways for the last arm length of leaves instead of getting down and
      moving it. That last reach is the one that hurts people, and it happens on
      single-storey houses.
    - A fall from gutter height is not a small injury. If you are going to do it
      anyway, do it with someone else at home, keep your hips between the
      stiles, move the ladder rather than stretching and stay off it entirely in
      wind or after rain.
consequences:
  heading: What a blocked gutter actually costs
  lead: None of this shows up on the day it starts. It shows up in the storm after.
  items:
    - type: feature
      icon: bloom
      heading: Water into the roof, not off it
      body:
        - A packed gutter overflows backwards under the roof sheeting as often
          as it does over the front edge. That water gets into the eaves, the
          fascia and sometimes the ceiling, and the first sign is usually a
          stain that appears after a storm and never quite dries.
    - type: feature
      icon: idea
      heading: Rot, rust and mosquitoes
      body:
        - Wet leaf litter sits against the metal and holds it damp, which is how
          a gutter rusts from the inside. Standing water in a blocked section
          also breeds mosquitoes through summer, which is a nuisance you feel
          long before you notice the gutter.
    - type: feature
      icon: spark
      heading: Ember fuel in the wrong season
      body:
        - Dry leaf litter in a gutter is fuel sitting on top of your house,
          which is why fire services ask people to clear gutters before the
          bushfire season. Booking it in spring rather than after the first bad
          day is the whole point.
    - type: text
      heading: And the tank, if you have one
      body:
        - On a rural block the roof is often the water supply. Debris, bird
          droppings and the first flush off a dirty roof all end up in the tank,
          so we tell you before we flush anything and work around the diverter
          if there is one.
        - If the roof feeds drinking water, say so when you book. It changes the
          order we do things in.
