faq:
  heading: Booking a gutter clean
  items:
    - question: When is the best time to get our gutters done?
      answer: Late spring, before the storm season, and again in early autumn if you
        have trees over the roof. Spring also gets it done before the bushfire
        season, which is when fire services ask people to clear their gutters.
        If your ceiling has ever stained after a storm, do it now rather than at
        the next change of season.
    - question: What do you do with all the leaves?
      answer: They come out by hand into a bucket, go into bags on a tarp and leave
        with us. Nothing gets blown into your garden, flushed down your
        downpipes or left beside your bins. If you would rather keep it for
        compost, say so and we will tip it where you want it instead.
    - question: Can you do a two-storey house?
      answer: "Often yes, and it depends on access more than height: firm level ground
        for the ladder, room to set it at the right angle, and no power line in
        the way. [Confirm TLB’s height limit and what is declined.] If a section
        is not safe to reach we will say so and tell you what sort of operator
        can do it."
    - question: Do you need anything from us on the day?
      answer: Side access, the gate unlocked, dogs sorted out and cars moved off the
        driveway where we need to set a ladder. A tap we can use for the flush.
        If the roof feeds a rainwater tank, tell us when you book, because we
        work around the diverter.
    - question: What happens if you find damage up there?
      answer: We photograph it, show you and tell you what it is in plain words.
        Rusted joins, sagging brackets, a valley that fills every storm and
        cracked pointing on a tiled roof are the usual ones. We do not do roof
        repairs, so there is nothing in it for us either way.
nonBrandedFaq:
  heading: How often gutters need doing, and what it costs
  items:
    - question: How often should gutters be cleaned?
      answer: "Twice a year suits most homes, and once a year is enough only on a
        block with nothing overhanging the roof. With eucalypts, paperbarks or
        tea trees over the house it is realistically three or four times,
        because those trees shed bark and leaves all year rather than in one
        season. The roof tells you: if litter is visible from the ground, it is
        overdue."
    - question: What happens if you never clean your gutters?
      answer: Water stops leaving the roof properly. It backs up under the sheeting
        into the eaves and fascia, spills over the front edge onto garden beds
        and foundations, sits in the low sections and rusts the gutter from the
        inside, and breeds mosquitoes through summer. Dry litter also gives an
        ember somewhere to land in fire season.
    - question: Should gutters be cleaned by hand or with a blower?
      answer: By hand for anything damp or packed. A blower moves dry leaves quickly
        but sprays them across the roof and the garden, and it pushes fines
        straight into the downpipes, which is where the next blockage forms.
        Pressure washing a gutter does the same thing, and it can force water
        back under the roof sheeting.
    - question: Is gutter guard worth it?
      answer: It reduces the work rather than ending it. Good mesh keeps leaves and
        embers out and is genuinely useful under trees, but fine debris still
        builds up on top of it and in the valleys, so it needs checking. Guard
        installed badly can also hold litter against the roof. [Confirm whether
        TLB supplies or installs gutter guard.]
    - question: How much does gutter cleaning cost?
      answer: Gutter cleaning is usually priced on the length of gutter and the
        access, with a minimum charge for small jobs, and it moves with height,
        roof pitch, how packed the gutters are and whether valleys and a second
        storey are involved. Ask for a price against a written scope rather than
        an hourly rate. [TLB’s pricing basis and minimum charge. Confirm.]
