seo:
  title: Property Management Cleaning Services | TLB Cleaning
  description: Cleaning for rent rolls, with an employed local team, one point of
    contact and a re-clean commitment in writing. Add us to your panel.
buttonLabel: Add us to your panel
hero:
  kicker: Real estate and property management cleaning
  headingLines:
    - Property management cleaning services
    - for a whole rent roll
  subheading: Stop chasing cleaners between tenancies.
  lead: Property management cleaning services with the capacity for a rent roll,
    one point of contact and vacancy cleans that pass the first inspection.
    Working with agencies across the Northern Rivers, the Tweed and the Southern
    Gold Coast. {{line.fast}}
  image:
    src: /src/assets/real_estate/real-estate-cleaning-finishing-an-empty-vacated-rental.jpg
    alt: A cleaner in an aqua polo and dark teal apron finishing the last window of
      an empty, freshly vacated rental home, with the keys left on the kitchen
      bench
definition:
  body:
    - type: paragraph
      text: "Real estate cleaning is the cleaning a managing agency arranges rather
        than a tenant: vacancy cleans between tenancies, exit cleans measured
        against an outgoing condition report, and routine cleans on the
        properties an agency looks after. TLB Cleaning works with agencies and
        property managers across the Northern Rivers, the Tweed and the Southern
        Gold Coast."
    - type: paragraph
      text: A vacancy clean, an exit clean, a make-ready and a bond clean are close
        relatives with different payers. If you are a tenant cleaning your own
        place before the final inspection, the page you want is end of lease and
        bond cleaning. This page is for the person who has a vacancy on the
        board, a landlord asking when it will be listed, and no interest in
        ringing four cleaners to find out who is free.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
pathways:
  heading: Agencies hand us three kinds of job.
  headingAccent: Which one is on your desk?
  cards:
