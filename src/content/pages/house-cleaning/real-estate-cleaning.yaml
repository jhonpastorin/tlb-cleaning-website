bookingFaq:
  heading: Working with us on your rent roll
  items:
    - question: Can we trial you on a few properties first?
      answer: "Yes, and we would rather you did. Give us the difficult one: the tight
        window, the awkward exit condition, the property the last cleaner would
        not go back to. An easy job tells you nothing about how we handle a hard
        week, and there is no lock-in contract either way."
    - question: How quickly can you turn a vacancy around?
      answer: We can put more than one cleaner on a property, so a turnaround is
        limited by access rather than by one person’s day. [Our standard
        turnaround from keys to done, and how much notice we need for an urgent
        one. Confirm.] Tell us the photography or open-home date and we will
        work back from it.
    - question: What happens if the exit inspection fails on cleaning?
      answer: "We come back and fix it. [Our re-clean commitment: the window it
        applies in, what it covers, and whether it is free. Confirm.] What we
        will not do is argue with your report. If we missed something, we missed
        it, and the fastest route back to a released bond is us being there
        tomorrow."
    - question: How does invoicing work?
      answer: Referenced to the property so your team can code it without ringing us.
        [Whether we invoice the agency, the owner or the outgoing tenant, per
        job or consolidated monthly, and our terms. Confirm.]
    - question: Are your cleaners employed or subcontracted?
      answer: Employed, on our own team. That is what lets us tell you who is
        attending before they do, and cover a property from within the same team
        when someone is away. We are [insured] and [police-checked], and there
        is one local number to ring.
generalFaq:
  heading: Property management cleaning services, common questions
  items:
    - question: What is the difference between a vacancy clean and a routine clean?
      answer: "A routine clean maintains a property somebody lives in: surfaces,
        floors, bathrooms and kitchen, on a schedule. A vacancy or exit clean
        resets an empty property to the standard a written condition report is
        measured against, which brings in everything a routine clean reasonably
        leaves alone. That means inside the oven and rangehood filter, window
        tracks and sills, fan blades, light fittings, skirtings, inside
        cupboards and wardrobes, and walls where they are marked. It is a
        different scope and a different price, and it takes two to four times as
        long."
    - question: Can a tenant be required to have the property professionally cleaned?
      answer: "Not as broadly as many agreements imply. In both NSW and Queensland a
        tenant’s obligation is generally to leave the property in the same
        condition it was in at the start, fair wear and tear excepted. That is a
        comparison against the entry condition report rather than a
        professional-cleaning receipt. Blanket clauses requiring professional
        cleaning or professional carpet cleaning regardless of condition are the
        ones most often challenged, and pets can change the position. This is
        general information rather than advice: check the current requirements
        with NSW Fair Trading or the Queensland RTA, and read our guide on what
        the law actually says."
    - question: "Who pays for the bond clean: the tenant, the landlord or the agency?"
      answer: Usually the outgoing tenant arranges and pays for it, because it is
        their obligation to return the property in the agreed condition. The
        agency arranges and bills it to the owner where the tenant has not done
        it, where the tenant has vacated without cleaning, or where it is a
        make-ready between tenancies rather than an exit obligation. Deducting a
        cleaning cost from a bond is a separate process with its own evidence
        requirements, and it needs the condition report to support it.
    - question: How long does a vacancy clean take?
      answer: A two-bedroom unit is usually four to six hours for one cleaner. A
        four-bedroom house with two bathrooms is a full day, or half a day with
        two or three cleaners on it, which is how a same-week turnaround gets
        done. Carpet cleaning and exterior washing are separate jobs on top, and
        carpet needs drying time before the photographer arrives, which is the
        scheduling trap on a tight vacancy.
    - question: What should an agency ask a cleaner before adding them to a preferred
        trades list?
      answer: "Five things, and none of them is the price. How many cleaners do you
        employ rather than subcontract. What happens to my job when the usual
        person is away. What is your commitment if an exit inspection fails on
        cleaning. Are you insured, and can I see the certificate of currency.
        And how do you invoice: per property, referenced how, on what terms. A
        cleaner who answers all five without hedging is a different proposition
        from the lowest quote."
closingCta:
  kicker: Real estate and property management cleaning
  heading: Give us the difficult property.
  lead: The one with the tight window or the awkward exit condition. That is the
    job that tells you something, and it is a better trial than the easy one. No
    lock-in, no obligation.
