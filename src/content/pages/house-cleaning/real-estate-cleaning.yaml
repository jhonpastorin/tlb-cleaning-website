        src: /src/assets/real_estate/real-estate-cleaning-two-cleaners-arriving-at-a-rental-house.jpg
        alt: Two cleaners in aqua polos and dark teal aprons walking up the front path
          of a well-kept coastal rental house, each carrying a cleaning caddy
      title: A vacancy, and a window that is already too tight
      description: Keys back Friday, photos Monday, open home Saturday. We can put
        more than one cleaner on a property to compress a turnaround, which is
        the whole reason to use a team rather than a sole operator on a vacancy.
    - image:
        src: /src/assets/home_cleaning/inside_your_home/end_of_lease_and_bond_cleaning/end-of-lease-property-manager-at-a-vacant-handover.jpg
        alt: A property manager reviewing a vacant handover in an empty rental kitchen,
          keys on the benchtop
      title: An exit clean that has to pass first time
      description: "Cleaned against the condition report, not against a general idea
        of tidy: ovens, tracks, fans, filters and the marks that get written up.
        The second inspection is the expensive one, for you and for the tenant."
      cta:
        label: End of lease standard
        href: /house-cleaning/end-of-lease-cleaning/
    - image:
        src: /src/assets/real_estate/real-estate-cleaning-routine-clean-in-a-tenanted-rental-kitchen.jpg
        alt: A cleaner in an aqua polo and dark teal apron wiping down the benchtop of a
          tidy, furnished rental kitchen during a routine scheduled clean
      title: Standing work across the rent roll
      description: Routine cleans on managed and holiday-let properties, common areas,
        and the owner-occupied jobs your landlords ask you to recommend somebody
        for. A local business, [insured] and [police-checked], with one number
        to ring.
      cta:
        label: Why TLB
        href: /why-tlb/
workingWithUs:
  heading: What working with us looks like
  lead: An agency is not buying a clean. It is buying not having to think about
    the clean, so this is the operational side rather than the task list.
  items:
    - icon: suitcase
      title: One contact, not a phone tree
      description: You send the job to one place and it is booked. You are not
        managing which cleaner is free, chasing a confirmation or explaining the
        property twice. When something needs a decision, the person who rings
        you knows the job.
    - icon: chart-bars
      title: Capacity, in writing
      description: A vacancy does not wait for one person to be free, and two or three
        of our team can go on a property to compress a turnaround. [How many
        vacancy cleans a week we can absorb, and our standard turnaround from
        keys to done. Confirm, this is the number that wins the trial.]
    - icon: target
      title: Cleaned against the condition report
      description: We clean to the standard the exit inspection is measured against,
        not to a general idea of clean. That means the oven, the rangehood
        filter, window tracks, fan blades, skirtings and the spots that reliably
        get written up.
    - icon: spark
      title: If it fails on cleaning, we come back
      description: "A re-clean is not a negotiation and not an invoice. [Our re-clean
        commitment: the window it applies in, what it covers, and whether it is
        free. Confirm. Word it as a re-clean, never as a bond back guarantee, no
        cleaner controls whether a bond is returned.]"
    - icon: office
      title: Invoicing that suits your trust accounting
      description: Referenced to the property so it can be coded without a phone call.
        [Whether we invoice the agency, the owner or the outgoing tenant, per
        job or consolidated, and our terms. Confirm.]
    - icon: idea
      title: You hear about it from us first
      description: Damage, something abandoned, a property that was worse than the
        notes said, or work that needs an owner’s approval before we do it, you
        get told while you can still act on it, with photos, not after the fact.
worthKnowing:
  heading: The quote is not the cost. A second inspection is the cost.
  body:
    - A clean that comes in eighty dollars under still has to pass someone
      else’s written report. When it does not, the cost is not the eighty
      dollars. It is your re-inspection, the days the property sits unlisted,
      the landlord asking why, and the tenant who now has a dispute with you
      rather than with the cleaner.
    - That is why agencies here tend to procure on capacity and communication
      rather than on price, and it is why we would rather be trialled on a hard
      property than an easy one.
rentRoll:
  heading: What a rent roll actually needs from a cleaner
  body:
    - type: paragraph
      text: A rent roll does not produce vacancies evenly. They arrive in clusters, at
        the end of the month and around the school terms, and a cluster is the
        week that decides whether a cleaning arrangement is working. Four exits
        in one week is a capacity question, not a quality question, and it is
        worth asking about before the week arrives rather than during it.
    - type: paragraph
      text: "The same is true of absence. Somebody is away, or unwell, or has taken
        other work, and the question is simply whether the arrangement continues
        without you having to do anything. Ours does: the property goes to
        somebody else on the same team, and you hear about it from us rather
        than finding out when the photographer arrives."
    - type: paragraph
      text: Three questions sort it out quickly, and they are worth asking us as
        readily as anyone else. How many people do you actually employ, as
        opposed to subcontract? What happens to my job when the person who
        normally does it is away? And who answers the phone at four on a Friday
        when the keys have come back and the property is worse than the notes
        said?
