faq:
  heading: Frequently asked questions
  items:
    - question: Will the mould come back after you clean it?
      answer: If the moisture that grew it is still there, yes. Cleaning removes the
        growth, it does not change the conditions. Where the cause is
        ventilation or a habit we can often point out a fix that costs nothing.
        Where it is a leak or a failed seal, it needs a trade, and we will say
        so rather than sell you the same clean twice.
    - question: Is mould in my home a health risk?
      answer: That is not a question a cleaning company should be answering, so we do
        not. NSW Health and Queensland Health both publish guidance on damp and
        mould in the home, and your GP is the right person for anything about
        your own family. We can tell you what we can see and remove what is on
        the surface.
    - question: Does bleach kill mould?
      answer: Not reliably. Queensland Health’s advice is that bleach may not be
        effective on porous surfaces like plaster, grout and unsealed timber,
        even though the stain disappears and the surface looks clean. White
        vinegar is the other thing people reach for, and it should never be
        mixed with bleach. If the same spot keeps coming back after a bottle of
        something, the product is not the problem, the moisture is.
    - question: Can you get rid of mould permanently?
      answer: Not by cleaning, and nobody can. Permanent means the moisture is gone,
        and moisture is a building matter rather than a cleaning one. What lasts
        is a clean plus whatever fixes the cause, whether that is running the
        fan properly or getting a plumber in. We do the first part and tell you
        honestly about the second.
    - question: How do I know if it is surface mould or something worse?
      answer: Spotting on sound paint, silicone, grout or a window reveal is usually
        surface. Paint that is bubbling, lifting or soft, plaster that gives
        when you press it, a musty smell with nothing visible, or growth that
        keeps spreading after cleaning all point to moisture behind the surface.
        Send us a photo and we will give you a straight answer before you book.
    - question: What if the job turns out to be too big for a clean?
      answer: We tell you, at no cost, and we do not take the booking. Mould inside a
        cavity, mould after a leak or a flood, or mould across a large area
        needs a licensed remediation specialist, a plumber or a builder.
        Cleaning the surface of a problem like that hides it for a few weeks and
        takes your money for nothing.
    - question: Can you clean black mould out of shower silicone?
      answer: Sometimes. If it is sitting on the surface it usually comes off. If the
        silicone has gone black the whole way through, it has failed rather than
        got dirty, and no amount of cleaning brings it back. In that case it
        needs replacing, which is a small job for a handyman or a bathroom
        trade, and we will tell you which one you have.
    - question: Why is mould so common in the Northern Rivers?
      answer: Warm, humid and wet for a good part of the year, which is close to ideal
        for it. Add homes that get closed up between guests or holidays,
        bathrooms with weak extraction and cool outside walls with wardrobes
        pushed against them, and it turns up in the same handful of places in
        house after house across the region.
    - question: Can you do the mould as part of a bond clean?
      answer: Yes, and it is worth booking them together, because an exit inspection
        looks closely at exactly the surfaces mould likes. Tell us it is there
        when you book the bond clean so it is quoted properly and the right
        amount of time is allowed, rather than being found on the day when the
        schedule is already set.
    - question: Do you bring your own products and equipment?
      answer: Yes, everything. If you would prefer particular products used in your
        home, or someone in the house is sensitive to something, tell us when
        you book and we will work with that.
    - question: How much does mould cleaning cost?
      answer: It depends on how much there is, what it is growing on and how much of
        it can actually be cleaned, which is why we quote rather than publish a
        rate. A photo with your enquiry gets you an accurate price much faster,
        and it lets us tell you early if this is a job for a trade instead.
closingCta:
  heading: Tell us what you are looking at.
  lead: Send a photo with your enquiry and you will get an honest answer,
    including if the answer is that you need a trade rather than a cleaner.
