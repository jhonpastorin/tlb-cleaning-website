seo:
  title: Mould Cleaning Services & Removal | TLB Cleaning
  description: Mould cleaning and removal for humid coastal homes, done safely and
    properly. Bathrooms, walls, ceilings and wardrobes. Book an inspection
    today.
hero:
  headingLines:
    - Mould cleaning services and mould removal that gets it off
  lead: Our mould cleaning services cover bathrooms, walls, ceilings and wardrobes
    right across the Northern Rivers, the Tweed and the Southern Gold Coast.
    Mould removal on the surfaces you can see, and an honest answer about what
    is feeding it. {{line.fast}}
  image:
    src: /src/assets/home_cleaning/inside_your_home/mould_cleaning_and_removal/mould-cleaning-cleaner-wiping-a-kitchen-window-frame.jpg
    alt: Cleaner reaching up with a cloth to wipe down a kitchen window frame
definition:
  body:
    - type: paragraph
      text: Mould is a fungus that grows on damp indoor surfaces, which is why it
        turns up on bathroom ceilings, window reveals, wardrobe backs and the
        cool outside walls of a room. It needs moisture, and it stops needing
        anything else once it has that. TLB Cleaning provides mould cleaning
        services right across the Northern Rivers, the Tweed and the Southern
        Gold Coast, on surfaces rather than inside walls.
    - type: paragraph
      text: Mould cleaning and mould removal are the same job by two names. What both
        of them mean, done honestly, is removing the growth from the surface it
        is on. What neither of them means is fixing the reason it grew there,
        and that difference is most of this page.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
pathways:
  heading: Mould turns up three ways here.
  headingAccent: Which one is yours?
  cards:
    - image:
        src: /src/assets/home_cleaning/inside_your_home/mould_cleaning_and_removal/mould-cleaning-spotting-along-a-bathroom-cornice.jpg
        alt: Dark spotting along the cornice line of a clean bathroom ceiling above a
          shower
      title: It's in the bathroom and it looks awful
      description: The most common one, and the most straightforward. Ceilings,
        cornices, silicone lines, grout and window reveals. We clean it off and
        tell you what we saw behind it.
      cta:
        label: Get a fast quote
        href: /contact/
    - image:
        src: /src/assets/home_cleaning/inside_your_home/deep_cleaning/deep-cleaning-empty-room-on-moving-out-day.jpg
        alt: Empty room on moving-out day
      title: I'm moving out and there's mould
      description: Then it sits inside the bond clean rather than beside it, because
        the exit inspection is going to look at exactly those surfaces. Book the
        two together.
      cta:
        label: End of lease and bond cleaning
        href: /house-cleaning/end-of-lease-cleaning/
    - image:
        src: /src/assets/home_cleaning/inside_your_home/mould_cleaning_and_removal/mould-cleaning-condensation-on-a-bedroom-window.jpg
        alt: Condensation running down the inside of a bedroom window on a humid morning
      title: It keeps coming back
      description: Then cleaning is not your problem, moisture is, and someone has
        probably already cleaned it once. Here is what is actually going on.
      cta:
        label: Why it comes back
        href: "#moisture"
surfaces:
  heading: Where it turns up, and what we do about it
  lead: Mould grows in the same handful of places in house after house on this coast.
  items:
    - heading: Bathroom ceilings and cornices
      body:
        - The single most common place we are called to, because a bathroom
          makes its own weather twice a day. Ceilings, cornices, the wall above
          the shower and the corners where the extraction fan never quite
          reaches.
    - heading: Silicone, grout and shower seals
      body:
        - Grout lines, shower bases and the silicone beads around baths and
          screens. Some of it cleans up completely. Silicone that has gone black
          all the way through has failed rather than got dirty, and it needs
          replacing rather than scrubbing. We tell you which one you have.
    - heading: Window reveals, sills and tracks
      body:
        - Where the condensation sits every morning through winter and never
          quite dries before the next night. Reveals, sills, the tracks
          underneath and the rubber seals along the frame.
    - heading: Wardrobes, cupboards and behind furniture
      body:
        - Cool outside walls with something pressed against them and no air
          moving. Wardrobe backs and floors, the wall behind a bedhead, the back
          of a linen cupboard. Usually found by smell before it is found by
          sight.
    - heading: Walls, ceilings and painted surfaces
      body:
        - Surface growth on sound paint, cleaned back. Where the paint is
          already lifting, bubbling or soft, the moisture is behind it rather
          than on it, and cleaning the face of it achieves nothing that lasts.
          We say so instead of doing it.
    - heading: What we look at while we are there
      body:
        - Whether there is an extraction fan and whether it works, where the air
          does and does not move, and anything obviously wet that should not be.
          Not an inspection and not a report, just a set of eyes and an honest
          answer at the end of it.
scope:
  body:
    - "Quoted separately: carpet and rug cleaning, upholstery and mattress
      cleaning, and full wall washing where the mould has spread well beyond
      spotting. Ask for these with your quote so the whole job is priced once,
      rather than half of it being discovered on the day."
    - "Not a cleaning job at all: mould inside a wall or ceiling cavity, mould
      that follows a burst pipe, a roof leak or a flood, mould across a large
      area of a home, or paint and plaster that has gone soft. Those need a
      plumber, a builder or a licensed remediation specialist, and cleaning the
      surface will only hide the problem until it comes back. If that is what we
      find, we will tell you on the spot and we would rather lose the job than
      take it."
climate:
  heading: Why it happens here
  lead: This is a mould climate. It is not a reflection on how you keep your house.
  items:
    - heading: The humidity is the whole story
      body:
        - A warm subtropical coast with a wet summer is close to ideal growing
          conditions for most of the year. Homes here get damp in ways the same
          house would not three hours inland.
    - heading: Houses that get shut up
      body:
        - Holiday homes between guests, a place left while the owners are away,
          a spare room nobody opens. Air stops moving, humidity settles, and
          mould does the rest quietly with nobody there to notice.
    - heading: Bathrooms with nowhere for the steam to go
      body:
        - An extraction fan that vents into the roof space instead of outside,
          or one that was never fitted, or a window nobody opens in winter. The
          moisture has to go somewhere and it goes into the ceiling.
safety:
  heading: Three things worth not doing first
  body:
    - Do not dry-brush, dry-scrape or vacuum it while it is dry. Disturbing
      mould dry is how the spores leave the surface and go everywhere else in
      the room, which turns one job into four.
    - Never mix bleach with ammonia, with a cleaner containing ammonia, or with
      other cleaning products. That combination produces a dangerous gas, and it
      is a genuine risk in a small, closed bathroom. If you are not sure what is
      in the bottle, do not combine it with anything.
    - Do not assume bleach has fixed it. Queensland Health’s advice is that
      bleach may not be effective at killing mould on porous surfaces like
      plaster, grout and unsealed timber, even though the stain lifts and the
      surface looks clean. White vinegar is the other common choice, and it
      should never be mixed with bleach either. If the spotting keeps coming
      back in the same spot after a bottle of something, that is the moisture
      talking, not the product.
    - Beyond that, we would rather you left it and let us look at it than went
      at it hard, because a surface that has been scrubbed through is a harder
      job afterwards, not an easier one.
moisture:
  heading: Cleaning takes it off. Moisture is what brings it back.
  body:
    - type: paragraph
      text: Mould grows where there is moisture, so it regrows wherever the moisture
        is still there. Clean it off a bathroom ceiling that gets no ventilation
        and it will be back, usually within a few months, because nothing about
        the ceiling changed. That is not a bad clean. That is the clean doing
        its job on a problem that was never a cleaning problem.
    - type: paragraph
      text: Sometimes the fix is small and free. Run the fan for twenty minutes after
        a shower instead of two. Open the room up on a dry day. Pull the
        wardrobe two centimetres off the wall so air can get behind it. Stop
        drying washing inside a closed room, or run a dehumidifier in the worst
        room through the wet months. We will point out the ones we can see while
        we are there.
    - type: paragraph
      text: Sometimes the fix is not small, and it is a leak, a failed seal, a fan
        venting into the roof space or no ventilation at all. Then it is a
        plumber, an electrician or a builder, and it is worth spending that
        money before spending ours again. We would rather tell you that once
        than clean the same ceiling every autumn.
    - type: paragraph
      text: For plenty of homes on this coast the answer is not dramatic. The ceiling
        gets cleaned when it needs it, somebody who already knows the house
        notices the spotting before you do, and it stops being a thing you keep
        meaning to deal with. That is what a regular clean quietly does on top
        of everything else.
comparison:
  heading: Mould clean, deep clean or specialist remediation
  cornerLabel: Which one you need
  columns:
    - label: Mould clean
    - label: Deep clean
    - label: Specialist remediation
  rows:
    - label: What it is
      values:
        - Surface mould removed from the surfaces it is growing on
        - A one-off reset of the whole house, room by room
        - Building work that removes affected material and fixes the cause
    - label: When you need it
      values:
        - Visible growth on ceilings, seals, reveals or wardrobe walls
        - The house is due a reset and there is some spotting along with
          everything else
        - Mould inside a cavity, after a leak or a flood, or across a large area
    - label: Who does it
      values:
        - TLB Cleaning
        - TLB Cleaning
        - A licensed remediation specialist, plumber or builder
    - label: Does it fix the cause
      values:
        - No. We identify what we can see and tell you
        - No
        - Yes, that is the whole point of it
    - label: Will it come back
      values:
        - Yes, if the moisture is still there
        - Yes, if the moisture is still there
        - Not if the cause has actually been fixed
  footnote: Plenty of jobs are simply the first column, and a bathroom ceiling
    cleaned properly once or twice a year is a normal way to live in a house on
    this coast. The point of the table is that if you are in the third column,
    no amount of cleaning is going to be the answer, and you should know that
    before you pay anyone.
commercial:
  heading: Mould cleaning services for agencies, holiday lets and commercial premises
  lead: Most of this page is written for somebody looking at their own bathroom
    ceiling. The work is the same when it is not your house, but the pressure
    around it is different. One provider, one point of contact, and the same
    people who already know the building.
  items:
    - icon: key
      title: Property managers and agencies
      description: Usually a vacancy or a routine inspection, and the question is
        whether it can be cleaned in time rather than whether it can be cleaned.
        Tell us at the same time as the rest of the job and it gets quoted
        properly and allowed for on the day.
      href: /house-cleaning/real-estate-cleaning/
    - icon: suitcase
      title: Holiday let owners
      description: Usually a wardrobe or a window reveal in a house that has been shut
        up between guests, which is when it happens here. We work off the
        booking calendar on turnovers, so if there is spotting that keeps
        returning in the same room we will flag it rather than wiping it and
        moving on.
      href: /airbnb-holiday-home-cleaning/
    - icon: office
      title: Offices, clinics, strata common areas and shopfronts
      description: Usually a bathroom, a storeroom or a stairwell nobody opens, and it
        needs doing outside trading hours. Same team each time, so keys and
        access stay with people who are known.
      href: /commercial-cleaning/
health:
  heading: On the health question
  body:
    - type: paragraph
      text: People often ask us whether mould in the house is a health problem, and it
        is a fair question to ask. It is not our question to answer. We clean,
        we are not a health service, and we are not going to tell you what mould
        in your home does or does not mean for the people in it.
    - type: paragraph
      text: If that is what is worrying you, ask someone qualified. NSW Health and
        Queensland Health both publish guidance on damp and mould in the home,
        and your GP is the right person for anything about your own family. What
        we can do is remove what is on the surface and be straight with you
        about what we saw.
