booking:
  heading: Send us a photo and we will tell you straight
  body:
    - type: paragraph
      text: Book online in a couple of minutes, or send a text, ring us or drop us an
        email, whichever you would actually do.
    - type: paragraph
      text: Send a photo with your enquiry if you can. Mould is one of the few jobs
        where a picture genuinely changes the quote, because the difference
        between spotting along a cornice and a wall that has gone through is
        obvious in a photo and impossible to describe. It also means that if
        this is a job we should be handing to someone else, we can tell you that
        before anyone books a day.
    - type: paragraph
      text: If it turns out to be bigger than a clean, you will hear that from us
        early and at no cost. We would rather give you an honest answer and no
        invoice than take a booking we already know will not hold.
