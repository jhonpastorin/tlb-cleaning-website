definition:
  body:
    - type: paragraph
      text: A professional oven cleaning service is a strip down rather than a wipe
        out. The racks, trays, side rails and usually the inner door glass come
        out of the appliance and go into a soak, and the cavity is cleaned while
        they sit. It is the only way to reach the baked-on carbon in the corners
        and between the door glass, which is exactly where an oven looks worst.
        TLB Cleaning cleans ovens, barbecues and appliances across the Northern
        Rivers and the Tweed.
    - type: paragraph
      text: The same method covers a barbecue and most other appliances. Grill plates,
        burners and a fat tray come out and soak the same way a set of oven
        racks does, and a rangehood filter is the same job again in miniature.
        What changes is the size of the parts and how much grease is on them.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
