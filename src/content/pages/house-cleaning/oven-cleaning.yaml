method:
  heading: How our oven cleaning service works, stage by stage
  lead: The same method covers a barbecue and most other appliances. Soak time
    does the work, not scrubbing.
  items:
    - icon: puzzle
      title: It comes apart first
      description: Racks, side rails, trays, burners and grill plates all come out. On
        most ovens the inner door glass comes out too, which is the difference
        between an oven that looks clean and one that looks clean from the sofa.
    - icon: spray-bottle
      title: The parts go in to soak
      description: Soaking does the work that scrubbing otherwise has to, which is why
        a proper job takes time rather than muscle.
    - icon: spark
      title: The cavity is cleaned while they sit
      description: Roof, floor, back, seals and the corners where carbon collects. The
        fan cover and the element surrounds get done at the same time. Nothing
        here needs to be forced, because the products have already been given
        time to work.
    - icon: target
      title: The door glass, both sides of both panes
      description: The brown film sits between the two panes of glass, so wiping the
        outside never touches it. Separating the door is the only way to reach
        it, and it is the single most noticeable part of the whole job when it
        is done.
    - icon: bloom
      title: Rebuilt, wiped down and tested
      description: Everything goes back where it came from, the seals go back on
        properly, and the appliance is turned on to check it works before we
        leave. Your kitchen gets wiped down after us rather than left as the
        evidence.
    - icon: house
      title: The other appliances, same visit
      description: Rangehood and filters, the inside of the fridge, the microwave and
        the cooktop are the usual extras, and they are quicker done at the same
        time than booked separately.
