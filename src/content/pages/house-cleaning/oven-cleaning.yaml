selfClean:
  heading: What the self-clean cycle actually does
  body:
    - type: paragraph
      text: "The self-clean cycle on a conventional oven is not what most people think
        it is. On a pyrolytic oven it is real: the oven locks and runs itself up
        to around 500 degrees, burning residue down to a fine ash you wipe out
        afterwards. It works, it smells strongly for a few hours, and it puts
        every seal, element and control board in the appliance through a very
        hard afternoon. It is also the only cleaning method the manufacturer of
        a pyrolytic oven will endorse, because the enamel coating inside it can
        be damaged by the caustic products used on ordinary ovens."
    - type: paragraph
      text: On an oven that is not pyrolytic, the "self clean" setting usually just
        means a steam assist function, which softens light residue and does
        nothing at all to baked-on carbon. Either way, none of it touches the
        film between the door glass, because that is not inside the cavity. If
        the door of your oven is the part that looks bad, no cycle of any kind
        will fix it. Somebody has to take the door apart.
