bookingFaq:
  heading: Booking an oven or BBQ clean
  items:
    - question: Will the kitchen smell of chemicals afterwards?
      answer: It should not. The parts soak away from the cavity rather than sitting
        in the room, the oven is wiped out and rinsed rather than left coated,
        and we ventilate while we work. If you are sensitive to smells, or
        someone in the house is pregnant or asthmatic, tell us when you book so
        we can plan the ventilation properly.
    - question: How long does an oven take?
      answer: Usually a couple of hours for a standard oven, because most of that is
        soak time rather than scrubbing. A double oven, a very neglected one or
        an oven plus a cooktop and rangehood takes longer. You can use it as
        soon as we are finished, and we will have run it briefly to check it
        before we go.
    - question: Do you clean pyrolytic and self-cleaning ovens?
      answer: We clean the outside, the door glass, the racks and the trays, but we do
        not chemically clean the inside of a pyrolytic cavity. The special
        coating in those ovens can be damaged by the products used on a standard
        oven, and the manufacturer’s own high temperature cycle is the method
        they specify. We will tell you which type you have if you are not sure.
    - question: Can you do the barbecue at the same time?
      answer: Yes, and it is a sensible way to do it, because it is the same soak and
        the same visit. Barbecues are usually worse than people expect
        underneath the plates, particularly the fat tray and the inside of the
        hood. Tell us the rough size and how long it has been when you book.
    - question: What happens if I get in touch?
      answer: "Tell us what you have: oven, oven and cooktop, a barbecue, the fridge,
        or the lot. We will give you a price and a time. Most people get more
        than one thing done in the same visit because the second appliance costs
        less than a separate booking."
generalFaq:
  heading: Oven, BBQ and appliance cleaning questions
  items:
    - question: What is the difference between a pyrolytic and a self-cleaning oven?
      answer: "A pyrolytic oven has a genuine high temperature cycle: it locks the
        door, heats to around 500 degrees and reduces residue to ash that you
        wipe out. Most ovens marketed as self cleaning are not pyrolytic and
        have a steam assist function instead, which loosens light soil and does
        nothing to baked-on carbon. Check your manual for the word pyrolytic
        rather than relying on the marketing."
    - question: Why is the oven door glass brown on the inside?
      answer: Because grease and steam get between the two panes of glass through the
        vents in the top of the door, condense there and bake on. It is on a
        surface you cannot reach from either side, which is why it survives
        every clean you have ever done. The only way to it is to separate the
        door, and on most ovens that is straightforward for someone who has done
        it before.
    - question: How often should an oven be cleaned?
      answer: Every six to twelve months suits most households, and more often if you
        roast a lot or the oven is used daily. Between cleans, wiping spills
        while the oven is still warm rather than letting them bake on again is
        what keeps the interval long. A tray under anything likely to bubble
        over saves more work than any product.
    - question: Is it safe to clean an oven with bicarbonate and vinegar?
      answer: It is mild and it will not damage an oven, but it is slow and it does
        not touch heavy baked-on carbon, which is what most people are actually
        trying to remove. It also cannot reach between the door panes. It is a
        reasonable maintenance habit and a poor rescue. ⚠️ Whatever you use,
        never mix cleaning products together, and never mix anything with
        bleach.
    - question: How much does oven cleaning cost?
      answer: "Usually priced per appliance, so an oven, a cooktop, a rangehood and a
        barbecue are separate line items, generally with a lower rate when
        several are done in one visit. Size and condition move it: a double oven
        or one that has not been touched in years takes longer. That's why we
        quote rather than publish a flat rate that would be wrong for most
        kitchens. Tell us the basics and you'll have a price back quickly, with
        no obligation attached to it."
