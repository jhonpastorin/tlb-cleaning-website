method:
  heading: How we clean tile and grout
  lead: Five stages. Most of the result comes from dwell time and agitation, not
    from pressure.
  items:
    - icon: target
      title: We work out what the surface is
      description: Glazed ceramic and porcelain will take almost anything. Natural
        stone, terracotta, slate and polished concrete will not, and an acid
        based product on stone will etch it permanently. We identify the surface
        before we choose a product.
    - icon: spray-bottle
      title: A cleaner that is left to work
      description: The solution goes on and is given time to break down the soap scum
        and oil in the grout. Most of the difference between a good result and a
        poor one is dwell time, not effort. Spraying and immediately wiping is
        just mopping with extra steps.
    - icon: spark
      title: Every line agitated
      description: Grout has to be physically worked along its length with a brush.
        There is no product that skips this part. The corners, the edge against
        the bath and the line where the floor meets the wall are the slowest and
        the most obvious when they are missed.
    - icon: chart-bars
      title: Rinsed and lifted, not wiped
      description: The loosened soil has to come off the floor rather than be spread
        around it, so it is rinsed and the dirty water is lifted away. Wiping a
        cleaned grout line with a cloth puts a good share of it straight back.
    - icon: puzzle
      title: An honest look at what is left
      description: When it is clean and dry we look at it with you. Some
        discolouration is soil and comes out. Some is staining in the cement,
        some is worn or missing grout, and some is a shower that needs
        regrouting rather than cleaning. We will tell you which you have.
mould:
  heading: If the black spots keep coming back
  body:
    - Black or dark spotting along shower grout and silicone is very often mould
      rather than dirt, and mould comes back wherever the moisture that fed it
      is still there. Cleaning it is a cleaning job. Working out why it keeps
      returning is usually a ventilation or a sealing problem in the building.
      We have a separate page that explains what we do and do not do about
      mould, and it is the honest version rather than the sales version.
  cta:
    label: Mould cleaning and removal
    href: /house-cleaning/mould-removal/
bleach:
  heading: Why bleach makes it worse in the long run
  body:
    - type: paragraph
      text: Grout will not always come back to white, and any cleaner who promises it
        will is either about to disappoint you or about to do something you did
        not agree to. Grout is cement. It is porous, it stains through rather
        than on top, and after ten years of soap and hard water some of that
        colour is part of the material now. A good clean gets a long way, often
        further than people expect, but the floor you end up with is a clean old
        floor rather than a new one.
    - type: paragraph
      text: That matters because the shortcut is bleach, and bleach is why so many
        bathrooms look worse a year after they were cleaned. It lightens the
        surface without removing what is in the grout, so it looks fixed for a
        few weeks and then greys back, and repeated use eats away at the grout
        itself until it starts crumbling out of the joint. If grout is genuinely
        past it, the answer is regrouting or a colour seal, not another round of
        bleach. We will tell you which one you are looking at.
