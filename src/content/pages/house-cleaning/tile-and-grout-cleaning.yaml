definition:
  body:
    - type: paragraph
      text: Tile and grout cleaning is the deep cleaning of hard floors and wet area
        walls, and in practice it is almost entirely about the grout. Tile is
        glazed and easy. Grout is cement based and porous, so it absorbs soap,
        oil, dirt and moisture and holds onto them, which is why a mopped floor
        can still look grubby along every line. TLB Cleaning cleans tile and
        grout across the Northern Rivers and the Tweed.
    - type: paragraph
      text: Mopping is the reason it gets worse rather than better. A mop lifts the
        dirt off the tile and pushes most of it into the grout line, which sits
        slightly lower and is absorbent. Doing that weekly for years is why the
        grout in a well-kept bathroom can be darker than the grout in a
        neglected one.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
