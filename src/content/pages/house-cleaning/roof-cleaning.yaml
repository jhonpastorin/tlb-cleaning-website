definition:
  body:
    - type: paragraph
      text: Roof cleaning is the removal of the algae, moss and lichen growing on a
        roof, along with the leaf litter and grime that feed them. TLB Cleaning
        cleans tile and colorbond roofs across the Northern Rivers, the Tweed
        and the Southern Gold Coast, using low pressure soft washing rather than
        a high pressure blast.
    - type: paragraph
      text: Soft washing means a cleaning solution and dwell time instead of force. It
        matters because high pressure on a roof strips the surface coating off
        concrete tiles, blows water in under the laps and can crack pointing
        along the ridge, and none of that is repaired by the clean that caused
        it. A soft wash also kills the growth at the root, so the roof stays
        clear for longer rather than greening up again next wet season.
  backgroundImage: /src/assets/home_cleaning/outside_your_home/clean-coastal-home-exterior.jpg
explainer:
  heading: Before you let anyone up there
  lead: Three things worth understanding about a roof, and one of them will save
    you money.
  items:
    - type: image
      image:
        src: /src/assets/home_cleaning/outside_your_home/roof_cleaning/black-algae-streaks-on-a-tiled-roof.jpg
        alt: A concrete tiled roof heavily streaked with black algae and blotched with
          pale green lichen, worst on the shaded side and in the valley
    - type: text
      heading: What the black streaking actually is
      body:
        - It is algae, and the pale crusty blotches with it are lichen. Both
          live on the roof rather than sitting on it, which is why hosing does
          nothing and why the streaks always run downslope from the ridge in the
          same pattern.
        - "It grows fastest where the roof stays damp longest: the shaded
          southern side, under trees, in the valleys and along the bottom two
          rows of tiles. That is also why one elevation of a house can look
          filthy while the sunny side looks nearly new."
        - Lichen is the one to deal with early. It anchors into the surface of
          the tile and holds moisture there, and on an older roof that speeds up
          the day the tiles need replacing rather than washing.
    - type: text
      heading: What a soft wash does that a blast cannot
      body:
        - Low pressure and a cleaning solution, left to work, then rinsed. The
          growth dies rather than being knocked off, so it comes back on a scale
          of years instead of months.
        - High pressure looks more impressive on the day and costs you later.
          Enough force to strip lichen off a concrete tile also strips the
          factory coating, which is the layer keeping the tile from soaking up
          water. Wet tiles are heavier, they grow moss faster and they break
          more easily underfoot.
        - "On colorbond the same rule applies for a different reason: pressure
          gets under the laps and into the screw holes, and a roof that has
          never leaked can start after it has been blasted."
    - type: image
      image:
        src: /src/assets/home_cleaning/outside_your_home/roof_cleaning/half-treated-roof-tiles.jpg
        alt: A tiled roof halfway through a soft wash, one side still streaked black
          with algae and lichen, the other side pale, even and faintly damp
    - type: image
      image:
        src: /src/assets/home_cleaning/outside_your_home/roof_cleaning/cleaner-with-soft-wash-gear-beside-a-house.jpg
        alt: A cleaner in uniform standing on the lawn beside a low pressure soft wash
          unit with a teal harness over her shoulder, turning to the camera with
          a friendly expression
    - type: text
      heading: Who is on your roof
      body:
        - The same small local team, in TLB uniform, harnessed and anchored. We
          are local, insured and there is one number to ring if something is
          not right.
        - We walk the roof before we start and tell you what we found. Cracked
          tiles, failed pointing, a rusted valley or a sheet that has lifted are
          all things you want to hear about while somebody is up there, not in
          the next storm. We clean roofs, we do not repair them, so there is
          nothing in it for us either way.
warning:
  heading: Never let anyone high pressure your roof
  body:
    - A high pressure wand held on a concrete tile takes the growth off and the
      surface coating with it. The tile underneath is porous, so it drinks
      water, grows moss faster and gets heavier and more brittle. The roof looks
      its best on the day it is damaged and worse every year after.
    - On a tiled roof the other two casualties are the pointing along the ridge,
      which cracks, and the laps, where water is forced up under the tiles into
      the roof space. If a quote is low because the job is quick, this is
      usually why. Ask what pressure they use and what they do about the growth
      in the surface, and if the answer is a number of thousands of PSI, keep
      looking.
method:
  heading: What our roof cleaning involves, stage by stage
  lead: Six stages, in this order. The last three are the ones people ring about
    afterwards.
  items:
    - icon: puzzle
      title: We get on it safely, or not at all
      description: Harness, anchor and a proper look at the pitch and the condition
        before anyone walks on it. A brittle old tile roof in the wet is a job
        to be assessed, not attacked, and if it cannot be walked we say so.
    - icon: target
      title: Roof first, then the gutters
      description: Loose leaf litter, moss mats and debris come off before any
        solution goes down, and the gutters and valleys are cleared afterwards,
        because everything we take off the roof ends up in them. A roof clean
        that leaves your gutters packed is half a job.
    - icon: spray-bottle
      title: Solution on, and time to work
      description: A low pressure application, left to do its job rather than rushed,
        then rinsed at a pressure the surface can take.
    - icon: bloom
      title: Plants and pets protected
      description: Garden beds along the drip line get wet down before and rinsed
        after, outdoor furniture is moved or covered, and pets come inside while
        we work.
    - icon: idea
      title: A word on what we found
      description: Cracked tiles, failed ridge pointing, a rusted valley, lifted
        sheeting or a whirlybird that has seized. Photographed and shown to you,
        with no repair quote attached, because we do not do roof repairs.
    - icon: chart-bars
      title: Windows and paths afterwards
      description: "Anything that catches run-off gets rinsed down before we leave:
        windows, walls, paved paths, the driveway. A clean roof over spotted
        windows and a streaked wall does not look like a clean house."
