bookingFaq:
  heading: Booking a roof clean
  items:
    - question: Will it come back?
      answer: "Eventually, and much more slowly than after a high pressure blast. A
        soft wash kills the algae and lichen at the root rather than knocking
        the top off it, so the roof stays clear for years rather than a season.
        Shade is the variable: under trees on the southern side it returns
        sooner than in full sun."
    - question: Can you walk on our roof without breaking tiles?
      answer: On a sound roof, yes, and it is walked in the right places by someone
        who knows where those are. Old, brittle or previously blasted tiles are
        more fragile, and we assess that before starting. If a roof should not
        be walked we will tell you rather than risk it and hope.
    - question: What about a colorbond roof?
      answer: "Colorbond usually needs less work than tiles, because growth has less
        to hold on to, but it still films up with grime and algae in the shade,
        and it needs low pressure for a different reason: force gets under the
        laps and around the screws."
    - question: What about our garden and our pets?
      answer: Beds along the drip line get wet down before and rinsed after, furniture
        is moved or covered and pets stay inside until we have finished and
        rinsed off. Tell us about
        anything precious in the beds when you book and we will work around it.
    - question: Can you paint or restore the roof too?
      answer: No. We clean roofs, we do not recoat or repair them, and we do not have
        a painter waiting in the van. If a roof turns out to need pointing,
        sealing or replacement, you will hear that from us with no quote
        attached to it.
generalFaq:
  heading: Soft washing, roof tiles and what it costs
  items:
    - question: What is soft washing a roof?
      answer: A low pressure application of a cleaning solution, left to work for a
        period and then rinsed off gently. The pressure is closer to a garden
        hose than a pressure washer. It suits roofs, render, painted surfaces
        and cladding, where force would strip the finish or drive water in
        behind it.
    - question: Why does my roof have black streaks?
      answer: It is algae growing on the surface, running downslope from the ridge
        because that is the way water carries it. Humidity, shade and leaf
        litter feed it, which is why the streaking is always worst on the shaded
        elevation, in the valleys and under overhanging trees. The pale crusty
        patches with it are lichen.
    - question: Does roof cleaning damage tiles?
      answer: "Soft washing does not. High pressure can, and often does: it strips the
        surface coating off concrete tiles, cracks ridge pointing and forces
        water up under the laps into the roof space. Once the coating is gone
        the tile absorbs water, grows moss faster and becomes more brittle
        underfoot."
    - question: Can old fibre cement roofing be cleaned?
      answer: Not by us. Fibre cement roofing and eave sheeting installed before the
        1990s can contain asbestos, and cleaning disturbs the surface, so it is
        work for a licensed asbestos removalist rather than a cleaner. If you
        are not sure what your roof is made of, get it identified before anyone
        washes it.
    - question: How much does roof cleaning cost?
      answer: Roof cleaning is usually priced per square metre of roof area, with a
        minimum charge, and the rate moves with pitch, access, roof type, how
        heavy the growth is and whether the gutters are done at the same time.
        That's why we quote rather than publish a flat rate that would be wrong
        for most roofs. Ask for a price against a written scope that says which
        method is being used. Tell us the basics and you'll have a price back
        quickly, with no obligation attached to it.
