timing:
  heading: When to do it
  body:
    - type: paragraph
      text: Roof growth here is seasonal, and the best time to deal with it is before
        the wet rather than after.
    - type: list
      items:
        - Late winter and spring is the sweet spot. The growth is dormant and
          slower, the weather is settled enough to work, and the roof is clear
          before the summer storms.
        - After a long wet summer is when people notice it, and it is also when
          everyone rings at once. It can still be done, it just books out.
        - Before selling, do it early. A dark streaked roof is the first thing
          in an aerial photo and the first thing a buyer values as a future
          cost.
    - type: paragraph
      text: How often depends on the shade, not the calendar. A roof in full sun with
        nothing overhanging it can go many years. A roof under trees on the
        southern side of a hinterland block will be greening up again long
        before that, and the honest answer is that we will tell you what yours
        looks like rather than sell you a schedule you do not need.
