method:
  heading: How we clean a carpet
  lead: Six stages, in this order. The first two are the ones a rushed job skips.
  items:
    - icon: target
      title: We test the fibre first
      description: Wool, nylon, polypropylene and viscose all behave differently in
        water, and a rug label is not always right. We test in a hidden corner
        before anything wet touches the floor, because getting this wrong is not
        something you can undo.
    - icon: spray-bottle
      title: Dry soil out before water goes in
      description: A proper vacuum first, slowly and in both directions. Most of what
        is in a carpet is dry grit, and wetting it turns it to mud that goes
        deeper. Skipping this step is the single most common shortcut.
    - icon: spark
      title: Traffic lanes, stairs and spots by hand
      description: Doorways, the run past the couch, the stair treads and the spot
        where the dog sleeps wear faster than the rest. Stair treads wear
        hardest of anything in a house, because every step lands in the same
        place. Those get pre-treated and agitated separately, and individual
        spots are treated by what caused them rather than with one product for
        everything.
    - icon: chart-bars
      title: Hot water extraction
      description: Heated water and solution into the pile under pressure, straight
        back out with the soil in it. This is the method carpet makers name in
        their own care instructions, and the one that removes soil rather than
        moving it around.
    - icon: bloom
      title: Wool and natural fibres, differently
      description: Wool takes less water, a gentler pH and much more care on the
        drying, and silk, jute and viscose take less again. Some rugs are better
        off going to a rug plant, and we will say so rather than take the job.
    - icon: office
      title: Groomed and dried
      description: The pile is groomed so it dries evenly and air is moved across it.
        Drying time depends on the carpet, the airflow and the weather, and we
        will tell you what to expect on the day. In a humid Northern Rivers
        summer we will tell you to leave a fan on, and we would rather
        say that than pretend humidity does not exist.
worthKnowing:
  heading: What a low carpet quote usually leaves out
  body:
    - type: paragraph
      text: "A bad carpet clean and a good one look the same when the van drives away.
        The difference shows up about three weeks later. Over-wetting leaves
        moisture down in the backing, and on this coast, in a humid February,
        that is how you get a smell that will not shift and mould underneath a
        carpet that looks perfectly fine from above. Too much detergent left
        behind is a slower problem: it stays tacky, grabs the next lot of dirt,
        and the traffic lanes come back darker than they were before you paid to
        have them cleaned."
    - type: paragraph
      text: So the question worth asking any carpet cleaner is not the price per room.
        It is what they do about drying, what they will do differently on a wool
        rug, and whether they will tell you before they start that a mark is
        permanent. We would rather lose the job than shrink your rug, and we
        would rather say a stain is staying than take your money and hope.
endOfLease:
  heading: End of lease carpet cleaning
  body:
    - type: paragraph
      text: If the carpet is being cleaned because the keys are going back, the
        standard is not your standard. It is whatever the outgoing inspection
        asks for, and some leases name professional carpet cleaning
        specifically. We give you a receipt that says what was done, because
        that is usually the thing the agent actually wants to see.
    - type: paragraph
      text: "Worth knowing before you book: a bond clean and a carpet clean are two
        different jobs, and carpet is often the part people forget until the
        inspection is already booked. If you need both, it is cheaper and faster
        to have them done on the same visit than to bring two lots of people
        through an empty house."
  cta:
    label: End of lease and bond cleaning
    href: /house-cleaning/end-of-lease-cleaning/
