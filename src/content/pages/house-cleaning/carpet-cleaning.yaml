definition:
  body:
    - type: paragraph
      text: Carpet and rug cleaning is the deep cleaning of soft floor coverings in
        your home, usually by hot water extraction, which pushes heated water
        and cleaning solution into the pile under pressure and draws it straight
        back out with the soil. It lifts the grit, oils, sand and pet hair that
        vacuuming leaves behind. TLB Cleaning cleans carpet and rugs across the
        Northern Rivers and the Tweed.
    - type: paragraph
      text: "Carpet steam cleaning and hot water extraction are two names for the same
        method. Rugs are the part people get wrong: a fitted synthetic carpet
        and a loose wool rug are not the same job, they do not take the same
        water or the same chemistry, and a rug that is cleaned like carpet is
        how you end up with shrinkage, bleeding dyes or a browned fringe."
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
