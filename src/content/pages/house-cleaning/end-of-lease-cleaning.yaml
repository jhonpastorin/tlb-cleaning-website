faq:
  heading: Frequently asked questions
  items:
    - question: What happens if the property fails the exit inspection?
      answer: If the agent lists something that was on our task list, tell us and we
        will come back and put it right at no charge. That covers what we quoted
        for. It does not cover work nobody booked, or damage that cleaning was
        never going to fix. Let us know quickly, before the keys change hands.
    - question: Do you guarantee I will get my bond back?
      answer: "No, and be careful of anyone who does. Your bond depends on the
        condition report, fair wear and tear and what the agent writes, and a
        cleaner controls none of those. What we promise is the part we do
        control: the property cleaned to the standard the inspection is measured
        against, and a free re-clean if something on our list is picked up."
    - question: How long does a bond clean take?
      answer: Longer than any other clean, because every cupboard, track and oven rack
        is in scope. It depends on the size of the property and the state it is
        in, and on whether it is empty, which makes more difference than people
        expect. We give you a realistic window when we quote.
    - question: What isn't included in a bond clean?
      answer: Carpet steam cleaning, exterior windows, pest control, garages,
        balconies and outdoor areas, full wall washing and any cleaning at
        height are quoted separately rather than assumed. Repairs, painting,
        gardening and rubbish removal are not cleaning and we do not do them.
        Ask when you book if you are unsure and we will tell you straight.
    - question: Does the property need to be empty?
      answer: It does not have to be, but it should be. An empty property cleans
        faster, cleans better and costs less, because nothing has to be worked
        around or moved twice. If furniture has to stay, tell us when you book
        so we quote for the property as it will actually be on the day.
    - question: Do I need the carpets professionally cleaned as well?
      answer: Check your lease. Many tenancies specifically require professional
        carpet cleaning at the end of the term, and where that is in writing the
        receipt is usually what the agent wants to see. We quote carpet cleaning
        separately rather than folding it in, so ask for it with your quote and
        it is organised at the same time.
    - question: Can you clean a property on the Queensland side of the border?
      answer: Yes. We work across the Northern Rivers, the Tweed and the Southern Gold
        Coast, so a tenancy in Coolangatta or Palm Beach is the same booking as
        one in Kingscliff or Byron. If you are moving across the border, you can
        book the clean at both ends with the same team.
    - question: How much does a bond clean cost?
      answer: It depends on the size of the property, its condition and whether extras
        like carpet cleaning are included, which is why we quote instead of
        publishing a flat rate. The three things that move a quote most are set
        out above, and we have written a full breakdown of what a bond clean
        costs if you want it. Tell us the basics and the handover date and you
        will have a price back quickly, with no obligation attached.
    - question: Do you bring your own products and equipment?
      answer: Yes, everything. On a bond clean that matters more than usual, because
        the power and the water are sometimes already disconnected. Tell us when
        you book if the property will have no power on the day, so we come
        prepared rather than turning up and finding out.
    - question: How far ahead should I book?
      answer: As soon as you have the handover date. End of month and end of quarter
        are the busiest windows in this region because most leases end there,
        and those dates fill first. If you are already inside a tight window,
        ring us rather than booking online and we will tell you honestly what we
        can do.
closingCta:
  heading: Hand back the keys with the cleaning already sorted
  lead: Tell us the property and the handover date, and we will quote for what is
    actually there.
