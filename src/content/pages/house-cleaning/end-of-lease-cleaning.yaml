booking:
  heading: Book it around the handover date
  body:
    - type: paragraph
      text: Most bond cleans get booked in the worst week of the move, when the truck
        is late, the keys are due and nobody has eaten a proper meal in three
        days. Book it the day the handover date lands instead, and it becomes
        one fewer thing between you and the end of it.
    - type: paragraph
      text: Book online in a couple of minutes, or send a text, ring us or drop us an
        email, whichever you would actually do. Tell us the handover date when
        you book, because that is the date everything works back from.
    - type: paragraph
      text: You get a price up front rather than waiting on a callback. It is based on
        the property as it actually is, so be honest about the condition when
        you book. Nothing you tell us will surprise us, and it means we allow
        the right amount of time instead of running short on the day.
    - type: paragraph
      text: Book the clean for after the removalists and before the final inspection,
        with a day in between if you can manage it. An empty property cleans
        faster and better, and that gap is what gives everyone room if something
        needs a second look.
