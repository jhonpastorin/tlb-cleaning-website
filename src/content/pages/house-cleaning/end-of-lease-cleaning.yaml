seo:
  title: End of Lease Cleaning NSW & QLD | TLB Cleaning
  description: End of lease and bond cleaning that passes the first inspection,
    across NSW and QLD. We know both sets of rules. Get your fixed quote today.
hero:
  headingLines:
    - End of lease cleaning, to the standard the inspection measures
  lead: End of lease cleaning for tenants who want their bond back, and for the
    agencies that manage the property. Both sides of the border, quoted before
    we start, with the full task list published on this page. {{line.fast}}
  image:
    src: /src/assets/home_cleaning/inside_your_home/end_of_lease_and_bond_cleaning/end-of-lease-cleaner-scrubbing-the-kitchen-sink.jpg
    alt: A TLB cleaner scrubbing the kitchen sink beside a garden window
definition:
  body:
    - type: paragraph
      text: A bond clean is a comprehensive end of lease clean, done to the standard
        your exit inspection is measured against rather than to the standard of
        an everyday tidy. TLB Cleaning provides bond and end of lease cleaning
        across the Northern Rivers, the Tweed and the Southern Gold Coast.
    - type: paragraph
      text: Bond clean, end of lease clean, vacate clean, exit clean and move out
        clean are all names for the same job. Tenants tend to say bond clean
        because the bond is what is at stake, agencies tend to say end of lease
        clean because the tenancy is what is ending, and Queensland-side leases
        often say vacate or exit. We use all of them on this page and mean the
        same thing by them.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
pathways:
  heading: Two people read this page.
  headingAccent: Which one are you?
  cards:
    - image:
        src: /src/assets/home_cleaning/inside_your_home/end_of_lease_and_bond_cleaning/end-of-lease-empty-room-glass-doors-onto-the-deck.jpg
        alt: A cleared room with glass doors open onto the deck and paddock
      title: I'm moving out and I want my bond back
      description: Then you want the clean measured against the entry condition
        report, not against how clean the place feels. That is what this page is
        about.
      cta:
        label: Get a fast quote
        href: /contact/
    - image:
        src: /src/assets/home_cleaning/inside_your_home/end_of_lease_and_bond_cleaning/end-of-lease-cleaner-wiping-a-kitchen-window-frame.jpg
        alt: Cleaner wiping down a kitchen window frame
      title: I manage the property
      description: We already hold ongoing contracts with major agencies across the
        region. Vacancy windows are tight, so tell us the handover date and we
        will work back from it.
      cta:
        label: Real estate and property management
        href: /house-cleaning/real-estate-cleaning/
    - image:
        src: /src/assets/home_cleaning/inside_your_home/end_of_lease_and_bond_cleaning/end-of-lease-cleaner-tidying-a-shower-niche.jpg
        alt: A cleaner straightening the bottles in a tiled shower niche
      title: I'm not sure this is the clean I need
      description: Fair enough. A bond clean is not the same job as a deep clean, and
        it is priced differently. Here is how the three compare.
      cta:
        label: Compare the three
        href: "#compare"
inclusions:
  heading: What end of lease cleaning includes
  lead: Also called a bond clean. Every cupboard, track and fitting, because that
    is what the inspection looks at.
  items:
    - heading: Kitchen
      body:
        - Inside and outside of all cupboards and drawers, benchtops,
          splashback, sink and taps, rangehood and filter, oven inside and out
          including racks and trays, cooktop, the fridge cavity, dishwasher
          filter and seals, floors including edges and corners.
    - heading: Bathrooms, ensuites and toilets
      body:
        - Shower screen, tiles and grout, shower base and drain, bath, vanity
          inside and out, basin, taps and fittings, mirrors, exhaust fan cover,
          towel rails, toilet inside and out including the base and the cistern,
          floors and skirting.
    - heading: Bedrooms and living areas
      body:
        - Inside wardrobes, shelves and drawers, skirting boards, doors and door
          frames, architraves, light switches and power points, window sills and
          tracks, inside windows, ceiling fans, cobwebs, air vents, full vacuum
          including edges and under moveable furniture, mop.
    - heading: Laundry
      body:
        - Tub inside and out, benches, cupboards inside and out, behind and
          beside appliances where they can be safely moved, dryer lint filter,
          taps and fittings, floors and skirting.
    - heading: Walls, marks and spots
      body:
        - Spot cleaning of scuffs and marks on walls and doors where the paint
          surface allows it. Some marks are damage rather than dirt and will not
          come out with cleaning. We tell you which is which rather than
          scrubbing through the paint and turning a mark into a repair.
    - heading: Throughout
      body:
        - Light fittings and shades, air vents and returns, switchplates, door
          handles, blind and curtain dusting, all floors including edges,
          corners and behind doors.
exclusions:
  body:
    - "Quoted separately: carpet steam cleaning, exterior windows, pest control,
      garages, balconies and outdoor areas, walls needing a full wash rather
      than spot cleaning, and any cleaning at height. Many leases specifically
      require professional carpet cleaning at the end of a tenancy, so ask for
      it with your quote rather than after the inspection."
    - "Not included: repairs, painting, gardening or lawns, rubbish and hard
      waste removal, or anything that needs a licensed trade. If the property
      needs one of those, we say so when we quote rather than leaving you to
      find out at the inspection."
standard:
  heading: How the standard is actually set
  lead: An exit inspection is not a judgement about how clean the place feels. It
    is a comparison.
  items:
    - heading: It starts with the entry report
      body:
        - Your exit inspection is compared against the condition report from the
          day you moved in, not against a blank standard. The law in both states
          asks for the property to be left reasonably clean and in the condition
          it started in, fair wear and tear aside. So if a mark was there on day
          one and the report says so, it is not something the clean has to fix.
    - heading: Fair wear and tear is not dirt
      body:
        - Carpet that has aged, paint that has faded and fittings that have worn
          are not cleaning failures. We clean what cleaning can change, and we
          tell you plainly when something is damage or age instead.
    - heading: The agent still holds the pen
      body:
        - We clean to the standard the inspection measures. We are not in the
          room when it happens, and no cleaner can promise you what an agent
          will write in a report, so we would rather be straight with you about
          that than sell you a guarantee.
reClean:
  heading: If the agent comes back to you
  body:
    - type: paragraph
      text: If the agent lists something from our task list on the exit report, tell
        us and we will come back and put it right at no charge. That covers the
        items we quoted for. It does not cover things that were never in scope,
        like a carpet steam clean nobody booked, or damage that cleaning was
        never going to fix.
    - type: paragraph
      text: Tell us as soon as the report lands, because the window to fix something
        closes when the keys change hands. Ring us the same day if you can.
    - type: paragraph
      text: This is a re-clean commitment, not a bond guarantee. What an agent writes
        in a report is their call and not ours, so we promise the part we
        actually control, which is the work.
agentPaperwork:
  heading: What we give you for the agent
  body:
    - type: paragraph
      text: Agents rarely take your word for it, so we give you the paper. You get an
        itemised invoice showing the property, the date and the work done, and
        it lists the same tasks published on this page. If the agent queries a
        line, you can hold one against the other.
    - type: paragraph
      text: If carpet steam cleaning was part of the booking, it comes as its own line
        with its own receipt. A carpet clause in a lease is usually satisfied by
        a receipt rather than by an inspection.
    - type: paragraph
      text: And if something on our list is picked up on the exit report, the invoice
        is what tells us what we quoted for. That is how the free re-clean gets
        sorted without an argument about scope.
border:
  heading: Both sides of the border
  body:
    - type: paragraph
      text: Our service area crosses the border, so we clean to both sets of rules as
        a matter of routine. A tenancy in Ballina, Byron or Lismore sits under
        NSW Fair Trading. A tenancy in Coolangatta, Palm Beach or Burleigh Heads
        sits under the Queensland Residential Tenancies Authority.
    - type: paragraph
      text: The cleaning itself does not change much between the two. What changes is
        the paperwork around it, and which condition report your inspection is
        measured against. If you are moving from one side of the border to the
        other, which plenty of people here do, you can book the clean at both
        ends with the same team.
readingGuides:
  heading: Before you book, three things worth reading
  lead: We have written the long versions of the three questions people ask most
    before a bond clean. They are free, they are not sales pages, and one of
    them tells you when you do not need to hire anybody.
  items:
    - title: What the law actually says
      description: The condition report standard in NSW and Queensland, what fair wear
        and tear covers, and when a professional clean can and cannot be
        insisted on.
      href: /guides/what-the-law-actually-says-end-of-lease-cleaning-in-nsw-and-qld/
    - title: The end of lease cleaning checklist
      description: Room by room, in the order the job is actually worked, with the
        lines agents mark first.
      href: /guides/the-end-of-lease-cleaning-checklist/
    - title: What an end of lease clean costs
      description: What moves the price, what a low quote has left out, and how to
        compare two of them properly.
      href: /guides/how-much-does-end-of-lease-cleaning-cost/
comparison:
  heading: Bond clean, deep clean or regular clean
  cornerLabel: Which one you need
  columns:
    - label: End of lease clean
    - label: Deep clean
    - label: Regular clean
  rows:
    - label: What it is
      values:
        - A clean measured against an exit inspection
        - A one-off reset, room by room
        - Ongoing upkeep on a set schedule
    - label: The standard
      values:
        - Whatever the inspection requires
        - Back to a baseline
        - Held at that baseline
    - label: When
      values:
        - When the keys go back
        - Moving in, before guests, spring, after a long gap
        - Weekly, fortnightly or monthly
    - label: Inside ovens and cupboards
      values:
        - Included
        - Quoted separately
        - Not included
    - label: Who decides it passed
      values:
        - The agent or landlord
        - The client
        - The client
  footnote: A bond clean is the most thorough of the three and priced accordingly,
    because it has to satisfy someone else’s checklist rather than your own.
    Book it for an empty property wherever you can. It is faster, costs less and
    comes out better when there is nothing left to clean around.
cost:
  heading: What an end of lease clean costs
  body:
    - type: paragraph
      text: Condition and size set the price, which is why we quote rather than
        publish a flat rate. What we can tell you is the shape of it, and what
        moves it.
    - type: paragraph
      text: Three things move a bond clean quote more than anything else. Whether the
        property is empty, because cleaning around furniture costs time twice
        over. Whether carpets are in scope, since steam cleaning is quoted
        separately and many leases require it. And the condition of the oven,
        which is the most time-consuming item on the list and the one agents
        check first.
    - type: paragraph
      text: If you want the full breakdown before you talk to anyone, we have written
        it up.
  cta:
    label: What an end of lease clean costs, in detail
    href: /guides/how-much-does-end-of-lease-cleaning-cost/
