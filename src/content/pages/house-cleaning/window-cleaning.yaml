seo:
  title: Window Cleaning Services - Streak Free | TLB Cleaning
  description: Window cleaning inside and out, with water-fed poles for
    streak-free glass, plus tracks, sills and screens. Book a window clean for
    your home.
buttonLabel: Book a window clean for your home
