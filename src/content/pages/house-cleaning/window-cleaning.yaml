questions:
  heading: Two questions before you book anyone
  body:
    - type: paragraph
      text: Two questions sort out a window cleaner quickly, and neither of them is
        about price.
    - type: list
      items:
        - How do you reach the upstairs glass? A pole from the ground is safe
          and needs nothing from you. A ladder leaned against a gutter bends the
          gutter, and a ladder on soft ground beside a paved courtyard is how
          people get hurt on a job that was meant to be simple.
        - What is included besides the glass? If frames, sills, tracks and
          screens are extra, the quote you are comparing is not the same job.
          This is where a low number usually comes from.
    - type: paragraph
      text: The other thing worth knowing is that clean glass shows every mark on
        everything around it. Windows are usually the first exterior job people
        book and the one that makes them look at the walls, the gutters and the
        roof for the first time in years. That is normal, and it is why we quote
        the outside of a house as a whole when you ask us to.
