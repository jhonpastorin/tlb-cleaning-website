definition:
  body:
    - type: paragraph
      text: Window cleaning is the washing of the glass, frames, sills and tracks of a
        home, inside and out, so light comes through the way it did when the
        windows were new. TLB Cleaning cleans windows across the Northern
        Rivers, the Tweed and the Southern Gold Coast, either as a one-off or on
        a schedule with your regular clean.
    - type: paragraph
      text: Window cleaning and window washing describe the same job. What sets a
        coastal home apart is the film on the outside of the glass, which is
        salt as much as dust. Salt spray dries on the surface and holds grime
        against it, so a coastal window looks hazy again far sooner than an
        inland one, and it will not come off with a squirt of glass cleaner and
        paper towel.
  backgroundImage: /src/assets/home_cleaning/outside_your_home/clean-coastal-home-exterior.jpg
pathways:
  heading: People arrive here for three reasons.
  headingAccent: Which one is yours?
  cards:
    - image:
        src: /src/assets/home_cleaning/outside_your_home/window_cleaning/salt-hazed-sliding-door-glass.jpg
        alt: A large sliding glass door on a coastal home seen from outside, the glass
