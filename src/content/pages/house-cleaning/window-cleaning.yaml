method:
  heading: What our window cleaning services cover, inside and out
  lead: Six things, and the last four are what separate a window clean from a wipe
    over the glass.
  items:
    - icon: spray-bottle
      title: Glass, both sides
      description: Washed, squeegeed and edged, then the perimeter dried by hand so
        there is no line left around the outside of the pane.
    - icon: target
      title: Frames, sills and reveals
      description: Wiped down with the glass rather than left as a grey border around
        it. Aluminium frames on the coast collect a chalky salt bloom, and that
        is usually what people are seeing when they say the window still looks
        dirty.
    - icon: puzzle
      title: Tracks and drainage holes
      description: Sliding door tracks get vacuumed out and then wiped, including the
        weep holes at the outside edge. A blocked track is why a heavy door
        drags, and it is the one part of a window nobody ever cleans.
    - icon: bloom
      title: Flyscreens and security screens
      description: Taken out where they lift out, washed, dried and put back the way
        they came.
    - icon: idea
      title: Cobwebs and the surrounds
      description: Webs knocked out of the reveal, the eave above the window and the
        corners of the frame, because leaving them there undoes the look of
        clean glass within a fortnight. Nests and hives we point out and leave
        alone.
    - icon: chart-bars
      title: Purified water on the high ones
      description: Anything above the ground floor is done from the ground with a
        water-fed pole running filtered water, which dries without spotting so
        there is nothing to squeegee. It also means no ladder leaning on your
        gutter.
salt:
  heading: Why coastal windows go hazy faster
  body:
    - Salt does not blow onto glass as grit and sit there. It arrives as fine
      spray, dries into a film and then holds every bit of dust and pollen that
      lands afterwards against the surface. That is why a window three streets
      back from the beach can look worse than one in a paddock, and why the haze
      comes back sooner here than anywhere inland.
    - It also means dry wiping makes it worse. Rubbing a dry salt film across
      glass drags the grit it is holding, and on older glass that leaves fine
      scratching you cannot polish out. The fix is water, a wash and a squeegee,
      not a cloth and a spray bottle.
