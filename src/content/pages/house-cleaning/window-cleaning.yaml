bookingFaq:
  heading: Booking a window clean
  items:
    - question: Do you do the inside of the windows as well?
      answer: Usually yes, and most people want both, because clean glass outside
        makes the inside obvious. If we are doing the inside we work
        around you, put mats down under each window and take the tracks and
        sills as we go.
    - question: How often should we get them done?
      answer: Twice a year suits most homes here, and the closer you are to the beach
        the more that matters. Holiday lets and homes right on the water often
        go quarterly, because guests photograph the view and salt film shows up
        in every one of those photos. We can put it on the same schedule as your
        regular clean.
    - question: Can you reach our upstairs windows?
      answer: First-floor glass is done from the ground with a water-fed pole, so
        there is no ladder against your gutter and nothing for you to hold. If
        a window is
        genuinely unsafe to reach we will say so rather than improvise.
    - question: Does anyone need to be home?
      answer: Not for the outside. We need side access, the gate unlocked and any dogs
        sorted out, and a tap we can use if we are running a pole system. For
        inside glass someone needs to let us in, or we use whatever arrangement
        your regular clean already runs on.
    - question: What happens if it rains after you have been?
      answer: Clean glass stays clean through rain. Rain is only a problem on glass
        that was already dirty, because it runs the film down the pane in
        streaks. If a storm drops mud or salt spray on windows the same week we
        did them, ring us and we will look at it.
generalFaq:
  heading: Window cleaning FAQs
  items:
    - question: What is pure water window cleaning?
      answer: Water run through a filter that strips out the dissolved minerals, then
        fed up a telescopic pole to a soft brush head. Because there is nothing
        left in the water to dry on the glass, the pane can be left wet and it
        dries clear with no spots. That is what makes cleaning first-floor
        windows from the ground possible at all.
    - question: How often should windows be cleaned in a coastal home?
      answer: Twice a year is the usual settling point, quarterly for homes on the
        water or holiday lets that are photographed constantly, and once a year
        is enough well back in the hinterland. Salt film is the variable. The
        nearer the surf and the more onshore wind a wall faces, the sooner the
        haze comes back.
    - question: Can hard water stains be removed from glass?
      answer: Fresh spotting comes off with a wash. Spotting that has been baking on
        for years is different, because the minerals slowly etch into the
        surface of the glass and the mark is then in the glass rather than on
        it. It can often be improved with a polish, not always fully removed,
        and a sprinkler hitting a window every morning is the usual cause.
    - question: Is it safe to clean upstairs windows yourself?
      answer: "Ladder falls at home are common and often serious, and the risk goes up
        on the ground most houses actually have: soft soil, a slope, pavers, or
        a gutter that flexes when a ladder leans on it. Working from the ground
        with a pole avoids the fall entirely, which is why professionals moved
        to poles for anything above the ground floor."
    - question: How much does window cleaning cost?
      answer: Window cleaning is usually priced per window or per pane, with a minimum
        charge for small jobs, and the rate moves with height, access, how many
        are sliding doors and whether screens and tracks are included. That's
        why we quote rather than publish a flat rate that would be wrong for
        most homes. Ask for the price against a written list of what is covered
        rather than an hourly rate. Tell us the basics and you'll have a price
        back quickly, with no obligation attached to it.
