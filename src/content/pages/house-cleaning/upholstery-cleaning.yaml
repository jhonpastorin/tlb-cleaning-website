method:
  heading: How our upholstery cleaning works, stage by stage
  lead: Six stages. The first one is a label, and it decides the other five.
  items:
    - icon: target
      title: We find the label first
      description: Under a cushion or beneath the frame there is a tag with a cleaning
        code on it. W, S, WS or X. That single letter decides everything that
        happens next, and we look for it before we open a bottle.
    - icon: puzzle
      title: Then we test where it will not show
      description: Labels go missing and covers get replaced, so the code is a
        starting point rather than the last word. A test patch on a hidden
        section, usually the back or under a skirt, confirms the fabric is
        colourfast before anything reaches the part you look at.
    - icon: spray-bottle
      title: Dry soil and hair out first
      description: A thorough vacuum with a brush head, into the seams and under the
        cushions. Crumbs, sand and pet hair come out dry or they turn to paste
        the moment the fabric is damp. This is where a surprising amount of the
        improvement comes from.
    - icon: spark
      title: Marks treated individually
      description: Head and hand marks on the arms are body oil and need a different
        treatment from a food spill, which needs a different one again from ink.
        Arms, headrests and the front edge of the seat are the areas that always
        need the most work.
    - icon: chart-bars
      title: Cleaned to the code, not to a formula
      description: Water safe fabrics get low moisture extraction with the hand tool.
        Solvent only fabrics need a dry method instead, and delicate or X-coded
        covers get vacuumed and left alone rather than risked.
    - icon: office
      title: Groomed and dried
      description: The pile is groomed back the right way so it dries evenly without
        watermarks, and we get air moving through the room. Drying time depends
        on the fabric, the airflow and the weather, and we will tell you what to
        expect on the day. Cushions go back only once they are dry, never
        before.
spills:
  heading: What to do in the first ten minutes after a spill
  body:
    - type: paragraph
      text: The most expensive thing that happens to a lounge is not the spill. It is
        what gets done to the spill in the first ten minutes. Scrubbing at a
        mark drives it deeper and lifts the nap so that spot looks different
        forever, even after the stain is gone. A supermarket spot cleaner
        sprayed on undiluted leaves a ring of clean fabric with a tidemark
        around it, and that ring is often harder to fix than the original mark.
        On a water sensitive fabric, plain tap water on a cloth is enough to
        leave a permanent watermark.
    - type: paragraph
      text: If something goes on your lounge, blot it. Press a clean dry cloth
        straight down, lift, move to a dry part of the cloth, repeat. Do not
        rub, do not soak it, do not reach for whatever is under the sink. Then
        ring someone. Almost everything is recoverable when it is fresh and
        untouched, and a good proportion of what we cannot fix is damage from
        the rescue attempt rather than from the spill.
