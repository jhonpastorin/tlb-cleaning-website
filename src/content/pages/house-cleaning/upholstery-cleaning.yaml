definition:
  body:
    - type: paragraph
      text: "Upholstery cleaning is the deep cleaning of soft furniture in your home:
        lounges, armchairs, ottomans, bed heads and dining chairs. Most fabric
        is cleaned with a hand-held extraction tool that puts a controlled
        amount of solution into the fabric and draws it back out, so the cover
        is cleaned without being soaked. TLB Cleaning cleans upholstery across
        the Northern Rivers and the Tweed."
    - type: paragraph
      text: The thing that decides how a lounge is cleaned is not how dirty it is. It
        is the cleaning code the manufacturer put on the label, usually under a
        cushion or beneath the frame. W means water based cleaning is fine, S
        means solvent only, WS means either, and X means vacuum only and nothing
        wet at all. A cleaner who does not look for that tag is guessing with
        your furniture.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
