bookingFaq:
  heading: Booking an upholstery clean
  items:
    - question: How long before we can sit on it?
      answer: Usually a few hours, and comfortably by that evening. We use as little
        moisture as the fabric needs rather than soaking it, groom the pile back
        and get air moving before we go. Cushions go back on once they are
        properly dry, because putting a damp cushion back on a damp base is how
        a lounge ends up smelling worse than it started.
    - question: Do you clean the cushions and under them too?
      answer: Yes. Cushions are done on both sides where the fabric allows, and the
        frame underneath gets vacuumed out along with the seams. That is where
        the crumbs, coins, hair and sand live, and it makes more difference to
        how a lounge feels than the surface clean does.
    - question: What if our lounge cannot be wet cleaned?
      answer: Then we do not wet clean it. Some fabrics are solvent only and some are
        vacuum only, and both are common in older and imported furniture. We
        check the label and test before anything happens, and if your lounge is
        one we should not touch we will tell you and say why rather than take
        the job.
    - question: Can you get rid of the dog smell?
      answer: Usually a good way. Most of what you smell is oil and hair held in the
        fabric and down in the seams, and that comes out with a thorough clean.
        If a pet has actually wet the lounge and it has soaked through into the
        foam, that is harder, because a surface clean does not reach foam. We
        will tell you which one you have before we start.
    - question: What happens if I get in touch?
      answer: Tell us what the lounge is, roughly how old, and what has happened to
        it. We look at the label and the fabric when we arrive, test a hidden
        patch and give you a price. It can go on the same visit as your regular
        clean if that suits.
generalFaq:
  heading: Fabric codes, leather and how often to clean
  items:
    - question: What do the cleaning codes on a lounge label mean?
      answer: W means water based cleaning is safe. S means solvent only, so no water
        at all. WS means either will do. X means vacuum only, with no cleaning
        agent of any kind. The tag is usually under a seat cushion or stapled
        beneath the frame. If a cleaner has not asked to see it, they do not yet
        know what they are allowed to use on your furniture.
    - question: How often should a lounge be cleaned?
      answer: Every twelve to eighteen months suits most households. Bring that
        forward to every six to twelve months with pets, small children, or a
        lounge that gets eaten on nightly. Vacuuming the seams and rotating the
        cushions every few weeks does more for how long a lounge lasts than any
        deep clean, because it stops grit from cutting the fibres.
    - question: Can you clean a leather lounge the same way?
      answer: "No. Leather is not upholstery in the cleaning sense: it is a finished
        surface, and it is cleaned and conditioned rather than extracted. Water
        based upholstery methods can strip the finish and dry the hide out.
        Treat leather as a separate job and ask specifically whether a cleaner
        does it."
    - question: Will cleaning make my lounge look worn?
      answer: It should not, but it can reveal wear that was already there. Cleaning
        removes the film of soil that sits evenly over a fabric, and where the
        pile is genuinely flattened or abraded, usually the arms and the front
        seat edge, that becomes more visible once the surrounding fabric is
        clean again. That is existing wear showing, not new damage, and a good
        cleaner will point it out beforehand.
    - question: How much does upholstery cleaning cost?
      answer: Upholstery is usually priced per seat or per item, so a three seater,
        two armchairs and six dining chairs are quoted as separate line items
        rather than by the hour. What moves the price is the fabric, the size,
        the condition and whether any spot treatment is needed. That's why we
        quote rather than publish a flat rate that would be wrong for most
        homes. Tell us the basics and you'll have a price back quickly, with no
        obligation attached to it.
