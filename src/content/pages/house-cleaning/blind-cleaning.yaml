method:
  heading: How our venetian blind cleaning works
  lead: Six stages, and the same ones for shutters and fans. Dry before damp, and
    support before pressure.
  items:
    - icon: target
      title: Dry dust comes off first
      description: Everything gets dusted or vacuumed with a brush head before
        anything damp appears. Dust plus a wet cloth is mud, and on a white slat
        or a fan blade that means smears you then have to chase around the room.
    - icon: idea
      title: Ceiling fans, blade by blade
      description: The felt of dust sits on the top of each blade where nobody sees
        it, and the housing and pull chain collect it too. Each blade is
        supported and wiped rather than swiped at, because bending a blade is
        what puts a wobble in a fan.
    - icon: spark
      title: Hard blinds and shutters, slat by slat
      description: Aluminium, timber and faux timber slats get done individually, both
        faces, along with the head rail, the cords or wand and the bottom rail.
        There is no fast way to do this properly, which is the entire reason
        people book it out.
    - icon: bloom
      title: Fabric handled dry, or not at all
      description: Roller, roman and sunscreen blinds mark permanently if they are
        treated like a hard surface, and a water ring on a fabric blind is worse
        than the dust was. These get dry methods and spot work only.
    - icon: puzzle
      title: Tracks, sills and pelmets
      description: The window track is where the dust ends up once the blind above it
        has been done, along with dead insects and sand, so it gets cleared and
        wiped as part of the same job rather than left as the giveaway.
    - icon: house
      title: Only as high as is safe
      description: Standard ceilings and windows are routine. A raked ceiling, a
        stairwell void or a second storey reached from outside is a different
        job with different equipment, and we will tell you when something is
        beyond a step ladder rather than improvise.
scope:
  heading: Ask whether your blinds are leaving the house
  body:
    - There are two ways to clean a blind, and they are not the same service. In
      situ means it stays on the window and is cleaned in place, which is
      quicker and costs less and suits most dusty but otherwise sound blinds.
      Ultrasonic means the blind is taken down, put through a bath off site and
      rehung a day or two later, which gets a far better result on something
      greasy or genuinely neglected, and leaves you with a bare window in the
      meantime. Neither is better in general. Just make sure you know which one
      you are buying.
worthKnowing:
  heading: Most damaged blinds were damaged by cleaning
  body:
    - type: paragraph
      text: "Most damaged blinds in this region are not damaged by dirt. They are
        damaged by someone cleaning them, and the two ways it happens are worth
        knowing before you spend a Saturday on a ladder. The first is water: a
        fabric roller or roman blind that gets wiped with a damp cloth will very
        often dry with a visible tidemark, and unlike a carpet there is no way
        to blend it out afterwards. The second is force. A venetian slat wiped
        hard without being supported from behind bends, and a bent slat never
        sits flat again, so the blind will not close properly from then on."
    - type: paragraph
      text: Ceiling fans have their own version of this. A fan blade is a balanced
        aerofoil, and pushing down hard on the end of one while you scrub the
        top of it is how a fan that ran silently for ten years starts to wobble.
        If you are doing it yourself, hold the blade from underneath and wipe
        with the other hand. If a fan already wobbles, that is an electrician or
        a balancing kit rather than a cleaner.
