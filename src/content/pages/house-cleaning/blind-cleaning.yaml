faq:
  heading: Frequently asked questions
  items:
    - question: Can you do this with our regular clean?
      answer: Yes, and that is how most people do it. We allow extra time on a visit
        that is already booked rather than sending someone out for it
        separately, which keeps the cost down. Once or twice a year suits most
        homes. Just tell us which rooms you want done when you book.
    - question: Do you do ceiling fans as well as blinds?
      answer: Yes, and they are usually done in the same pass, because both are
        overhead work in the same room. Blades are wiped top and bottom with the
        blade supported, and the housing and pull chain are done too. If a fan
        wobbles when it runs, tell us, because that is a balancing or electrical
        issue rather than a cleaning one.
    - question: What about high windows and raked ceilings?
      answer: Standard ceiling heights are routine. A raked ceiling, a stairwell void
        or anything that needs more than a step ladder is a different job, and
        we will tell you honestly if it is beyond what we can do safely rather
        than have someone stretch off the top rung.
    - question: Can you clean our fabric roller blinds?
      answer: They are dusted and spot treated rather than wet cleaned, because water
        marks fabric blinds permanently and a tidemark cannot be blended out
        afterwards. If a fabric blind is genuinely soiled rather than dusty, the
        honest answer is usually specialist ultrasonic cleaning or replacement,
        and we will say so.
    - question: What happens if I get in touch?
      answer: Tell us roughly how many windows, what kind of blinds and how many fans.
        We will give you a price and either book it in on its own or add it to
        your next regular clean, whichever works out better for you.
nonBrandedFaq:
  heading: Blind, fan and curtain cleaning FAQs
  items:
    - question: How often should blinds be cleaned?
      answer: A quick dust every few weeks as part of normal cleaning, and a proper
        detailed clean once or twice a year. Bring that forward in a kitchen,
        where dust binds with cooking grease into a film that no longer dusts
        off, and near the coast or an unsealed road, where the dust load is
        simply higher. Regular light dusting is what stops it reaching the
        greasy stage.
    - question: What is the best way to clean venetian blinds?
      answer: "Dry first, always: dust or vacuum with a brush head before anything
        damp goes near them, because dust plus moisture is mud. Then wipe each
        slat with the slat supported from behind so it cannot bend. Work from
        the top down so what falls lands on slats you have not done yet, and
        finish with the head rail, the cords and the window track underneath."
    - question: Can you wash fabric or roller blinds with water?
      answer: Generally no, and this is where most self-inflicted blind damage comes
        from. Most roller, roman and sunscreen fabrics are treated or coated,
        and water leaves a visible ring as it dries that cannot be blended out
        the way a mark on carpet can. Dry dusting and careful spot treatment are
        the safe options. Anything beyond that is a specialist ultrasonic clean
        or a replacement.
    - question: Why does my ceiling fan wobble after being cleaned?
      answer: Almost always because a blade got bent. Fan blades are balanced as a
        set, and pressing down on the end of one while scrubbing the top is
        enough to put a slight bend in it, which shows up as a wobble as soon as
        the fan runs. Support the blade from underneath while you wipe. A fan
        that already wobbles needs a balancing kit or an electrician, not a
        cleaner.
    - question: How much does blind and fan cleaning cost?
      answer: "Usually priced per blind and per fan, with a lower rate when a whole
        house is done at once or when it is added to an existing clean. Size and
        type move it: a wide vertical blind or a plantation shutter takes longer
        than a small venetian. That's why we quote rather than publish a flat
        rate that would be wrong for most homes. Tell us the basics and you'll
        have a price back quickly, with no obligation attached to it."
    - question: Can curtains be cleaned without taking them down?
      answer: "Light dust can be vacuumed off in place with a brush head. Anything
        more depends on the care label: lined, blockout and sheer curtains can
        shrink or mark if they are washed or steamed wrong, so they usually come
        down for a proper clean."
