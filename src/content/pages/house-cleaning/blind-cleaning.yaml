definition:
  body:
    - type: paragraph
      text: "This is the detail cleaning of the things above eye level: venetian and
        vertical blinds, roller blinds, plantation shutters, pelmets, window
        tracks and ceiling fan blades. Every one of them collects dust on a
        horizontal surface you cannot see from standing height, which is why
        they are invisible until low sun comes through the window and shows you
        all of it at once. TLB Cleaning cleans blinds, shutters and fans across
        the Northern Rivers and the Tweed."
    - type: paragraph
      text: It is almost always an add-on rather than a job on its own. A regular
        clean is scheduled around the surfaces that get used daily, so anything
        overhead gets done occasionally at best. Booking it once or twice a year
        alongside a regular visit is how most people deal with it, and it costs
        less than calling someone out for it separately.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
