bookingFaq:
  heading: Booking a driveway or patio clean
  items:
    - question: Will it damage our concrete or pavers?
      answer: Not if the pressure is matched to the surface, which is the first thing
        we work out. Old, decorative or already crumbling surfaces get flagged
        before we start rather than after, and pavers get the sand in the joints
        treated with respect. Render, paint, cladding and roofs get a soft wash
        instead of force.
    - question: Can you get the oil stain off our driveway?
      answer: Usually a good way, sometimes not completely. Fresh oil responds well to
        a degreaser with dwell time and the right heat. Oil that has been
        soaking into porous concrete for years is in the slab, and no amount of
        pressure pulls it back out. We tell you which one you have before we
        quote.
    - question: How long does it take?
      answer: A driveway and front path at an average house is usually half a day. Add
        the patio, the pool surround and the fences and it becomes a full day.
        Heavily stained surfaces take longer because the time goes into
        pre-treatment, not into more pressure. You get the estimate with the
        price.
    - question: What do you need from us on the day?
      answer: Cars off the area being cleaned, furniture and pots moved if you can,
        the gate unlocked and dogs inside. Everything else,
        including the machine, comes with us.
    - question: Can you do it while we are out?
      answer: Yes, as long as we can get in and reach a tap. Most people are at work
        for it. We will send you a message when we are done and let you know
        anything we found, like a cracked paver or a downpipe discharging onto
        the path, which is often why an area keeps going green.
generalFaq:
  heading: High pressure cleaning FAQs
  items:
    - question: How often should a driveway be pressure cleaned?
      answer: Once a year suits most homes, and shaded or tree covered areas often
        want it more like every eight months. The shaded southern side of a
        house grows algae far faster than the sunny side, so it is normal for
        one path to need doing twice as often as the driveway. Surfaces kept on
        a schedule cost less each time.
    - question: What is the difference between pressure cleaning and soft washing?
      answer: Pressure cleaning uses force to remove what is sitting on a hard
        surface, and suits concrete, pavers, brick and steel. Soft washing uses
        low pressure and a cleaning solution, and suits render, paint, cladding,
        fences and roofs, where force would strip the finish or push water in
        behind it. Soft washing also treats growth at the root, so it stays
        clean longer.
    - question: Can high pressure cleaning damage a timber deck?
      answer: Yes, easily. Pressure lifts the soft fibres between the grain, so the
        boards feel furry, splinter more and weather grey faster than before. A
        deck wants a gentle wash with the right cleaner and a brush, worked
        along the grain, not a wand held close. Anyone who quotes a deck at
        driveway pressure is going to cost you the deck.
    - question: Where is the water allowed to go?
      answer: "Clean rinse water off a path can generally go where rain would. Water
        carrying oil, grease, detergent or paint cannot: in NSW, letting
        polluting matter enter a stormwater drain is an offence under the
        Protection of the Environment Operations Act 1997, and stormwater runs
        to the creek untreated. That kind of run-off has to be contained, so ask
        any cleaner how they handle it before they start."
    - question: How much does high pressure cleaning cost?
      answer: It is usually priced per square metre with a minimum charge for small
        jobs, and the rate moves with the surface, how badly stained it is,
        access to water and power, and whether anything needs soft washing
        instead. That's why we quote rather than publish a flat rate that would
        be wrong for most homes. Ask for the price against a written scope
        rather than an hourly rate, so you can see what is included. Tell us the
        basics and you'll have a price back quickly, with no obligation attached
        to it.
