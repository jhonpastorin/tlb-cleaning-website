definition:
  body:
    - type: paragraph
      text: A high pressure cleaning service is the cleaning of outdoor hard surfaces
        at a home with pressurised water. Driveways, paths, patios, pool
        surrounds, courtyards, steps, fences and retaining walls. It lifts off
        the grime, algae, moss and oil that build up on anything left out in the
        weather. TLB Cleaning does high pressure cleaning for homes across the
        Northern Rivers, the Tweed and the Southern Gold Coast.
    - type: paragraph
      text: "Pressure cleaning, pressure washing and high pressure cleaning all
        describe the same work. Soft washing is genuinely different: low
        pressure and a cleaning solution instead of force, for render, paint,
        cladding, roofs and anything else that force would strip. Most homes
        need both, and the skill is knowing which surface takes which. If you
        want the walls and the roof done, that is exterior house washing and
        roof cleaning, and they are linked further down."
  backgroundImage: /src/assets/home_cleaning/outside_your_home/clean-coastal-home-exterior.jpg
