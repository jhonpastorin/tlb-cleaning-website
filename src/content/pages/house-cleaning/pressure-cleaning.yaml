warning:
  heading: Some of these should never see high pressure
  body:
    - A wand that cleans a concrete driveway will wreck other things around the
      same house in seconds. Rendered and painted walls strip. Timber decking
      furs up and splinters, and the grain lifts so it goes grey again faster
      than before. Pavers lose the sand out of the joints, which is what was
      holding them still. Roof tiles lose their surface coating. Cladding lets
      water in behind it, where it keeps causing damage after the machine has
      gone.
    - "None of that shows in a quote. It shows on your house, and it does not
      wash off. The right answer for those surfaces is a soft wash: low pressure
      and a cleaning solution instead of force. We use both, and at the quote we
      will tell you which of your surfaces gets which."
method:
  heading: What our high pressure cleaning services involve, stage by stage
  lead: Six stages, in this order. The second and the last are the ones a rushed
    job skips.
  items:
    - icon: target
      title: Pressure matched to the surface
      description: Concrete, exposed aggregate, pavers, sandstone, tiles, render and
        painted steel all take a different setting, and the wrong one leaves a
        mark that cannot be undone. This is the first thing we work out and it
        is most of what you are paying for.
    - icon: puzzle
      title: We move things and cover things first
      description: Cars off the driveway, furniture and pots off the patio, garden
        beds along the edge wet down, windows and door seals checked. Ten
        minutes of setting up is the difference between a clean driveway and a
        wet laundry.
    - icon: spray-bottle
      title: Pre-treat, then clean
      description: Oil, grease and organic growth get a treatment with dwell time
        before any water goes near them, and grease needs heat or a degreaser to
        release at all. Blasting a stain cold just spreads it.
    - icon: chart-bars
      title: Surface cleaner on the flat, wand on the edges
      description: Open areas are done with a rotary surface cleaner, which cleans
        evenly and leaves no stripes. Edges, steps, kerbs and corners are
        finished by hand. Stripes across a driveway are the signature of a job
        done entirely with a wand.
    - icon: bloom
      title: Soft wash where force would do damage
      description: Render, painted surfaces, cladding, fences and roofs get low
        pressure and a cleaning solution. It also kills the algae and mould at
        the root rather than knocking the top off it, which is why a soft washed
        surface stays clean longer.
    - icon: idea
      title: Your garden and your pool
      description: Beds get rinsed, and the pool gets covered or the surround is
        worked away from it.
