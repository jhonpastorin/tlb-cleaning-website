  headingLines:
    - Deep cleaning that resets the whole house
  lead: A one-off deep clean across the Northern Rivers, the Tweed and the
    Southern Gold Coast. Before the guests arrive, when you move in, or when
    it's just got away from you. {{line.fast}}
