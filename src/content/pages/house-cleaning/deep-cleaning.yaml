booking:
  heading: "{{line.fast.heading}}"
  body:
    - type: paragraph
      text: "Managed for you. The part people put off isn't the cleaning, it's the
        organising: working out who to ask, waiting on a quote that never lands,
        then wondering whether anyone's actually coming. You pick a date that
        suits you, you get it confirmed in writing, you get a message when we're
        on the way, and if anything changes you hear it from us first."
    - type: paragraph
      text: Book online in a couple of minutes, or send a text, ring us or drop us an
        email, whichever you'd actually do.
    - type: paragraph
      text: You get a quote back fast rather than waiting days on someone to come out.
        It's based on the house as it actually is, so tell us honestly what
        condition it's in when you book. Nothing you say will surprise us, and
        it means we allow the right amount of time rather than running short on
        the day.
    - type: paragraph
      text: Cost effective because one deep clean does the heavy work in a single
        visit. If you're setting up a regular clean afterwards, this is the
        better way round. And if your home needs more time than we've quoted,
        you'll hear that before we start rather than on the invoice.
