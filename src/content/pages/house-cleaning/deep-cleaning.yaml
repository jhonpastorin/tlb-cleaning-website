faq:
  heading: Frequently asked questions about deep cleaning
  items:
    - question: My house hasn't had a proper clean in years. Is that a problem?
      answer: Not at all, that's the job. Tell us honestly how it is when you book so
        we can allow the right time, and we'll quote for what's actually there
        rather than a guess.
    - question: How do I know it'll actually be a deep clean and not a quick once-over?
      answer: Because the task list is published on this page before you book. You
        know what you're getting, and so do we.
    - question: What if the house needs more time than we booked?
      answer: We'll tell you before we start, not after. You'll have the option to add
        time, or to tell us what matters most so we prioritise that. You won't
        get a surprise on the invoice.
    - question: How long does a deep clean take?
      answer: Considerably longer than a regular clean, because it's the detail work.
        A three-bedroom home in reasonable condition is usually most of a day
        for a team. If it's been a while, longer. We'll give you a realistic
        window when we quote.
    - question: How much does a deep clean cost?
      answer: It depends on the size of the house and the condition it's in, which is
        why we quote rather than publish a flat rate. Tell us the basics and
        you'll have a price back quickly, with no obligation attached.
    - question: What isn't included in a deep clean?
      answer: A deep clean covers the detail work inside your home, so a few jobs sit
        outside it. We don't wash dishes, do laundry, or tidy and organise your
        belongings. Cleaning at height, exterior windows, carpet steam cleaning
        and inside-the-oven work are all quoted separately. If you're unsure
        whether something is covered, ask when you book and we'll tell you
        straight.
    - question: Do cleaners move furniture during a deep clean?
      answer: Yes, within reason. Our team moves light furniture like dining chairs,
        bedside tables and small items so we can clean properly underneath and
        behind. We don't move heavy furniture, appliances or anything that could
        be damaged. If you want behind a wardrobe or under a bed done, move it
        beforehand or tell us and we'll work out what's possible.
    - question: Do you bring your own products and equipment?
      answer: Yes, everything. If you'd prefer particular products used in your home,
        tell us when you book.
    - question: Can I book a deep clean and then set up a regular one?
      answer: Yes, and most people do. It's the better way round, because the deep
        clean does the heavy work once and the regular visits hold it there.
    - question: Can I book over the phone instead of online?
      answer: Yes. Online, text, phone or email, whichever suits you.
    - question: Do you deep clean apartments and units?
      answer: Yes. An apartment deep clean is the same task list in a smaller
        footprint, so it usually takes less time than a house with the same
        number of bedrooms. Strata buildings sometimes have lift bookings or
        access rules for contractors, so tell us the building when you book and
        we'll sort that out beforehand rather than on the day.
closingCta:
  heading: One deep clean, and the house starts again.
  lead: Tell us the condition your home is in and we'll quote for what's actually
    there. Most people book this once, then set up a fortnightly and stop
    thinking about the house altogether.
