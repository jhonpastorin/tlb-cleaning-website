definition:
  body:
    - type: paragraph
      text: A deep clean is a one-off, room-by-room reset that covers the detail work
        a regular clean doesn't reach. Some people call it a once-off clean or a
        move in clean, and it's the same job. TLB Cleaning provides house deep
        cleaning services across the Northern Rivers, the Tweed and the Southern
        Gold Coast.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
