inclusions:
  heading: What's included in a deep clean
  lead: Everything in a regular clean, plus the detail work underneath it. This is
    the full deep cleaning checklist, published before you book rather than
    after.
  items:
    - heading: Kitchen
      body:
        - Inside and outside of cupboards, splashback, rangehood, oven exterior,
          benchtops, sink and taps, appliance exteriors, behind and beside where
          we can reach, floors including edges and corners.
    - heading: Bathrooms and toilets
      body:
        - Shower screen and tiles including grout, bath, basin, taps and
          fittings, mirrors, exhaust fan cover, toilet inside and out including
          the base and behind, floors and skirting.
    - heading: Bedrooms and living areas
      body:
        - Skirting boards, door frames, architraves, light switches and power
          points, window sills and tracks, inside windows, ceiling fans,
          cobwebs, vents, full vacuum including edges, under moveable furniture,
          mop.
    - heading: Laundry
      body:
        - Sink, benches, cupboard fronts, behind and beside appliances where
          accessible, floors.
    - heading: Throughout
      body:
        - Doors, handles, light fittings, air vents, all floors and edges.
exclusions:
  body:
    - "Quoted separately: inside the oven, carpet steam cleaning, exterior
      windows, blinds, inside the fridge, cleaning at height."
    - "Not included: dishes, laundry, tidying or organising belongings."
    - Want it as something you can print and tick off before we arrive? The full
      deep cleaning checklist is in our guide.
  cta:
    label: The deep cleaning checklist
    href: /guides/what-is-included-in-a-deep-clean/
moments:
  heading: When people book a deep clean
  items:
    - heading: Moving in
      body:
        - Before the furniture goes in, while the place is empty and it's easy.
          A move in clean takes someone else's house back to a baseline before
          it becomes yours.
    - heading: Before guests
      body:
        - Family for Christmas, or the in-laws for a week. High stakes, short
          notice.
    - heading: After a party
      body:
        - Self-explanatory.
    - heading: Before it goes to market
      body:
        - Photos, open homes and first impressions, and the detail an agent's
          camera picks up.
    - heading: The spring reset
      body:
        - Windows open, everything out, the once-a-year one.
    - heading: After a long absence
      body:
        - Coming back to a house that's been shut up for months.
comparison:
  heading: Deep clean, regular clean or bond clean
  cornerLabel: Which one you need
  columns:
    - label: Deep clean
    - label: Regular clean
    - label: End of lease clean
  rows:
    - label: What it is
      values:
        - A one-off reset, room by room
        - Ongoing upkeep on a set schedule
        - A clean measured against an exit inspection
    - label: The standard
      values:
        - Back to a baseline
        - Held at that baseline
        - Whatever the inspection requires
    - label: When
      values:
        - Moving in, before guests, spring, after a long gap
        - Weekly, fortnightly or monthly
        - When the keys go back
    - label: Who decides it passed
      values:
        - The client
        - The client
        - The agent or landlord
  footnote: Most people book a deep clean first and set up a regular clean
    afterwards. It costs less that way round, because the deep clean does the
    heavy work once rather than paying for a long first regular visit.
