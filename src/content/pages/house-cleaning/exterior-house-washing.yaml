      body:
        - Nobody notices it happening, because it arrives one shade at a time
          and always on the side of the house you do not use. The giveaways are
          the streaks under the eaves, the green rising out of the garden bed
          and the window frames that have gone from white to grey.
    - image:
        src: /src/assets/home_cleaning/outside_your_home/exterior_house_washing/clean-weatherboard-wall-and-eaves.jpg
        alt: The freshly washed white weatherboard wall and eaves of a home, the boards
