      heading: And this is who does it
      body:
        - The same small local team who does the rest of your cleaning, working
          top down with low pressure, wetting the garden beds first and rinsing
          everything they touched on the way out.
scope:
  heading: What exterior house cleaning covers on a coastal home
  lead: Six things, in the order they happen. The order is not decoration, it is
    why the lower boards come out clean.
  items:
    - icon: chart-bars
      title: Top down, always
      description: Eaves and gables first, then the walls, then the window frames,
        then whatever the run-off landed on. Washing bottom up means the dirty
        water runs over what you just cleaned, which is why a rushed job leaves
        streaks on the lower boards.
    - icon: spray-bottle
      title: Low pressure and a solution
      description: A cleaning solution applied gently, given time to kill the growth,
        then rinsed at a pressure the surface can take.
    - icon: target
      title: Eaves, soffits and cobwebs
      description: The underside of the eaves is where the webs, the mud nests and the
        dust live, and it is the part everyone forgets. Nests and hives get
        pointed out and left alone rather than knocked down without asking.
    - icon: idea
      title: Window frames, sills and downpipes
      description: Frames, sills, fascia, downpipes, gutters from the outside, and the
        meter box. These are the parts that read as grubby even when the wall is
        clean, and leaving them undone is what makes a wash look half finished.
    - icon: bloom
      title: Plants, pets and furniture
      description: Beds along the wall get wet down before and rinsed after, furniture
        and pots move out of the way, pets come inside, and anything precious in
        the garden gets pointed out to us first.
    - icon: puzzle
      title: Where we stop
      description: Sound painted surfaces, render, weatherboard, brick, fibre cement,
        colorbond and cladding are all fine. Flaking paint, rotten timber and
        old fibre cement that might contain asbestos are not, and we will tell
        you rather than wash them and see.
softWash:
  heading: Why a wash lasts longer than a blast
  body:
    - Force removes what you can see. It leaves the roots and spores in the
      surface of the render or the grain of the timber, and they start again
      from there, which is why a blasted wall can look green again within a
      season. A solution with dwell time kills the growth, so the wall comes
      back slowly and from scratch.
    - It also matters for what the wall is made of. Enough pressure to scour
      mould out of render is enough to take the render with it, and on
      weatherboard it drives water up behind the boards where you cannot see it
      and it does not dry. Slower, gentler and chemically correct is genuinely
      the version that lasts.
