order:
  heading: Do it in this order
  body:
    - type: paragraph
      text: If you are doing the whole outside, the order saves you money.
    - type: list
      items:
        - Roof first, if it needs doing. Everything that comes off a roof lands
          on the walls, the windows and the ground.
        - Then the walls, the eaves and the window frames. This page.
        - Then the windows, so the glass is done after the wall above it has
          been rinsed.
        - Then the gutters, because they catch what the roof and walls shed.
        - Ground last. Driveways, paths and patios take whatever ran off
          everything above them.
    - type: paragraph
      text: Booked the other way around, you pay to clean the driveway twice. We quote
        it as one job when you ask us to, and we will tell you what genuinely
        needs doing this year rather than all five of them.
