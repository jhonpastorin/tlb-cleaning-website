      heading: This is the same wall, washed
      body:
        - "No paint, no render, no repairs. This is the reason people book it
          before selling, before Christmas and before the family arrives: it is
          the least expensive thing you can do to a house that changes how the
          whole place reads from the street."
    - image:
        src: /src/assets/home_cleaning/outside_your_home/exterior_house_washing/cleaner-with-a-soft-wash-lance-at-a-house-wall.jpg
        alt: A cleaner in uniform standing on the lawn beside a washed house wall
