faq:
  heading: Booking a house wash
  items:
    - question: Will it strip our paint?
      answer: "Not sound paint. The pressure is closer to a garden hose than a
        pressure washer, which is the whole point of soft washing. Paint that is
        already flaking or chalking is a different matter: we will show you
        before we start, because a wash will lift what was already letting go."
    - question: How long does the whole house take?
      answer: A single-storey house is usually most of a day, and a two-storey one is
        a day or more depending on access and how much growth there is. Most of
        that time is application and rinsing rather than scrubbing. You get the
        estimate with the price, and we work around whether anyone is home.
    - question: What about our garden?
      answer: Beds along the wall get wet down before we start and rinsed again
        afterwards, which is what protects them. Furniture and pots move, pets
        stay inside, and anything you are precious about gets pointed out to us
        first.
    - question: Can you reach a two-storey wall and the gable?
      answer: "Access is what decides it: a gable end over a steep garden bed is
        harder than a two-storey wall over a lawn. If we cannot reach something safely we will say so instead of
        improvising."
    - question: Can you do the inside mould as well?
      answer: That is a different service, and it has a health dimension that outside
        work does not. Have a look at our mould cleaning and removal page, which
        covers ceilings, cornices, bathrooms and wardrobes, and what causes it
        in the first place. We can do both, quoted separately.
nonBrandedFaq:
  heading: Exterior house washing FAQs
  items:
    - question: What is soft washing a house?
      answer: A low pressure application of a cleaning solution to the walls, eaves
        and trim, left to work and then rinsed off gently. The force is close to
        a garden hose. It suits render, paint, weatherboard, cladding and roofs,
        where high pressure would strip the finish or push water in behind it.
    - question: Why is one side of my house darker than the others?
      answer: Because that side stays damp longest. The southern and shaded elevations
        get less sun and less drying wind, so mould and algae live there happily
        while the sunny walls stay clear. Overhanging trees, a fence close to
        the wall and garden beds against the base all make it worse.
    - question: How often should a house exterior be washed?
      answer: "Every one to two years suits most homes here, and shaded, coastal or
        tree covered houses sit at the shorter end of that. Humidity is the
        driver: the further inland and the more sun a wall gets, the longer it
        stays clean. Doing it before the growth is thick is faster and costs
        less than rescuing it."
    - question: Can old fibre cement cladding be washed?
      answer: Not by us. Fibre cement cladding and eave sheeting installed before the
        1990s can contain asbestos, and washing disturbs the surface, so it is
        work for a licensed asbestos removalist rather than a cleaner. If you
        are not sure what your walls are made of, get it identified before
        anyone cleans them.
    - question: How much does exterior house washing cost?
      answer: It is usually priced on the size of the house and the access, with a
        minimum charge, and it moves with the number of storeys, how much growth
        there is, the wall material and whether the roof, windows or driveway
        are done at the same time. That's why we quote rather than publish a
        flat rate that would be wrong for most homes. Ask for a price against a
        written scope of what is included. Tell us the basics and you'll have a
        price back quickly, with no obligation attached to it.
