definition:
  body:
    - type: paragraph
      text: "Exterior house cleaning, or house washing, is the washing down of the
        outside of a house: the walls, the eaves and soffits, the gable ends,
        the window frames and sills, the downpipes and the fascia. TLB Cleaning
        washes house exteriors across the Northern Rivers, the Tweed and the
        Southern Gold Coast, using low pressure soft washing rather than a high
        pressure blast."
    - type: paragraph
      text: What is on the wall is mostly not dirt. It is a film of mould, algae and
        lichen living on the surface, held there by humidity and shade, mixed
        with salt if you are near the water and dust if you are near a road.
        That is why the shaded side of a house looks like a different colour
        from the sunny side, and why the answer is a cleaning solution with
        dwell time rather than force.
  backgroundImage: /src/assets/home_cleaning/outside_your_home/clean-coastal-home-exterior.jpg
carousel:
