  groupLabel: Near {town}
  note:
    - If a suburb isn't listed, ask us anyway.
faq:
  heading: "Cleaning in {town}: your questions"
  items:
    - question: Do you clean in {town}?
      answer: Yes. {town} is one of our service areas, along with the surrounding
        {region}. If you're just outside it, ask anyway — we'd rather tell you
        than have you guess.
    - question: Is there a travel charge?
      answer: No. {town} is inside our regular run, so the price you're quoted is the
        price.
    - question: How soon can you start?
      answer: Usually within a week or two for a regular clean, and sooner for a
        one-off if there is a gap. End of lease cleans are best booked as soon
        as you have your handover date.
    - question: Do I need to be home?
      answer: No. Most of our regular clients are at work. How we get in is agreed
        when you book, and you'll get a message when the team is on their way.
    - question: Will I get the same cleaner every time?
      answer: Yes, wherever we can. Your home is assigned to a team and that's who
        you'll see. If someone's away, another member of your team covers and we
        let you know beforehand.
    - question: How much does a clean cost?
      answer: It depends on the size of your place, its condition and how often we
        come, which is why we quote rather than publish a flat rate that would
        be wrong for most homes. Tell us the basics and you'll have a price back
        quickly, with no obligation.
closingCta:
  heading: Get a price for your place in {town}.
  lead: Tell us the size of it and roughly what condition it's in, and we'll come
    back with a number.
