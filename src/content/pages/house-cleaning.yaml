faq:
  heading: Frequently asked questions
  items:
    - question: Who's in my house when I'm at work?
      answer: Someone you've met. We'll introduce the cleaner looking after your home
        before the first visit, so you never open the door to a stranger. How we
        get in is agreed when you book.
    - question: Will I get the same cleaner every time?
      answer: Yes, wherever we can. Your home is assigned to a team and that's who
        you'll see. If someone's away, another member of your team covers and we
        let you know beforehand.
    - question: Can I skip a clean when we're away?
      answer: Yes, just let us know ahead of time and we'll move it or skip it. Your
        spot stays yours. Most families skip a fortnight over Christmas and pick
        straight back up in January.
    - question: What happens at the first visit?
      answer: It takes longer than the ones after it, because we're starting from
        wherever the house is. We'll walk through with you, agree the
        priorities, and set the rhythm from there.
    - question: Do I need to tidy up before you arrive?
      answer: Tidy, don't clean. Clearing benchtops, floors and vanities makes a real
        difference, because time spent moving your things is time not spent
        cleaning. Put away clothes, toys, dishes and anything fragile. If the
        house is cluttered on the day, we clean around it and some of the detail
        gets missed.
    - question: How much does a regular clean cost?
      answer: It depends on the size of your place, its condition and how often we
        come, which is why we quote rather than publish a flat rate that would
        be wrong for most homes. Tell us the basics and you'll have a price back
        quickly, with no obligation attached.
    - question: Am I locked into a contract?
      answer: No. No minimum term, no exit fee, and you can pause or skip a visit
        whenever you need to. Most people stay because it's working, not because
        they signed something.
    - question: Is there a minimum booking?
      answer: Most cleaning companies set a minimum of around two hours, because
        anything shorter can't be done properly once travel and setup are
        counted. Tell us the size of your place when you book and we'll tell you
        honestly what it needs.
    - question: What if my cleaner is sick or on holiday?
      answer: Another member of your team covers, and we'll let you know in advance
        rather than leaving you wondering on the day.
    - question: Do you bring your own products and equipment?
      answer: Yes. Our team arrives with everything needed, so you don't have to
        supply anything or set anything out. If you'd rather we used particular
        products in your home, because of a baby, an allergy or a pet, tell us
        when you book and we'll use what you've got or bring an alternative.
    - question: Can I ask for particular things to be prioritised each visit?
      answer: Yes, and most regular clients do. Tell us what matters most in your
        house, whether that's the bathrooms, the floors or the kitchen, and
        we'll work to that order every visit. If your priorities change, message
        us and we'll update the notes on your booking.
    - question: Can I book over the phone instead of online?
      answer: Yes. Online, text, phone or email, whichever suits you.
closingCta:
  heading: Set your day, meet your team, and stop thinking about it.
  lead: Tell us about your place and we'll come back with a price.
