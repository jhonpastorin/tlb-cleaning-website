firstVisit:
  heading: The first one takes longer.
  body:
    - type: paragraph
      text: We start from wherever the house is, so the first visit runs longer than
        the ones after it and is priced differently.
    - type: paragraph
      text: If it's been a while, a one-off deep clean first works out better value
        than paying for a long first regular clean. We'll tell you honestly
        which one you need rather than quoting for the bigger job by default.
buying:
  heading: What you're actually buying.
  body:
    - type: paragraph
      text: It isn't a spotless house. It's not thinking about it.
    - type: paragraph
      text: Not wondering whether anyone's coming this week. Not chasing a reply. Not
        being the one who has to raise it when the bathroom quietly stops being
        done properly.
    - type: paragraph
      text: Set your day once, meet your team, and it happens. A reminder in the
        lead-up so it never sneaks up on you, and a message when we're on our
        way. Some clients want a quick chat when we arrive, others would rather
        come home to it done. Both are completely fine.
  backgroundImage: /src/assets/home_cleaning/inside_your_home/deep_cleaning/deep-cleaning-tidy-living-room-kept-up-by-regular-visits.jpg
