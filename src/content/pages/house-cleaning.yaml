booking:
  heading: "{{line.instant.heading}}"
  body:
    - type: paragraph
      text: Book online in a couple of minutes, or send a text, ring us or drop us an
        email, whichever you'd actually do.
    - type: paragraph
      text: You get a price straight away rather than waiting on a quote, and it's
        based on your actual place rather than a guess. Tell us the size of it
        and roughly what condition it's in, and if a deep clean first would
        serve you better than a long first regular visit, we'll say so.
    - type: paragraph
      text: Cost effective because it's the same team each visit working to a set
        routine, so nobody is relearning your house. No lock-in, no minimum term
        and no exit fee. Skip a visit when you're away, and your spot stays
        yours.
