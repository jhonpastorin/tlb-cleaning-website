honesty:
  heading: Why there is no rating on this page yet
  body:
    - TLB has been booked by word of mouth for years and has only just built a
      website, so there is no long review history to show you. We would rather
      say that than put up a number nobody can check.
    - The quotes on this page are being collected from real clients, with their
      permission, and they will appear here with their first name and their
      town. If we have cleaned for you and you are willing to say so, tell us
      and we will point you at where to leave it.
otherWays:
  heading: Other ways to check us out
  lead: Who we are, what happens after you book, and what it is like working here.
faq:
  heading: "Reviews and standards: FAQs"
  items:
    - question: Where can I read reviews of TLB Cleaning?
      answer: Reviews are being collected from clients as the website launches, and
        they will appear on this page in their own words.
    - question: Do you guarantee my bond back?
      answer: No, and be careful with anyone who does, because a bond is released by
        an agent or a tribunal rather than by a cleaner. What we do is clean to
        the standard your exit inspection is measured against, and come back and
        fix anything the inspection picks up on the cleaning.
    - question: What happens if a clean is not up to standard?
      answer: Tell us and we come back. Under the Australian Consumer Law a service
        has to be provided with due care and skill and be fit for the purpose
        you asked for, and you are entitled to a remedy when it is not.
        Reporting it within a day or two makes it much easier to put right.
    - question: Can I speak to an existing client before I book?
      answer: Ask us. We will not hand out a client list, but plenty of people are
        happy to be asked, and in a region this size you may well already know
        somebody we clean for. That is how nearly every client we have found us.
    - question: Do you work with real estate agencies?
      answer: Yes. Bond cleans, vacancy turnarounds and routine cleans on managed
        properties are a steady part of what we do, and agency work is where the
        standard is least forgiving.
    - question: Are the before and after photos on this site real jobs?
      answer: Yes. Both comparisons on this page are real TLB jobs, published with the
        client’s written permission and with nothing identifying in frame — no
        house numbers, no street signs, no people. Any pair we add later goes up
        the same way, or it does not go up.
closingCta:
  kicker: Reviews
  heading: Ask the person who recommended us.
  lead: Then tell us which town you're in and what your place needs, and we'll
    come back with a price.
