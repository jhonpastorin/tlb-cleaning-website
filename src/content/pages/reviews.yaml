seo:
  title: Reviews | What TLB Cleaning Clients Say
  description: TLB Cleaning grew across the Northern Rivers and the Tweed on
    recommendations rather than advertising. Read what clients say, and how we
    handle it when a clean is not right.
hero:
  kicker: Reviews
  headingLines:
    - Every client we have
    - came from a recommendation.
  lead: TLB grew to a full team, and to steady work with real estate agencies
    across the region, without ever running an advertisement. This is the page
    where that gets checked.
reputation:
  heading: A reputation held by other people
  body:
    - type: paragraph
      text: Word of mouth is a slower way to grow a cleaning business and a harder one
        to fake. Nobody recommends their cleaner to a neighbour on the strength
        of an advertisement. They do it because the house was right, again, on
        the day it was supposed to be.
    - type: paragraph
      text: It also means our reputation has always been held by other people rather
        than by us. The reviews below are being collected from clients who have
        had us in their homes for years, in their words rather than ours.
reviews:
  heading: What our clients say
