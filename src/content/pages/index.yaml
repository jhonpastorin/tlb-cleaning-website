definition:
  body:
    - type: paragraph
      text: TLB Cleaning is a Northern Rivers cleaning company. From Lismore,
        Alstonville and Ballina, up through Byron, Mullumbimby and Murwillumbah
        to Tweed Heads, and everywhere else the beautiful Northern Rivers
        encompasses. We do regular home cleaning, deep and one-off cleans, end
        of lease and bond cleans, Airbnb turnovers and commercial cleaning.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
