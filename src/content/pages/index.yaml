whereWeClean:
  heading: Where we clean
  subheading: Across the Northern Rivers, the Tweed and the Southern Gold Coast.
  note:
    - If a town isn't listed, ask us anyway.
faq:
  heading: Frequently asked questions
  items:
    - question: Are you a franchise?
      answer: No. TLB is locally owned and locally run, started here and still here.
        When you book, you're booking us.
    - question: Will I get the same cleaner every time?
      answer: Yes, wherever we can. Your place is assigned to a team and that's who
        you'll see. If someone's away, another member of your team covers and we
        let you know beforehand.
    - question: Do you cover the inland towns as well as the coast?
      answer: Yes. Lismore, Casino, Alstonville, Kyogle, Murwillumbah and everywhere
        in between. We're a Northern Rivers business, not a coastal one.
    - question: Do you clean in Queensland as well as New South Wales?
      answer: Yes. We work right across the Northern Rivers and the Tweed, and cross
        the border into Coolangatta, Palm Beach and Burleigh Heads.
    - question: How long does a house clean take?
      answer: A rough guide for a maintained home is about an hour for each bedroom
        and bathroom, so a three-bedroom, two-bathroom house usually takes three
        to five hours for one cleaner, or roughly half that with two. Your first
        clean takes longer, because it brings the home to a baseline. After
        that, visits settle into a predictable window.
    - question: Should I book weekly or fortnightly?
      answer: Fortnightly suits most homes. Weekly tends to work better for larger
        households, homes with pets, or anywhere the kitchen and bathrooms get
        heavy use. Start fortnightly and tell us if it isn't holding.
    - question: How much does a clean cost?
      answer: It depends on the size of your place, its condition and how often we
        come. That's why we quote rather than publish a flat rate that would be
        wrong for most homes. Tell us the basics and you'll have a price back
        quickly, with no obligation attached to it.
    - question: Is the first clean more expensive?
      answer: Usually, yes, and we'll tell you that upfront. The first visit starts
        from wherever the house is rather than holding a standard that's already
        set, so it takes longer. After that, your regular visits settle into a
        consistent price.
    - question: Am I locked into a contract?
      answer: No. No minimum term, no exit fee, and you can pause or skip a visit
        whenever you need to. Most people stay because it's working, not because
        they signed something.
    - question: Do you charge extra for the inland towns?
      answer: Our teams live across the region, so we're not driving in from somewhere
        else. Tell us where you are when you book and your quote will reflect
        it.
    - question: Do I need to be home?
      answer: Not at all, and most of our clients aren't. How we get in is agreed when
        you book, and we'll message you when we're on the way.
    - question: Can I book over the phone instead of online?
      answer: Yes. Online, text, phone or email, whichever suits you. Plenty of people
        would rather talk it through the first time, and we'd rather that than
        have you guess at a form.
closingCta:
  heading: Set it up once, and stop thinking about it.
  lead: Tell us which town you're in and what your place needs, and we'll come
    back with a price.
