team:
  heading: Local team, run properly
  blocks:
    - type: image
      image:
        alt: The TLB Cleaning team
    - type: text
      body:
        - TLB was started by Teagan Burke, an Alstonville local who built an
          amazing team around her, one recommendation at a time. No website, no
          advertising, just people telling other people about her.
        - That team is spread right across the Northern Rivers and the Tweed
          now, inland and on the coast, cleaning in the same towns they live in
          and shop in. You'll meet whoever is looking after your place before
          the first visit, and you'll come to know them by name.
        - Behind the local part is a business that runs properly. Set days, set
          teams, and a schedule you don't have to hold in your head.
  cta:
    label: Meet the team
    href: /about/
booking:
  heading: Easy to book, local to the core
  body:
    - type: paragraph
      text: Book online in a couple of minutes. Or send a text, ring us, or drop us an
        email, whichever you'd actually do.
    - type: paragraph
      text: You'll get a reminder in the lead-up so the day never sneaks up on you,
        and a message when we're on our way. If you run a holiday let, we'll
        work straight off your booking calendar so turnovers happen around your
        guests without you organising anything.
    - type: paragraph
      text: Then we turn up and get on with it. Some clients want a quick chat and a
        walk through. Others would rather we let ourselves in and they come home
        to it done. Both are completely fine, and you can change your mind
        whenever you like.
  backgroundImage: /src/assets/home/service-airbnb-and-holiday-let-turnovers.jpg
pricing:
  heading: "{{line.instant.heading}}"
  body:
    - type: paragraph
      text: You'll know the price before we start, not after.
    - type: paragraph
      text: We quote on your actual place rather than a guess, so tell us the size of
        it and roughly what condition it's in and we'll come back with a number.
        If it turns out you need less than you asked for, we'll say so. A
        one-off deep clean followed by a fortnightly usually works out better
        than paying for a long first regular clean, and we'd rather tell you
        that than take the bigger booking.
    - type: paragraph
      text: No lock-in, no minimum term and no exit fee. If it stops suiting you, tell
        us and we'll stop.
