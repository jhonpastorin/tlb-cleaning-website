definition:
  body:
    - type: paragraph
      text: "Commercial restaurant cleaning services cover the premises where people
        eat, drink and gather: cafes and restaurants, pubs and taprooms,
        function rooms and event venues. TLB Cleaning does this work across the
        Northern Rivers and the Tweed, on schedules built around trading hours
        rather than around ours."
    - type: paragraph
      text: On every other kind of premises, cleaning is maintenance. Here it is the
        product. A customer who sits at a sticky table or uses a bathroom that
        has not been done since lunch is not noting a maintenance issue, they
        are writing a review that costs you the next twenty covers. That changes
        the useful question from how cheaply a place can be cleaned to how
        reliably it can be turned around inside the window you actually have.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
