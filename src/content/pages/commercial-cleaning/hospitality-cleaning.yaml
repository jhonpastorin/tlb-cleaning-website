scope:
  heading: What our commercial restaurant cleaning services cover
  lead: Grouped by when it happens relative to trade, because that is the only
    grouping a venue roster can actually use.
  items:
    - icon: spark
      title: "Before service: the front of house reset"
      description: Floors swept and mopped or vacuumed, tables and banquettes wiped
        down including the undersides and the legs, high chairs done properly,
        glass and entry doors cleaned, bathrooms cleaned and restocked. Finished
        and dry before your first customer, every day.
    - icon: bloom
      title: "After an event: the reset"
      description: Tables cleared and stacked, floors vacuumed or mopped, spills and
        food off carpet before they set, bathrooms brought back, bins emptied
        and the room put back to its standard layout ready for the next booking.
        Done overnight so one room can carry two events in a weekend.
    - icon: chart-bars
      title: Periodically, booked outside trade
      description: Carpet extraction in function rooms, upholstery and banquette
        cleaning, high dusting, light fittings, external glass and pressure
        cleaning the paths and forecourt. Booked into your quietest weeks on
        purpose, because none of it is possible in December.
    - icon: puzzle
      title: Not us, and said out loud
      description: Commercial kitchens are a separate scope with their own rules and
        their own page. Exhaust canopy certification, pest control, pool water
        and grease trap servicing are all separate licensed trades. We would
        rather name the boundary than quote past it.
worthKnowing:
  heading: Count how many one-star reviews are about cleaning
  body:
    - type: paragraph
      text: "Look at the one and two star reviews for any café, pub or restaurant in
        this region and count how many are about the room rather than the food.
        It is more of them than anyone expects. Not the menu, not the prices,
        not the service: a sticky table, a bathroom that had not been done since
        lunch, crumbs on the banquette, a smell near the bins. Each of those is
        a fifteen minute failure that sits on your listing for years and gets
        read by everyone deciding between you and the place across the road."
    - type: paragraph
      text: The economics run the other way to how cleaning usually gets budgeted.
        Cutting the pre-open reset from forty minutes to twenty saves you a
        third of an hour of labour and costs you a review, and the review costs
        more than the year’s savings. Which is why the thing to buy is not the
        cheapest visit, it is a visit that happens the same way every single
        time, by somebody who has reset that room before and knows which table
        the afternoon sun hits.
