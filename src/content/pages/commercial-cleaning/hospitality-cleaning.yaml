brandedFaq:
  heading: Booking a venue clean
  items:
    - question: Can you work around our trading hours rather than a fixed roster?
      answer: Yes, and that is how nearly all of this work runs. The daily visit
        happens before you open or after you close, whichever your trade allows,
        and it moves when your hours move seasonally. Function and event work is
        booked to your run sheet rather than to a standing slot. Tell us your
        trading pattern at the walkthrough and the schedule is built backwards
        from it.
    - question: Can you handle peak season?
      answer: That depends entirely on how much notice we have. Christmas through
        January and every long weekend are the constraint for every cleaner in
        this region, and anyone who says yes without asking how many covers and
        functions you are carrying is guessing. Tell us your December bookings
        at the walkthrough and we will tell you honestly what we can hold and
        what we cannot, before you are relying on it.
    - question: Do you restock the consumables?
      answer: "Yes, for the bathrooms and the back of house: toilet paper, hand towel,
        hand soap and bin liners. What needs agreeing is who buys the stock and
        how it is billed, so it goes on the scope rather than turning into a
        monthly conversation about receipts."
    - question: Will it be the same cleaners each time?
      answer: Yes, and here it matters more than almost anywhere. A cleaner who has
        reset your function room before knows which banquettes mark, where the
        sun hits and that the second bathroom door sticks. That knowledge is
        most of the difference between a quick visit and a good one. Our
        cleaners are employed by TLB rather than subcontracted, they stay, and
        you meet them.
    - question: What happens if I get in touch?
      answer: We walk the premises with you, including the bathrooms and the back of
        house, and ask about your trading pattern rather than just your floor
        area. Then you get a written scope per area, a price per visit, and an
        honest answer about capacity in December. No obligation.
faq:
  heading: Restaurant and venue cleaning questions
  items:
    - question: How much does restaurant cleaning cost?
      answer: It depends on the size of the room, how many bathrooms there are, how
        tight the window before opening is and how much periodic work sits
        alongside the daily visit. That's why we quote rather than publish a
        flat rate that would be wrong for most venues. Tell us the basics and
        you'll have a price back quickly, with no obligation attached to it.
    - question: How often should a restaurant be cleaned?
      answer: "Daily for the dining room, bathrooms and front of house, because every
        one of those is judged by a customer on every visit. The periodic work,
        banquettes and upholstery, carpet extraction, high dusting, external
        glass, runs quarterly for most venues and more often for anywhere with a
        heavy lunch trade. Bathrooms are the exception to any frequency
        argument: in a venue doing two services they need attention between
        them, not just before opening."
    - question: What are the cleaning requirements for a café or restaurant in Australia?
      answer: Food businesses are required to keep their premises, fixtures, fittings
        and equipment in a clean and sanitary condition under the Food Standards
        Code, and local councils inspect against it. That covers floors, walls,
        benches, equipment and food contact surfaces, and it is your food safety
        program rather than a cleaning contract that documents how you meet it.
        Your council is the right source for your own premises. This is general
        information, not compliance advice.
    - question: What gets left out of a venue cleaning quote?
      answer: "Four things, consistently: the bathrooms between services rather than
        just before opening, the undersides and legs of tables and banquettes,
        the bin area, and the back of house corridor nobody walks a customer
        down. All four are invisible on the day and all four are what a review
        notices within a month."
    - question: Who cleans a commercial kitchen, the cleaner or the kitchen staff?
      answer: "Both, and the split should be written down. Kitchen staff clean as they
        go and close down the line at the end of service, because food contact
        surfaces and equipment are part of running a kitchen. A cleaning
        contractor takes the periodic work the brigade cannot do mid-service:
        floors and drains properly, walls and splashbacks, behind and under
        equipment, cool room interiors. Exhaust canopy and ductwork cleaning is
        a separate certified trade again."
    - question: What is a function room reset?
      answer: "It is the clean that takes a room from the end of one event to the
        start of the next: tables cleared and stacked, chairs returned to the
        standard layout, floors vacuumed or mopped, food and spills off carpet
        before they set, bathrooms brought back and bins emptied. It is timed
        rather than thorough by nature, which is why the overnight version is
        the one worth paying for when a room carries two bookings in a weekend."
