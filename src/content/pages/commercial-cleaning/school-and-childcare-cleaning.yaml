brandedFaq:
  heading: Frequently Asked Questions
  items:
    - question: Do your cleaners hold a Working With Children Check?
      answer: They have to, and so does anyone else quoting your site. Our cleaners are
        employed by TLB rather than subcontracted, so there is no third party
        holding that paperwork.
    - question: When would you be on site?
      answer: After the last pickup for a centre, and after hours for a school, with
        the periodic work booked into term breaks. Anything that genuinely has
        to happen during the day — a bathroom check, a spill, an outdoor area —
        is done by someone your staff know, signed in through your own process,
        and never alone in a room with children.
    - question: Can you work to our own policies?
      answer: Yes, and yours wins over our standard scope wherever they differ. If
        your cleaning and infection control policy specifies a product, a method
        or a frequency, it goes on the scope in writing.
    - question: Who sanitises the toys?
      answer: "Your educators, on your own rotation and under your own policy. It is
        not us being unhelpful: toy sanitising is a judgement about your
        service’s practice and it belongs with people trained in it, and a
        cleaner doing it informally creates a gap in your own records. We clean
        storage tubs, shelving and the surfaces the toys sit on, which is the
        part that supports your rotation rather than replacing it."
    - question: What products would you use around children?
      answer: Low-odour, low-residue products, rinsed rather than left to air dry on
        any surface a child will touch or mouth, and nothing stored on site
        within reach. Our chemicals arrive and leave with the cleaner. Where
        your policy names particular products or requires a particular dilution,
        we use yours and it is written into the scope.
    - question: What happens if I get in touch?
      answer: We walk the site after hours with you, including the bathrooms and the
        nappy change area, and ask what your own policies require. Then you get
        a written scope split by area with a frequency against each line, a
        price per visit, and a schedule for the periodic work against named term
        breaks. No obligation.
faq:
  heading: School and Childcare Cleaning FAQs
  items:
    - question: How much does school or childcare cleaning cost?
      answer: It depends on how many rooms and bathrooms there are, how much of the
        floor is carpet, whether a mid-day bathroom check is included, and how
        much outdoor hard surface there is. A centre with four rooms and a
        school with twenty classrooms are different jobs at different
        frequencies. That's why we quote rather than publish a flat rate that
        would be wrong for most sites. Tell us the basics and you'll have a
        price back quickly, with no obligation attached to it.
    - question: Do cleaners need a Working With Children Check in NSW?
      answer: Yes, where the work is child-related, and cleaning a school or childcare
        service generally is. The clearance is issued to the individual rather
        than to their employer, and the engaging organisation is expected to
        verify each clearance number online before that person starts and keep a
        record of doing so. Queensland uses a separate scheme, the Blue Card, so
        a contractor working across the border needs both. Check with the Office
        of the Children’s Guardian for the current requirements.
    - question: What are the cleaning requirements for childcare centres in Australia?
      answer: Approved education and care services operate under the National Quality
        Framework, and the National Quality Standard includes obligations about
        the physical environment being safe, clean and well maintained. The
        Standard sets the outcome rather than a task list, so each service
        translates it into its own cleaning and hygiene policy. That policy, not
        a contractor’s brochure, is the document a cleaning scope should be
        written against. This is general information, not compliance advice.
    - question: How often should a childcare centre be cleaned?
      answer: Daily at minimum for every room, bathroom and the nappy change area,
        with the main clean after the last pickup. Bathrooms and high-touch
        surfaces need attention during the day as well, which is why most
        centres run a mid-day check alongside the daily clean. Carpet extraction
        in a childcare room is usually two to four times a year rather than
        annually, because of what lands on it.
    - question: How does cleaning reduce illness in childcare?
      answer: Because the illnesses that close a room travel by hands and surfaces
        rather than through the air. Gastroenteritis and hand-foot-and-mouth
        both spread readily in a childcare setting, and surface cleaning of the
        things children actually touch — low door handles, tap handles, table
        edges, shelf lips, the change bench — is part of the recognised control
        set alongside handwashing and exclusion periods. Floors matter far less
        than the bottom sixty centimetres of everything else.
    - question: Should school cleaning happen during term breaks or during term?
      answer: Both, and they are different work. Daily cleaning happens during term,
        after hours. The periodic work — carpet extraction, hard floor strip and
        seal, high dusting, vents, internal glass — needs empty rooms and drying
        time, so it only really fits a term break. A scope that does not name
        which break each periodic task falls into tends to see none of them
        happen.
