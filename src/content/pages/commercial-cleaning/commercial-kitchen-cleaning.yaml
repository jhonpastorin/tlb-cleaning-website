scope:
  heading: What our commercial kitchen cleaning services cover
  lead: Grouped by what makes each part hard, which is the grouping a chef
    recognises and a quote usually hides.
  items:
    - icon: target
      title: The grease you cannot reach in service
      description: Sides and backs of the cooking line, the gaps between units, the
        wall behind the range, splashbacks up to the canopy line, and the legs
        and undercarriage of every bench. This is where grease actually
        accumulates, because it is the only part a nightly close-down cannot get
        to without pulling equipment out.
    - icon: spray-bottle
      title: Floors and drains, properly
      description: Quarry tile scrubbed rather than mopped, because a mop on a
        grease-loaded tile floor just redistributes it. Grout lines agitated,
        coving cleaned, floor waste grates lifted and the channels cleaned out.
        A kitchen floor that is still slippery after cleaning was mopped, not
        scrubbed, and it is a genuine slip risk for your brigade.
    - icon: bloom
      title: Cool rooms and freezers
      description: Interior walls, ceiling, shelving pulled out and washed, floor and
        the door seals, which is where mould actually starts. [Whether TLB
        defrosts freezers, and whether stock is moved by us or by your team.
        Confirm.] Stock movement should stay with your own staff for food safety
        reasons, and we would rather book around a delivery than take
        responsibility for one.
    - icon: chart-bars
      title: Filters and the visible canopy
      description: Baffle filters removed, degreased, dried and refitted, and the
        canopy interior and underside degreased. [Whether TLB does this at all,
        and if so, the exact wording that makes clear it is NOT a certified
        AS/NZS 1668.1 duct clean. Confirm before this page ships.] Ductwork
        above the canopy is a certified trade and we will give you a name rather
        than a quote.
    - icon: spark
      title: The stainless nobody has time for
      description: Shelving, racks, trolleys, the tops of everything, the extraction
        fan grilles inside the room, dry store shelving and the back of the
        pass. Stainless is polished with the grain rather than scoured across
        it, because a scoured bench looks worse permanently and holds soil in
        the scratches.
    - icon: puzzle
      title: What we will not do
      description: No grease trap pump-outs, which is licensed liquid waste work with
        its own tracking paperwork. No certified duct cleaning. No dismantling
        of gas equipment or anything that needs isolating. No pest treatment.
        Each of those is a licensed trade, and using a general cleaner for one
        is how a kitchen ends up with an invoice and no compliance.
trades:
  heading: Three trades, routinely confused
  lead: Booking the wrong one costs you a compliance document, which is worse than
    paying too much.
  items:
    - type: feature
      icon: spray-bottle
      heading: Periodic deep cleaning
      body:
        - Us. Floors, drains, walls, behind and under the line, cool rooms,
          stainless, filters. Booked monthly or quarterly, done between
          services. No certificate, because none exists for this work — what you
          get is a written scope and a kitchen you can see the difference in.
    - type: feature
      icon: chart-bars
      heading: Certified exhaust cleaning
      body:
        - A specialist. Filters, hood, plenum and the full ductwork to the fan,
          to the maintenance requirements in AS/NZS 1668.1, with a report and a
          certificate for your records and your insurer. Frequency depends on
          how much you fry. Ask us and we will give you a name.
    - type: feature
      icon: puzzle
      heading: Grease trap servicing
      body:
        - A licensed liquid waste contractor. Pump-out, disposal and the
          tracking paperwork, usually on a schedule set by your local council or
          water authority. Not a cleaning job at all, and not something a
          general cleaner can legally take away for you.
worthKnowing:
  heading: A kitchen never looks dirty to the people in it
  body:
    - type: paragraph
      text: "A kitchen never looks dirty to the people in it. It degrades a millimetre
        at a time, on every surface at once, and the brigade adapts around it
        without noticing: the gap behind the fryer, the grout that has gone from
        grey to black, the cool room seal that has started to spot. Then a
        council inspector arrives, or a new head chef starts, or somebody slips,
        and all of it is visible in one afternoon."
    - type: paragraph
      text: "Two things make the frequency worth arguing about rather than the price.
        The first is that grease is a fire load: what accumulates in and above
        an exhaust system is what turns a flare-up into a building fire, and it
        is the reason exhaust cleaning intervals are set by how much you fry
        rather than by the calendar. The second is that under the Food Standards
        Code your premises, fixtures, fittings and equipment have to be kept
        clean and sanitary, and a periodic deep clean on a schedule is how a
        kitchen demonstrates that instead of asserting it. Book it monthly or
        quarterly and it stays a cleaning line item. Leave it and it becomes a
        capital one."
