  subheading: Commercial kitchen cleaning services done between services, not during them
  lead: Your brigade cleans nightly. This is the other clean. Behind the
    equipment, under the benches and into the drains, across the Northern Rivers
    and the Tweed, on the visit that needs the kitchen cold and the line pulled
    out. {{line.fast}}
  image:
    src: /src/assets/commercial_cleaning/premises/commercial-kitchen-cleaner-degreasing-a-stainless-bench.jpg
