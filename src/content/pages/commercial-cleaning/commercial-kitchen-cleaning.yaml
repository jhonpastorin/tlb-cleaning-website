brandedFaq:
  heading: Booking a kitchen deep clean
  items:
    - question: When would you actually be in the kitchen?
      answer: After your last service or before your first prep, and for a full deep
        clean usually overnight or on your closed day. A kitchen has to be cold
        and the line has to be pulled out, neither of which is possible between
        lunch and dinner. Tell us your trading pattern at the walkthrough and we
        will fit the visit into the only gap that genuinely exists.
    - question: Do you do the canopy and the ducts?
      answer: Filters and the visible canopy, yes. Ductwork, no. [Confirm the exact
        scope TLB will offer here, and word it so nobody can read it as a
        certified AS/NZS 1668.1 clean.] Certified exhaust cleaning finishes with
        a report and a certificate for your insurer, and only a specialist can
        issue that. Ask us and we will give you a name instead of a quote.
    - question: How often should we book a deep clean?
      answer: Monthly for a kitchen with a busy fryer and grill, quarterly for a café
        or a kitchen doing mostly cold and oven work. What sets it is how much
        you fry rather than how many covers you do, because oil in the air is
        what lands on every surface in the room. A walkthrough settles it in ten
        minutes, and we would rather quote you quarterly and be right than
        monthly and be greedy.
    - question: Do we have to empty the cool room first?
      answer: "Stock movement should stay with your team, for food safety reasons
        rather than for convenience: your staff know what can leave a cool room
        and for how long, and we do not. [Whether TLB will move sealed stock,
        and whether freezers are defrosted. Confirm.] In practice we book cool
        room work for the morning after a delivery gap, so there is less in
        there to move."
    - question: What chemicals do you use in a food area?
      answer: Food-safe products where surfaces are food contact, and heavy degreasers
        only on floors, walls and equipment exteriors where they can be rinsed
        off properly. Everything is rinsed rather than left to dry on a surface
        food will touch, and nothing gets used near open stock. If your food
        safety program specifies particular products, yours wins and it goes on
        the scope.
    - question: What happens if I get in touch?
      answer: We walk the kitchen when it is cold, look behind the line and lift a
        floor grate, and tell you what is actually there. Then you get a written
        scope, a price per clean and a recommended interval. If what you really
        need is a certified exhaust clean, we will say so and point you at
        someone who can issue the certificate.
faq:
  heading: Commercial Kitchen Cleaning FAQs
  items:
    - question: How much does commercial kitchen cleaning cost?
      answer: A periodic deep clean is priced per job against a written scope, and the
        number moves with the size of the cooking line, how much of the
        equipment has to be pulled out, the floor area of quarry tile, whether
        cool rooms are included and how long it has been since the last one. The
        first clean on a kitchen that has never had one is always the biggest.
        [TLB’s pricing basis. Confirm.]
    - question: How often does a commercial kitchen need deep cleaning?
      answer: "Monthly for a high-volume kitchen with fryers and a chargrill,
        quarterly for lighter cooking. The driver is airborne oil rather than
        covers: frying and grilling put grease into the air that settles on
        every surface in the room, including ones nowhere near the line. Exhaust
        systems are on their own interval, set by cooking type and hours rather
        than by a fixed calendar date."
    - question: What are the legal cleaning requirements for a commercial kitchen in
        Australia?
      answer: Food businesses must keep premises, fixtures, fittings and equipment in
        a clean and sanitary condition under the Food Standards Code, and local
        councils inspect against it. The Code sets the outcome rather than a
        task list, so your own food safety program is what documents how you
        meet it. Exhaust systems have separate maintenance requirements under
        AS/NZS 1668.1. This is general information, not compliance advice — your
        council is the right source for your premises.
    - question: Who is responsible for cleaning a commercial kitchen, staff or a
        contractor?
      answer: "Both, and the split should be written down. Kitchen staff clean as they
        go and close the line down nightly, because food contact surfaces and
        equipment cannot wait for a contractor. A cleaning contractor does the
        periodic work that needs the kitchen cold and the equipment moved. Where
        a scope does not say which is which, the gaps are always the same ones:
        behind the line, the floor grates and the cool room seals."
    - question: Why does kitchen exhaust cleaning need a certificate?
      answer: Because the accumulated grease in a hood and its ductwork is a fire
        load, and the certificate is what shows it was removed to the required
        standard and when. Insurers and landlords commonly ask for that
        evidence, and after a grease fire the absence of it is a problem. A
        visible degrease of the underside of a canopy is useful cleaning but it
        does not address the duct and it does not produce the document.
    - question: Can a cleaner empty a grease trap?
      answer: No. Grease trap waste is regulated liquid waste and it has to be pumped
        out, transported and disposed of by a licensed contractor with the
        tracking paperwork that goes with it, usually on a schedule set by your
        local water authority or council. A general cleaning contractor can keep
        the surrounds clean and tell you when a trap is close to needing
        service, and that is the extent of it.
