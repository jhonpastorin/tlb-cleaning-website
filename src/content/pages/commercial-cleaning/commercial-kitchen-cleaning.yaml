definition:
  body:
    - type: paragraph
      text: "Commercial kitchen cleaning is the periodic deep cleaning of a
        professional kitchen: floors and drains, walls and splashbacks, the
        sides and backs of equipment, under and behind the cooking line, cool
        room interiors and the stainless nobody can reach mid-service. TLB
        Cleaning does this work across the Northern Rivers and the Tweed,
        scheduled around your trading."
    - type: paragraph
      text: "It is not the nightly close-down, and confusing the two is how kitchen
        quotes end up impossible to compare. Your brigade cleans as they go and
        closes down the line every night, because food contact surfaces and
        equipment are part of running a kitchen and cannot wait for a
        contractor. What a contractor is for is the work that needs the kitchen
        cold, the equipment pulled out and four uninterrupted hours: the parts
        that get worse every week until someone books them."
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
canopy:
  heading: A canopy clean and a canopy certificate are not the same purchase.
  body:
    - Cleaning a kitchen exhaust system properly means the filters, the hood,
      the plenum and the ductwork all the way to the fan, done to the
      maintenance requirements in AS/NZS 1668.1, and it finishes with a report
      and a certificate you keep. That document is the point. Your insurer or
      your landlord will ask for it after a grease fire, and a kitchen that
      cannot produce one is in a much worse position than a kitchen that can.
    - "Plenty of cleaners will degrease the visible underside of your canopy and
      call it a canopy clean. It is not dishonest work, it is just not the thing
      that protects you, and it leaves the grease that actually matters sitting
      in the duct above the ceiling. So ask any quote one question: does this
      come with a certificate. If the answer is no, you still need the certified
      clean on top of it, and you should know that before you pay for either."
