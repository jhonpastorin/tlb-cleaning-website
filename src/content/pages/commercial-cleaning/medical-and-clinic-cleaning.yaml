brandedFaq:
  heading: Working with us on your premises
  items:
    - question: Can you clean between close and open?
      answer: Yes, and it is the only way this work makes sense. We clean in the
        evening after your last appointment or early enough in the morning that
        everything is dry before your first. Both windows attract penalty rates
        under the Cleaning Services Award and both appear on the quote with
        their own price, so you can see what the timing costs.
    - question: Will you follow our infection control policy?
      answer: Yes. Where your policy specifies a product, a method or a frequency,
        yours wins over our standard scope and we write it in. If your policy
        needs a particular disinfectant used a particular way, tell us at the
        walkthrough and it goes on the scope rather than into someone’s memory.
    - question: Do you clean treatment beds and clinical equipment?
      answer: We clean and disinfect treatment bed and chair upholstery, plinths,
        bolsters and the frames they sit on, because those are environmental
        surfaces. We do not clean clinical equipment, instruments, autoclaves or
        anything that touches a patient in a procedure. That is clinical staff
        work under your own procedures, and it stays there.
    - question: What about hair, colour and wax in a salon?
      answer: It is why a salon needs its own scope rather than an office one. Hair
        travels further than anyone expects and collects behind and under
        everything, so floors get swept before they are mopped and the edges get
        done rather than the middle. Colour is treated as a stain on the day,
        not next week. Basins and traps are cleaned, and wax residue comes off
        with the right solvent rather than a scourer.
    - question: Are your cleaners police-checked?
      answer: Yes. Our cleaners are employed by TLB rather than subcontracted, so there
        is no third party between you and the person who attends.
    - question: What happens if I get in touch?
      answer: We walk the premises after hours with you, room by room, and ask what
        your own procedures require. Then you get a written scope naming each
        room and its surfaces, a price per visit and an after hours option shown
        separately. No obligation, and nothing to sign on the night.
faq:
  heading: Medical office cleaning services, common questions
  items:
    - question: How much does medical or clinic cleaning cost?
      answer: It depends on how many consulting or treatment rooms there are, how many
        bathrooms, how much of the floor is vinyl versus carpet, and whether the
        visit has to happen inside a narrow window between close and open. A
        three-room clinic and a ten-room practice are different jobs. That's why
        we quote rather than publish a flat rate that would be wrong for most
        practices. Tell us the basics and you'll have a price back quickly, with
        no obligation attached to it.
    - question: What is the difference between cleaning and disinfecting?
      answer: "Cleaning physically removes soil, and disinfecting kills what is left.
        The order matters and it is where most cleaning goes wrong: spraying
        disinfectant onto a surface that still has organic soil on it largely
        wastes the disinfectant, because soil inactivates it. Surfaces get
        cleaned first, then disinfected, and the disinfectant is left wet for
        its stated contact time rather than wiped straight off."
    - question: Who is responsible for clinical waste in a practice?
      answer: The practice is. Clinical and related waste has to be segregated at the
        point it is generated, by the clinical staff who generate it, into the
        correct containers, and then collected and disposed of by a licensed
        waste contractor. A general cleaning contractor handles general waste
        and recycling only. Anyone offering to take your sharps away as part of
        a cleaning contract is not licensed to.
    - question: How often should a clinic be cleaned?
      answer: Daily at minimum for any premises seeing patients or clients, with
        high-touch surfaces, bathrooms and floors done every visit. Treatment
        surfaces are cleaned between patients by clinical staff, which is
        separate from the daily environmental clean. Carpet extraction,
        upholstery, vents and high dusting are periodic. A busy salon usually
        needs daily as well, driven by hair and product rather than by infection
        risk.
    - question: Do salons have cleaning regulations in NSW?
      answer: Some do. Premises offering skin penetration treatments, meaning
        tattooing, piercing and certain beauty procedures that break the skin,
        are regulated under NSW public health legislation and can be inspected
        by the local council, with requirements covering cleanliness,
        sterilisation and waste. A hairdressing-only salon has no equivalent
        scheme but still has work health and safety duties. Check with your
        council rather than assuming which category you are in.
    - question: Should a cleaner have their own insurance to work in a clinic?
      answer: Yes, and you should sight the certificate and its expiry date rather
        than take the word for it. Public liability cover is what protects your
        practice if a contractor damages equipment or a patient is injured
        because of their work, and workers compensation covers the cleaner
        themselves. Ask for both, and ask whether the people attending are
        employees of the company or subcontractors, because that changes who is
        actually covered.
