seo:
  title: Post Construction Cleaning Services | TLB Cleaning
  description: "Post construction, builders and post-renovation cleaning, from
    rough clean to handover detail: dust, render, stickers and glass. Book your
    clean."
ctaLabel: Book your clean
hero:
  kicker: Builders clean and construction site cleaning
  headingLines:
    - Post construction cleaning services, booked to your handover date
  lead: The last trade on site is the one they remember. Post construction
    cleaning services for new builds, renovations and fitouts across the
    Northern Rivers and the Tweed. Builders cleans and final detail cleans,
    booked to your handover date, not to ours. {{line.fast}}
  image:
    src: /src/assets/commercial_cleaning/premises/construction-cleaner-sweeping-a-new-build-before-handover.jpg
    alt: A cleaner in a high-visibility vest sweeping fine dust from the concrete
      floor of a newly finished, unfurnished interior
definition:
  body:
    - type: paragraph
      text: "A builders clean is the cleaning of a construction site as the work
        finishes: removing dust, debris, adhesive, plaster and stickers so the
        building can be inspected, handed over and lived in. TLB Cleaning does
        builders cleans and final detail cleans across the Northern Rivers and
        the Tweed, for new builds, renovations, fitouts and unit developments."
    - type: paragraph
      text: It is really three jobs at three different moments, and quotes get
        compared wrongly because people mean different ones by the same phrase.
        A progress clean keeps a working site safe and passable. A builders
        clean happens once the trades are out and takes the building from
        construction-dirty to visibly clean. A final detail clean is the pass
        after that, where a building goes from clean to handover ready. Which
        ones you need changes the price enormously, so it is the first thing
        worth settling.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
silica:
  heading: Dry sweeping construction dust is not cleaning. It is exposure.
  body:
    - The dust on a new build is not house dust. Cutting, grinding and even
      sweeping concrete, brick, tile, render and engineered stone puts
      respirable crystalline silica into the air, and it is fine enough to stay
      there for hours and small enough to reach the deepest part of the lung. It
      causes silicosis, and silicosis does not get better. Engineered stone
      benchtops were banned outright in Australia from 1 July 2024 because of
      it.
    - "So a cleaner who turns up to a builders clean with a broom and a domestic
      vacuum is not saving you anything, they are generating an exposure on your
      site and putting it in your incident history rather than theirs. The
      controls are not exotic: wet methods where the surface allows, an H-class
      vacuum with the right filtration rather than a shop vac, and respiratory
      protection worn properly. Ask any cleaner quoting your site which of those
      three they are bringing."
stages:
  heading: Three cleans, in this order
  lead: Most quotes get compared wrongly because two people mean different stages
    by the same phrase. Settle which of these you want first.
  items:
    - image:
        src: /src/assets/commercial_cleaning/premises/construction-cleaner-sweeping-a-new-build-before-handover.jpg
        alt: A cleaner in a high-visibility vest sweeping fine dust from the concrete
          floor of a newly finished, unfurnished interior
      title: "Stage one: progress clean, while the trades are still in"
      description: Offcuts, packaging and general debris cleared so the site stays
        passable and nobody trips over the last trade’s mess. Floors kept clear
        for the trades who need a clean substrate. Amenities and the site office
        cleaned, which is the part everyone skips and everyone complains about.
        Waste removal from site is [included / quoted separately, and requires a
        tip fee. Confirm].
    - image:
        src: /src/assets/commercial_cleaning/premises/construction-cleaner-detailing-new-window-frames.jpg
        alt: A cleaner in a high-visibility vest detailing plaster dust off a new
          aluminium window frame in an unfurnished new build
      title: "Stage two: the builders clean, once the trades are out"
      description: The heavy pass. Plaster dust off every horizontal surface including
        the tops of doors, architraves and skirtings. Paint spots, adhesive,
        silicone smears and stickers off glass, tiles and tapware. Window frames
        and tracks vacuumed out. Cupboards and drawers cleaned inside. Floors
        vacuumed then washed, not swept. Done with [an H-class vacuum. Confirm
        TLB owns one] rather than a broom, for the reason in the block above.
    - image:
        src: /src/assets/commercial_cleaning/premises/construction-final-detail-clean-of-a-new-bathroom.jpg
        alt: A cleaner in a high-visibility vest polishing the brushed-metal tapware of
          a brand new bathroom during a final detail clean
      title: "Stage three: the final detail clean, before handover"
      description: The pass that decides how the building feels on the day. Glass and
        mirrors polished streak free, tapware and stainless finished, appliance
        protective film removed, splashbacks and grout lines detailed, light
        fittings and switch plates wiped, and the dust that settled out of the
        air overnight taken off again. Timed to the morning of handover where
        the program allows, because dust keeps landing.
detailPhoto:
  image:
    src: /src/assets/commercial_cleaning/premises/construction-final-detail-clean-of-a-new-bathroom.jpg
    alt: A brand new bathroom during the final detail clean, tapware polished and
      the glass screen finished
  caption: The final detail clean. This is the pass that decides what the defect
    list looks like.
priceDrivers:
  heading: What actually decides the price
  lead: Four variables, none of which is floor area on its own.
  items:
    - type: feature
      icon: chart-pie
      heading: Which stages you actually want
      body:
        - One builders clean and one detail clean is the normal pair. A quote
          for one, compared against a quote for both, looks like one cleaner is
          half the price of the other. Settle the stages before you compare
          anything.
    - type: feature
      icon: idea
      heading: How much glass there is
      body:
        - Glass is the slowest surface on a new build and the one a handover is
          judged on. A house with a wall of stacker doors takes hours longer
          than the same floor area in solid wall, and adhesive residue on new
          glass takes longer again.
    - type: feature
      icon: target
      heading: What the trades left behind
      body:
        - A site handed over swept and free of rubbish costs less to clean than
          one with offcuts in every room. Paint overspray, silicone smears and
          render splatter on tile are the three that turn a day into two.
    - type: feature
      icon: key
      heading: Whether the date can move
      body:
        - A builders clean booked to a fixed handover date, on a weekend, at
          short notice, is a different price from one with a week of float
          either side. Penalty rates under the Cleaning Services Award are real
          and they appear on the quote rather than in the fine print.
worthKnowing:
  heading: Cleaning items on a defect list are still your problem
  body:
    - type: paragraph
      text: "The reason a builders clean is worth doing properly has nothing to do
        with how it looks and everything to do with the defect list. At handover
        somebody walks the building specifically looking for things to write
        down. Dust in a window track, adhesive on a shower screen, plaster on
        the top of a door, a sticker still on an appliance: none of those are
        building defects, but they all get written up as ones, and then a
        supervisor spends a fortnight closing items that a cleaner should have
        closed in an afternoon."
    - type: paragraph
      text: The other reason is that dust keeps arriving. A building that has been
        sealed for a week still has fine dust settling out of the air, off the
        ceiling and out of the ducts. That is why the final detail clean is a
        separate stage rather than the same clean done more carefully, and why
        timing it close to handover is worth more than doing it thoroughly a
        fortnight early. We book to your program and we will tell you honestly
        if the date you have picked is the wrong one.
