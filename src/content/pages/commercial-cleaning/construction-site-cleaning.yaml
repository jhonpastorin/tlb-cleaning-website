brandedFaq:
  heading: Working with us on your build
  items:
    - question: Are your cleaners inducted to work on site?
      answer: Any cleaner attending a construction site needs a general construction
        induction card, the white card, plus your own site induction, and they
        need to sign in and out like every other trade. [Whether TLB holds a
        current white card for every cleaner who would attend, and whether TLB
        can provide a SWMS for the work. Confirm before this page ships.] Ask us
        for the cards and the SWMS before we come on site, not after.
    - question: Can you work to our handover date?
      answer: "Yes, and that is usually the whole brief. Tell us the handover date and
        we work backwards: the builders clean once the trades are genuinely out,
        then the final detail clean as close to the morning of handover as your
        program allows. If the date moves, tell us as early as you can and we
        will move with it where we have the capacity."
    - question: Do you take the rubbish away?
      answer: Debris and packaging get cleared and bagged as part of the clean. Taking
        it off site is [included / a separate line with a tip fee. Confirm],
        because it needs a vehicle and a disposal cost rather than just labour.
        Bins on site cost everyone less, so if there is still a skip when we
        arrive, say so.
    - question: What about the windows?
      answer: Internal glass, frames and tracks are part of a builders clean, and we
        detail adhesive, paint and render off glass rather than scraping at it.
        External glass at ground level is included. Anything above ground level
        needs its own plan and pricing, and depending on the building that means
        a different licence and equipment than a cleaning team carries. We will
        tell you which it is at the walkthrough rather than after.
    - question: Do you do renovations, not just new builds?
      answer: Yes, and it is a different job. A renovation is dirtier per square metre
        than a new build because the dust travels into a house that is already
        furnished and lived in, so the clean extends past the work area into the
        rooms nobody touched. If you are moving back into your own renovated
        house, that is the version of this we do most.
    - question: What happens if I get in touch?
      answer: We walk the site, work out which stages you actually need, and tell you
        which ones you do not. Then you get a written scope per stage with a
        price against each and the date each one would happen. No obligation. If
        the program is not settled yet, we will hold an indicative date rather
        than pretend it is booked.
faq:
  heading: Post construction cleaning services, common questions
  items:
    - question: How much does a builders clean cost?
      answer: It is priced per job rather than per hour, against a written scope, and
        the number moves with which stages you need, how much glass there is,
        how much the trades left behind and whether the date is fixed. Floor
        area on its own is a poor predictor, which is why a phone quote for a
        builders clean is usually wrong. [TLB’s pricing basis. Confirm.]
    - question: What is included in a builders clean?
      answer: There is no standard definition, which is exactly why it should be
        written down. A normal scope covers dust removal from all surfaces
        including the tops of doors and architraves, adhesive stickers silicone
        and paint spots off glass tiles and tapware, window frames and tracks
        vacuumed, cupboards cleaned inside, and floors vacuumed then washed. If
        a quote just says "builders clean", ask for that list.
    - question: What is the difference between a builders clean and a final clean?
      answer: The builders clean is the heavy pass that takes a building from
        construction-dirty to clean, done once the trades are out. The final
        clean, or detail clean, is the pass after it that takes the building
        from clean to handover ready, and it exists because fine dust keeps
        settling for days. Doing only the first leaves dust on every sill on
        handover morning. Doing only the second costs more, because the second
        pass is not designed to shift plaster.
    - question: Do construction cleaners need a white card?
      answer: Yes. Anyone carrying out construction work on a site in New South Wales
        needs a general construction induction card, commonly called a white
        card, and they also need the site-specific induction for that particular
        site. It is the principal contractor who carries the duty to make sure
        everyone on site is inducted, so a cleaner without one is the builder’s
        problem as much as the cleaner’s.
    - question: Why is construction dust dangerous?
      answer: Because of what is in it. Concrete, brick, tile, render and engineered
        stone contain crystalline silica, and cutting, grinding or dry sweeping
        them produces respirable particles fine enough to reach deep into the
        lung and cause silicosis, which is irreversible. Dry sweeping is one of
        the worst methods because it re-suspends dust that had already settled.
        Wet methods, H-class vacuum extraction and properly fitted respiratory
        protection are the controls that actually work.
    - question: When should the builders clean be booked?
      answer: Once the trades are genuinely finished, not when they are nearly
        finished. A builders clean done while one trade is still cutting is
        money spent twice, and it is the single most common scheduling mistake
        on a build. Book the heavy pass for after the last trade leaves, and the
        detail clean as close to handover as the program allows.
