scope:
  heading: What our commercial carpet cleaning services involve, stage by stage
  lead: Six stages, in this order. Skip the first two and the rest is just wet
    carpet.
  items:
    - icon: target
      title: We inspect and test first
      description: We check the fibre, the backing and how the carpet is laid, then
        test in an out of sight corner. Wool, nylon and solution dyed carpet do
        not take the same treatment, and getting that wrong is how carpet gets
        ruined.
    - icon: spray-bottle
      title: Pre-vacuum, then pre-spray
      description: Dry soil comes out with a commercial vacuum before any water
        touches the pile, because wet grit turns into mud. Then a pre-spray goes
        down and is given time to break down the oils holding the soil in place.
    - icon: spark
      title: Traffic lanes and stains by hand
      description: Doorways, corridors and the run past the printer wear faster than
        the rest of the floor. Those lanes are agitated separately, and
        individual stains are treated by type rather than with one product for
        everything.
    - icon: chart-bars
      title: Hot water extraction
      description: Heated water and solution go into the pile under pressure and come
        straight back out with the soil. This is the method carpet manufacturers
        name in their own maintenance requirements, and the one that removes
        soil rather than hiding it.
    - icon: bloom
      title: Encapsulation when drying time is tight
      description: For a floor that has to be walked on in a few hours, encapsulation
        crystallises the soil so it vacuums out the next day. It is a low
        moisture method, lighter than extraction and much faster to dry, which
        is the right call for a corridor that never closes.
    - icon: office
      title: Groomed, dried and put back
      description: The pile is groomed so it dries evenly, air movers go down where
        the floor has to be back in service quickly, and furniture goes back
        where it was. Typical drying time is [X to Y hours. Confirm].
worthKnowing:
  heading: What a low carpet quote usually leaves out
  body:
    - type: paragraph
      text: "A bad carpet clean and a good one look the same on the day. The
        difference turns up three weeks later. Over-wetting leaves moisture in
        the backing, which is how you get an odour that will not shift and, in a
        humid Northern Rivers summer, mould under a floor that looks fine from
        above. Too much detergent left in the pile is worse in its own way: it
        stays tacky, so the carpet re-soils faster than before it was cleaned
        and the traffic lanes come back darker than they started."
    - type: paragraph
      text: The other thing worth knowing is that most commercial carpet is still
        under a manufacturer warranty, and most of those warranties require
        periodic hot water extraction by a professional. A bonnet clean can
        technically void one. So ask any cleaner which method they use, what
        they do about drying, and whether their work meets your carpet maker’s
        maintenance requirements. We put the method and the price in writing
        before we start, and we tell you straight when a mark is not coming out.
offices:
  heading: Office carpet cleaning services, worked around a locked building
  body:
    - type: paragraph
      text: "An office wears differently to a venue or a clinic. It goes in three
        places: the run from the lift to reception, the strip past the printer
        and the half metre of carpet under every chair. Those lanes get agitated
        by hand before the extraction wand goes near them, because that is where
        the grey comes from."
    - type: paragraph
      text: The other difference is access. Most offices are locked, alarmed and full
        of equipment nobody wants moved. We settle the access at the
        walkthrough, and the keys and alarm codes stay with the same small team
        every visit rather than with whoever is rostered. Desks with computers
        on them stay where they are and we clean around them.
    - type: paragraph
      text: Workstations, meeting rooms, boardrooms and reception get done in the one
        visit, so you are not letting us back in three times. Most offices land
        on two extraction cleans a year. A busy reception floor usually wants
        more than that, and a quiet upstairs office usually wants less.
