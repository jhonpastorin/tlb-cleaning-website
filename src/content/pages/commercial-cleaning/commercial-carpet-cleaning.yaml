definition:
  body:
    - type: paragraph
      text: Commercial carpet cleaning services cover the deep cleaning of carpet in a
        workplace, usually by hot water extraction, done outside trading hours
        so the floor is dry before your team or your customers arrive. It lifts
        the grit, oils and traffic marks that vacuuming alone leaves behind. TLB
        Cleaning cleans commercial carpet across the Northern Rivers and the
        Tweed.
    - type: paragraph
      text: Carpet steam cleaning and hot water extraction are the same job under two
        names. The machine heats water, injects it into the pile under pressure
        and vacuums it straight back out with the soil in it. Nothing is steamed
        in the literal sense, so a cleaner who leans hard on the word is selling
        the word rather than the method.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
