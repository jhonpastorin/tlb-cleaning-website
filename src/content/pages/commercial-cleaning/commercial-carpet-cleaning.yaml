brandedFaq:
  heading: Booking a commercial carpet clean
  items:
    - question: Can you do it after we close?
      answer: Yes, and most carpet work is done that way. We clean in the evening or
        across a weekend so the floor has the night to dry and your team walks
        in on a finished job. After hours work is priced differently, because
        weekends and late shifts attract penalty rates under the Cleaning
        Services Award 2020. Both options go on the quote so you can see what
        each one costs.
    - question: Do we have to move all the furniture out?
      answer: No. We move what two people can safely move, clean underneath and put it
        back where it was. Desks with computers on them, heavy filing and
        anything fixed stay put and we clean around them. If you want the floor
        done wall to wall, say so at the walkthrough and we will plan the visit
        around a clear room.
    - question: Will the stains actually come out?
      answer: Most will. Coffee, food, mud and general traffic soil usually lift
        completely. Dye based spills, bleach marks, rust and anything heat set
        into the fibre often will not, and an old stain that has been scrubbed
        before is the hardest of all. We tell you which is which at the
        walkthrough rather than after we have taken your money.
    - question: How often should we be doing this?
      answer: Most workplaces land on two extraction cleans a year with spot treatment
        in between as things happen. A busy reception, a clinic or a venue often
        needs quarterly. A quiet upstairs office can stretch to annually. It
        comes down to foot traffic rather than floor area, and a walkthrough
        settles it quickly.
    - question: What happens if I get in touch?
      answer: We come and look at the carpet, test the fibre and tell you what will
        lift and what will not. Then you get a written scope and a price, with
        the after hours option shown separately. No obligation. If it suits, we
        book a night that works around your trading.
faq:
  heading: Commercial carpet cleaning questions
  items:
    - question: How long does commercial carpet take to dry?
      answer: "A properly extracted carpet is usually walkable within a few hours and
        fully dry inside the day, which is why the work is done overnight.
        Drying comes down to three things: how much water went in, how much air
        is moving across the floor, and the humidity. Air movers cut it
        substantially. A carpet still damp the next morning was over-wet, not
        thoroughly cleaned."
    - question: What is the difference between hot water extraction and encapsulation?
      answer: Hot water extraction injects heated water and solution into the pile
        under pressure and vacuums it back out with the soil. It removes the
        most and takes the longest to dry. Encapsulation uses a polymer that
        crystallises around the soil so it can be vacuumed out the next day. It
        is faster and drier but lighter, so it suits interim maintenance between
        extraction cleans rather than replacing them.
    - question: Does carpet cleaning damage the carpet?
      answer: "Done properly, no. Done badly, yes. Carpet gets damaged two ways:
        over-wetting, which leaves moisture in the backing and can cause odour,
        delamination or mould, and using the wrong chemistry for the fibre,
        which is how wool ends up bleached or browned. That is why a competent
        cleaner tests the fibre in a hidden spot before starting instead of
        treating every floor the same."
    - question: Can carpet cleaning void a warranty?
      answer: It can. Many carpet manufacturers set maintenance requirements inside
        the warranty, and most of those specify periodic hot water extraction by
        a professional. Some exclude bonnet cleaning outright. If your building
        still has its carpet warranty, check what the maker requires before you
        accept a quote, and ask the cleaner in writing whether their method
        meets it.
    - question: How much does commercial carpet cleaning cost?
      answer: Commercial carpet is usually priced per square metre, with a minimum
        charge for small jobs, and the rate moves with the condition of the
        floor, how much furniture there is to work around and whether the work
        is after hours. Ask for the price against a written scope rather than an
        hourly rate, so you can see what is actually included. [TLB’s pricing
        basis and minimum charge. Confirm.]
