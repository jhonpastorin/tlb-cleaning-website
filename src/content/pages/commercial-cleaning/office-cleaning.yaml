scope:
  heading: What goes on the scope
  lead: Grouped by how often it happens, not by which room it is in. That is the
    difference two quotes are actually hiding.
  items:
    - icon: office
      title: "Every visit: the floors"
      description: Vacuum all carpet including under and around desks, mop hard
        floors, and spot clean marks on entry matting. Traffic lanes and the run
        from the lift get the attention they actually need rather than one pass
        with everything else.
    - icon: spray-bottle
      title: "Every visit: the touch points"
      description: Door handles, light switches, lift buttons, rails, shared desk
        edges and the fridge and microwave handles. These take five minutes and
        they are the first thing to disappear from a thin scope, because nobody
        notices them being skipped.
    - icon: target
      title: "Every visit: kitchenette and bathrooms"
      description: Benches and sink wiped down, dishwasher emptied if it has finished,
        bins emptied and relined, toilets and basins cleaned and disinfected,
        mirrors done, floors mopped. Bathrooms are the part of an office a
        visitor judges you on.
    - icon: spark
      title: "Every visit: desks, on your terms"
      description: We wipe clear desk surfaces and leave anything with paper, a
        keyboard or a coffee cup on it alone unless you tell us otherwise. Some
        offices want a clear-desk rule and full wipe-down. Both are fine. What
        matters is that it is written down, not assumed.
    - icon: chart-bars
      title: "Periodically: the things you forget"
      description: Internal glass and partitions, skirtings, air vents, window sills,
        high dusting, fridge interiors and the top of the kitchen cupboards.
        These go on the scope with a frequency against each one, so they happen
        on a date rather than when someone complains.
    - icon: puzzle
      title: Not included, and said out loud
      description: Carpet extraction, external windows above ground level and pressure
        cleaning are separate services rather than part of a nightly scope, and
        we quote them separately. Consumables are [supplied by us / supplied by
        you. Confirm]. We do not handle clinical or hazardous waste.
callout:
  heading: An hourly rate tells you nothing.
  body:
    - Two quotes at the same hourly rate are not the same offer, because the
      number of hours is the variable and it is the one nobody writes down. A
      cleaner who is in your office for 45 minutes and one who is there for two
      hours can quote the same rate and deliver completely different cleans.
    - Ask for a price per visit against a written scope instead. Then you are
      comparing what gets done, which is the thing you actually care about, and
      the cleaner carries the risk of it taking longer than they thought rather
      than you.
worthKnowing:
  heading: What sits behind the number on an office quote
  body:
    - type: paragraph
      text: An office quote can come in well under the others for one of three
        reasons, and none of them is efficiency. Either the scope is thinner
        than the one you asked for, or the hours are shorter than the work
        takes, or the person doing it is not being paid the Cleaning Services
        Award. The first two you find out about in a month. The third one is the
        one that can land on you.
    - type: paragraph
      text: Cleaning is one of the most commonly underpaid trades in the country,
        which is why it is worth asking any quote how the number is built. If
        the cleaner in your office is not a legitimate employee, your business
        is exposed to that in ways an office manager should not have to think
        about. Our cleaners are employed by TLB, paid to the Award, and covered
        by our insurance. That is what the price reflects.
