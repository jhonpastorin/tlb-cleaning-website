definition:
  body:
    - type: paragraph
      text: Office cleaning is the regular cleaning of a workplace, usually outside
        trading hours, covering desks and shared surfaces, kitchenettes,
        bathrooms, floors and internal glass on a fixed schedule. TLB Cleaning
        cleans offices across the Northern Rivers and the Tweed, from
        three-person studios to whole floors.
    - type: paragraph
      text: An office clean and a commercial clean are the same trade under two names,
        and an office is simply the most common kind of commercial premises.
        What makes it its own job is that people work in the room you are
        cleaning. Their keyboards, their mugs, their paperwork and their bins
        are personal, which is why the useful question to ask a cleaner is not
        what they charge but exactly what they touch.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
