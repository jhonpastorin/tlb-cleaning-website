brandedFaq:
  heading: Booking an office clean
  items:
    - question: Can you clean after we close?
      answer: Yes, and most office work is done that way. We clean in the evening or
        early morning so your team walks in on a finished floor and nobody works
        around a vacuum. After hours and weekend work attracts penalty rates
        under the Cleaning Services Award, so both options go on the quote with
        their own price and you choose.
    - question: Will it be the same cleaner every week?
      answer: Yes. You get the same person on the same day, and you meet them before
        you sign anything. When they take leave you get someone from the same
        small team who has already been briefed on your scope, not a stranger
        from an agency. That continuity is most of the reason our office clients
        stay.
    - question: Do we need a lock-in contract?
      answer: No. Our office work runs on an ongoing schedule with no lock-in term,
        and you can change frequency or cancel with reasonable notice. A cleaner
        who needs to trap you in a two-year term is telling you something about
        how they expect the service to go.
    - question: What if something gets missed?
      answer: You ring or message the local number and we fix it on the next visit, or
        sooner if it matters. Because you have a written scope, "missed" is a
        fact rather than an opinion, which is what makes that conversation
        short. We would rather hear about it in week one than lose the contract
        in month six.
    - question: Do you bring your own equipment and products?
      answer: Yes. Vacuums, mops, cloths and cleaning products all come with us, and
        we do not use your kitchen sponge on the bathroom. Consumables such as
        hand towel, toilet paper and bin liners are [supplied by us / supplied
        by you. Confirm], and whichever it is goes on the scope so it is never a
        surprise.
    - question: What happens if I get in touch?
      answer: We walk your office with you, usually for twenty minutes, and ask what
        has been going wrong. Then you get a written scope and a price per
        visit, with an after hours option shown separately. No obligation. If it
        suits, we book a start date and you meet your cleaner before they start.
faq:
  heading: Office cleaning services, common questions
  items:
    - question: How much does office cleaning cost?
      answer: Office cleaning is normally priced per visit rather than per hour, and
        the price moves with floor area, how many bathrooms and kitchenettes
        there are, how often you want it done and whether the work is after
        hours. Ask every quote for a price per visit against a written scope so
        you are comparing the same job. [TLB’s pricing basis and any minimum
        charge. Confirm.]
    - question: How often should an office be cleaned?
      answer: "It comes down to headcount and whether there are client-facing rooms,
        not floor area. A small office with a handful of desks and one bathroom
        usually works on two or three visits a week. Anything with a reception,
        a shared kitchen used daily or twenty-plus people generally needs daily.
        Bathrooms are what set the floor: once they are shared by more than
        about ten people, every second day stops being enough."
    - question: What is included in a standard office clean?
      answer: "Floors vacuumed and mopped, bins emptied and relined, kitchenette
        benches and sink cleaned, bathrooms cleaned and disinfected, and shared
        touch points wiped. Anything beyond that should appear on the scope with
        a frequency against it: internal glass, high dusting, skirtings, fridge
        interiors and carpet extraction. If a quote does not name those, assume
        they are not happening."
    - question: Should an office cleaner be insured?
      answer: Yes, and you should ask to see the certificate rather than take the word
        for it. Public liability cover is what protects your business if a
        cleaner damages equipment or a third party is injured on your premises,
        and most commercial leases and building managers require it of any
        contractor working on site. Ask for the currency date too, since a
        certificate that expired last year is worth nothing.
    - question: Does it cost less to hire a cleaner directly?
      answer: "It looks like less and it usually is not, once you count what comes
        with being an employer: superannuation, leave, workers compensation,
        Award rates and penalty rates, plus equipment, products and cover when
        they are sick. A contracted cleaning business absorbs all of that and
        turns up regardless. Direct hire makes sense at the point where you need
        someone on site all day, every day."
    - question: What is the difference between office cleaning and commercial cleaning?
      answer: "None, in practice. Commercial cleaning is the whole category for any
        premises that is not a home, and offices are the largest single type
        within it. The term matters only when a cleaner specialises: a clinic, a
        commercial kitchen and a warehouse each need things an office scope does
        not cover, which is why those are quoted differently."
