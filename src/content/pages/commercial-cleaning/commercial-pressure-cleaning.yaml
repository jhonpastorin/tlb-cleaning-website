definition:
  body:
    - type: paragraph
      text: Commercial pressure cleaning services cover the outdoor hard surfaces at a
        workplace, cleaned with pressurised water. Car parks, driveways, loading
        docks, footpaths, entries, bin areas, awnings, render and shopfronts. It
        removes the grime, algae, moss, oil and chewing gum that build up on any
        site the public walks across. TLB Cleaning provides commercial pressure
        cleaning across the Northern Rivers and the Tweed.
    - type: paragraph
      text: "Pressure cleaning, pressure washing and high pressure cleaning all
        describe the same work. Soft washing is the one that is genuinely
        different: low pressure and a cleaning solution instead of force, used
        on render, painted surfaces, cladding and roofs where high pressure
        would strip or gouge. A competent operator uses both and knows which
        surface takes which."
  backgroundImage: /src/assets/commercial_cleaning/pressure/clean-commercial-forecourt-and-entry.jpg
