brandedFaq:
  heading: Booking a commercial pressure clean
  items:
    - question: Do we have to close while you do it?
      answer: Almost never. We work early, late or on your quietest day, and we do the
        site in sections so there is always a dry way in. Cones and signage go
        up around whatever is wet. For a car park we usually take it a bay run
        at a time so you never lose the whole thing at once.
    - question: Will it damage our concrete, pavers or render?
      answer: Not if the pressure is matched to the surface, which is the first thing
        we work out at the walkthrough. Render, paint, cladding and roofing get
        a soft wash rather than high pressure, because force strips them. Old or
        already crumbling surfaces get flagged before we start rather than
        after.
    - question: Can you get the oil stains out of our car park?
      answer: Usually a good way, sometimes not completely. Fresh oil and grease
        respond well to a degreaser with dwell time and the right heat. Oil that
        has been sitting in porous concrete for years has soaked into the slab,
        and no amount of pressure pulls it back out. We tell you which one you
        have before we quote.
    - question: What do you need from us on the day?
      answer: Vehicles moved off the area being cleaned, and access to the site at the
        agreed time. The plant, the chemicals and the signage come with us.
    - question: What happens if I get in touch?
      answer: We come and walk the site, look at the surfaces and tell you what will
        clean up and what will not. Then you get a written scope and a price,
        with the after hours option shown separately. No obligation. If it
        suits, we book a time that works around your trading.
faq:
  heading: Commercial pressure cleaning questions
  items:
    - question: How often should a commercial site be pressure cleaned?
      answer: Most sites settle on twice a year, with high traffic entries, bin bays
        and food areas done quarterly. In the Northern Rivers the shaded
        southern side of a building grows algae far faster than the sunny side,
        so it is common for one elevation to need doing twice as often as the
        rest. Surfaces kept on a schedule cost less each visit, because there is
        less built up to remove.
    - question: What is the difference between pressure cleaning and soft washing?
      answer: Pressure cleaning uses force to remove what is sitting on a hard
        surface, and suits concrete, pavers, brick and steel. Soft washing uses
        low pressure and a cleaning solution, and suits render, paint, cladding,
        signage and roofs, where high pressure would strip the finish or force
        water behind it. Soft washing also treats the algae and mould at the
        root, so the surface stays clean longer.
    - question: Can pressure cleaning damage concrete?
      answer: Yes. Concrete looks tough but it etches. Holding the wand too close, or
        too long in one spot, cuts a visible line into the surface that does not
        fade, and a rotary surface cleaner is used on large flat areas partly to
        avoid exactly that. Old concrete, decorative finishes, sandstone and
        aged pavers are the ones to be careful with, and any of them should be
        tested in a corner first.
    - question: Where is the water allowed to go?
      answer: "Clean rinse water off a footpath can usually go where rain would. Water
        carrying oil, grease, detergent, paint or food waste cannot: in NSW,
        letting polluting matter enter a stormwater drain is an offence under
        the Protection of the Environment Operations Act 1997, and stormwater
        runs to the creek untreated. That run-off has to be captured and
        disposed of to sewer or to a licensed facility, and discharge to sewer
        needs your water authority or council to agree the conditions. Ask any
        cleaner how they handle it."
    - question: How much does commercial pressure cleaning cost?
      answer: It depends on the surface, how badly stained it is, access to water and
        power, whether the work is after hours and whether the wash water has to
        be captured. That's why we quote rather than publish a flat rate that
        would be wrong for most sites. Tell us the basics and you'll have a
        price back quickly, with no obligation attached to it.
