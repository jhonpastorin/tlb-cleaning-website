scope:
  heading: What our commercial pressure cleaning services involve, stage by stage
  lead: Six stages, in this order. The last two are what you are really paying for.
  items:
    - icon: target
      title: We match the pressure to the surface
      description: Concrete, pavers, tiles, render, cladding, timber and painted steel
        all take a different setting. Too much pressure etches concrete, strips
        paint, furs timber and forces water behind cladding. Getting this wrong
        is expensive and it cannot be undone.
    - icon: puzzle
      title: We make the area safe first
      description: Cones, signage and a taped exclusion zone go up before the machine
        starts, because a wet hard surface with a hose across it is a slip and
        trip hazard on a site where the public walks. Access stays open where we
        can keep it open.
    - icon: spray-bottle
      title: Pre-treat, then clean
      description: Oil, grease and organic growth get a treatment with dwell time
        before any water goes near them, and grease needs hot water or a
        degreaser to release at all. Blasting a stain cold just moves it around
        and drives it deeper into the concrete.
    - icon: chart-bars
      title: Surface cleaner on flat ground, wand on the edges
      description: Large flat areas are done with a rotary surface cleaner, which
        cleans evenly and leaves no stripes. Edges, kerbs, steps and corners are
        finished by hand with the wand. Stripes across a car park are the
        signature of a job done entirely with a wand.
    - icon: bloom
      title: Soft wash for render, paint and roofs
      description: Render, painted surfaces, cladding, signage and roofing get low
        pressure and a cleaning solution instead of force. It kills the algae
        and mould at the root rather than just knocking the surface off it,
        which is why a soft washed wall stays clean longer.
    - icon: idea
      title: Wash water managed, not just hosed away
      description: Water carrying oil, grease, detergent or food waste must not go
        down a stormwater drain.
worthKnowing:
  heading: Two things to ask before you let anyone start
  body:
    - type: paragraph
      text: Pressure cleaning is the one trade where an inexperienced operator can do
        permanent damage in about four seconds. Too much pressure held too long
        etches concrete into a visible stripe, cuts the sand out from between
        pavers, strips paint off steel, furs up timber decking and drives water
        in behind cladding, where it goes on causing damage after the machine
        has gone. None of that shows in a quote. It shows on your building, and
        it does not wash off.
    - type: paragraph
      text: The second thing worth knowing is that the water has to go somewhere.
        Run-off carrying oil, grease, detergent or food waste must not enter a
        stormwater drain, because stormwater goes straight to the creek and then
        the ocean without treatment, and the site occupier can be the one held
        responsible. So ask any cleaner what they do about wash water before you
        let them start, especially around a car park, a loading dock or a bin
        bay. It is a fair question and a competent operator will have a straight
        answer.
industrial:
  heading: Industrial high pressure cleaning for warehouses, factories and yards
  body:
    - type: paragraph
      text: An industrial site is a different job to a shopfront. The soil is oil,
        grease, rubber and hydraulic fluid rather than algae and coffee, the
        areas are measured in thousands of square metres, and the surface is
        usually a concrete hardstand that has been driven on for years.
    - type: paragraph
      text: Forklift tyre marks, loading dock aprons, bin bays, wash bays and the yard
        all come up differently. Grease needs heat and dwell time before any
        water goes near it. Long flat runs go to the rotary surface cleaner so
        the finish is even, and the edges and bunding are finished by hand. Old
        hardstand gets tested in a corner first, because a slab that has already
        lost its surface can be opened up by too much pressure.
    - type: paragraph
      text: The wash water matters more on an industrial site than anywhere else.
        Run-off from a loading dock or a wash bay carries oil, grease and
        detergent, and none of that can go to stormwater. We plan for it before
        the machine starts rather than after.
    - type: paragraph
      text: Most sites run to a shift pattern rather than trading hours, so we work to
        the quiet window rather than assuming a weekend.
