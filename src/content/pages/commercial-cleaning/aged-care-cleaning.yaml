brandedFaq:
  heading: Working with us on your site
  items:
    - question: Do you take single units, or only whole sites?
      answer: We quote whole sites and we also do independent living unit turnovers
        between residents, which is closer to an end of lease clean than to a
        regular visit. [Whether TLB takes individual occupied units inside a
        village, and whether that is billed to the village or the resident.
        Confirm.] If a resident wants their own unit cleaned privately, we are
        happy to arrange that separately from your contract.
    - question: Are your cleaners screened?
      answer: "Our cleaners are employed by TLB rather than subcontracted, which is
        what makes screening possible to evidence at all: there is no third
        party in between holding the paperwork. [TLB’s screening: what checks
        are held for every cleaner, how often they are renewed, and what
        evidence can be produced on request. Confirm before this page ships.]
        Ask us for it in writing at the walkthrough and hold us to producing
        it."
    - question: Can you work around care routines and meal times?
      answer: Yes, and the schedule is built backwards from them. We take your daily
        rhythm at the walkthrough, meaning meals, medication rounds, physio,
        visiting hours and when residents nap, and place each area in the gaps.
        Dining rooms get done between sittings. Corridors get done in halves.
        Nothing noisy happens before eight or during a rest period.
    - question: What happens during an outbreak?
      answer: We follow your infection control procedures, not our own, because you
        are the ones accountable for them. In practice that usually means
        increased high-touch cleaning, separate equipment for affected areas and
        our team following the same PPE and movement rules as your staff. What
        we do not do is terminal cleans or decontamination, which need
        clinically trained staff. We will say so rather than take the work.
    - question: Will it be the same cleaners each time?
      answer: Yes, and on this page that answer matters more than on any other. You
        get the same small team, they meet your staff before they start, and
        they are briefed on your site rather than handed an address. When
        someone takes leave, their cover comes from the same team and has
        already walked the site. Residents should recognise the person cleaning
        their room.
    - question: What happens if I get in touch?
      answer: "We walk the site with you, including the areas that never make it onto
        a quote: the sluice room, the laundry, the back of the kitchen. Then you
        get a written scope grouped the way your own cleaning policy is grouped,
        a price per visit, and a schedule for the periodic work. No obligation."
faq:
  heading: Aged care cleaning services, common questions
  items:
    - question: How much does aged care cleaning cost?
      answer: It is priced per visit against a written scope. The number moves with
        how many resident rooms and bathrooms there are, how much communal and
        corridor floor, whether wet areas and laundries are included, and how
        many visits a day the dining rooms need. A village of independent living
        units and a residential care home are different jobs at different
        prices. [TLB’s pricing basis. Confirm.]
    - question: What are the cleaning requirements for aged care homes in Australia?
      answer: Approved providers are required to give residents a service environment
        that is safe, clean, well maintained and comfortable, and that
        obligation sits within the Aged Care Quality Standards. The Standards
        set the outcome rather than a task list, so each provider translates it
        into its own cleaning policy, schedule and records. Your own policy is
        the document a cleaning contractor should be quoting against. This is
        general information, not compliance advice.
    - question: How often should aged care facilities be cleaned?
      answer: High-touch surfaces and shared bathrooms are daily at minimum, and more
        often in a home with higher care needs. Dining rooms need cleaning
        between sittings rather than once a day. Resident rooms are usually
        daily for floors and bins with a fuller clean weekly. Corridors,
        handrails and communal lounges are daily. Carpet extraction, upholstery
        and high dusting are periodic, on a set month.
    - question: What is high-touch cleaning?
      answer: "It is the targeted cleaning and disinfecting of the surfaces hands
        actually land on: handrails, door handles and push plates, light
        switches, lift buttons, bed and chair rails, tap handles and shared
        appliance handles. It matters because infection moves by contact far
        more than by floor, and yet floors are what a thin scope spends its time
        on because floors are what people see."
    - question: Do aged care cleaners need police checks?
      answer: Providers are accountable for screening the people who work with
        residents, and that extends to contractors as well as their own staff.
        In practice that means a cleaning company working on an aged care site
        should be able to evidence current screening for every individual who
        attends, not just assert it at a company level. Ask for it per person
        and ask when each one was last renewed.
    - question: Can a cleaner help a resident with personal care?
      answer: No, and a cleaning company that lets it happen informally is creating a
        serious problem for the provider. Helping someone up, into a shower or
        in and out of bed is personal care, it requires training and it sits
        under the provider’s own duty of care. Our team is briefed to help by
        finding a staff member, and nothing else. It is not unkindness. It is
        the line that keeps residents safe.
