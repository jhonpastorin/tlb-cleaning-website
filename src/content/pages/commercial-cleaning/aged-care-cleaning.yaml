seo:
  title: Aged Care Cleaning Services | TLB Cleaning
  description: Cleaning for aged care and retirement facilities on a set schedule,
    by employed staff who work the same site each week. Request a proposal.
ctaLabel: Request a proposal
hero:
  kicker: Aged care and retirement living
  headingLines:
    - Aged care cleaning services that work around residents
  lead: People live here. We clean like it. Aged care cleaning services for homes,
    retirement villages and independent living units across the Northern Rivers
    and the Tweed. An employed local team, on a written scope, working around
    residents rather than through them. {{line.fast}}
  image:
    src: /src/assets/commercial_cleaning/premises/aged-care-cleaner-mopping-a-retirement-village-corridor.jpg
    alt: A cleaner mopping the vinyl floor of a bright retirement village corridor,
      leaving a clear path to walk past her
definition:
  body:
    - type: paragraph
      text: "Aged care cleaning is the cleaning of a residential aged care home,
        retirement village or independent living unit complex: resident rooms
        and units, corridors and handrails, communal lounges and dining rooms,
        common bathrooms, laundries and the administration areas. TLB Cleaning
        does this work across the Northern Rivers and the Tweed for operators,
        village managers and boards."
    - type: paragraph
      text: It is not the same job as cleaning an older person’s own house, and it is
        not a nursing service. This page is for the person who is responsible
        for a site. If you are a family member looking for someone to help your
        mum or dad at home, the next block is for you.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
wrongPage:
  heading: Looking for help for your mum or dad at home?
  body:
    - Then this is the wrong page, and we would rather tell you than keep you
      here. This one is about cleaning contracts for aged care sites and
      retirement villages, bought by the people who run them.
    - What you are after is a regular clean of a private home, usually
      fortnightly, often paid through a Home Care Package or DVA. It is a
      different service with a different price and a different conversation, and
      it is one of the kinder things we do.
  cta:
    label: Cleaning for seniors at home
    href: /house-cleaning/senior-home-cleaning/
scope:
  heading: What goes on the scope
  lead: Grouped by infection risk, the way your own cleaning policy is grouped,
    rather than room by room.
  items:
    - icon: target
      title: High-touch points, every visit
      description: Handrails the length of every corridor, door handles and push
        plates, light switches, lift buttons, bed rails and chair arms in
        communal rooms, and the shared kitchen and laundry handles. These are
        the surfaces an outbreak travels on and they are the first thing a thin
        scope drops.
    - icon: spray-bottle
      title: Wet areas, with separate cloths
      description: Resident and common bathrooms, ensuites, shower chairs and grab
        rails, sluice and laundry areas. Colour-coded cloths and mop heads so
        nothing crosses from a bathroom to a dining table, changed between rooms
        rather than between wings.
    - icon: house
      title: Resident rooms and independent living units
      description: "Floors, surfaces, ensuite, bins, and the things residents actually
        notice: the window sill, the top of the wardrobe, under the bed. We
        knock, we introduce ourselves, and if a resident would rather we came
        back later, we come back later."
    - icon: bloom
      title: Communal lounges and dining
      description: Dining tables and chairs including the legs and feet, lounge
        upholstery vacuumed, hard floors mopped and carpet vacuumed, and glass
        at the height people actually touch it. Dining rooms turn over three
        times a day and need a clean between sittings, not once at night.
    - icon: chart-bars
      title: Periodically, on a named month
      description: Carpet extraction in corridors and lounges, upholstery cleaning,
        high dusting, vents, window sills and external glass at ground level.
        Each one goes on the schedule with a month against it so it happens on a
        date rather than before an audit.
    - icon: puzzle
      title: What we do not do, said plainly
      description: No personal care of any kind. No handling of clinical or sharps
        waste, no cleaning of clinical equipment, no terminal cleans and no
        outbreak decontamination. Those need clinically trained staff under your
        own infection control procedures, and a cleaning contractor claiming
        otherwise is a risk to you.
residents:
  heading: An office is empty. A village never is.
  blocks:
    - type: text
      body:
        - An office is empty when we clean it. A village never is. Somebody is
          having lunch, somebody is asleep, somebody has family visiting, and
          somebody has had a bad morning and does not want a stranger with a mop
          in their room. That is not an obstacle to work around. It is the job.
        - So we work slowly and we work the same way every time. Half a corridor
          stays walkable while the other half dries, because a wet floor sign is
          not a plan for someone with a walker. We knock and wait. We put things
          back exactly where they were, because a chair moved thirty centimetres
          is genuinely disorienting for a resident with dementia.
    - type: image
      image:
        src: /src/assets/commercial_cleaning/premises/aged-care-cleaner-wiping-handrails-in-a-communal-lounge.jpg
        alt: A cleaner wiping down a brushed-metal handrail at the edge of a bright
          communal lounge in a retirement village
    - type: text
      body:
        - "The other half is continuity, and in aged care it is worth more than
          it is anywhere else on this site. Residents come to know the person
          who cleans their room. They will tell that person things they will not
          put on a feedback form: that the shower is not draining, that the
          neighbour has not been out in two days, that they are worried about
          something."
        - A cleaner who changes every fortnight never gets told any of it. Ours
          are employed by TLB rather than subcontracted, they stay, and they are
          briefed to pass on what they notice to your staff instead of to each
          other. That is not an add-on service. It is what having the same
          people does on its own.
    - type: image
      image:
        src: /src/assets/commercial_cleaning/commercial-cleaner-and-office-manager-talking-in-reception.jpg
        alt: A TLB cleaner and a manager talking through the job in a reception area
worthKnowing:
  heading: The two questions worth more than the quote
  body:
    - type: paragraph
      text: The question that matters most on an aged care site is not what a cleaner
        charges, it is who they are sending. Providers are accountable for
        screening the people who work around residents, and that accountability
        extends to contractors. A cleaning company that answers "our team is all
        police-checked" without being able to produce the evidence per person,
        on request, has just made their problem your problem.
    - type: paragraph
      text: "The second question is turnover. Cleaning has one of the highest staff
        turnover rates of any trade, and a subcontracted or platform-sourced
        workforce is the reason: nobody stays because nobody is employed. On an
        aged care site that shows up as strangers in resident rooms every few
        weeks, a scope nobody has actually read, and no one who notices that Mr
        Hall’s shower has stopped draining. Ask any cleaner how long their
        people have been there. It tells you more than the quote does."
