brandedFaq:
  heading: Frequently Asked Questions
  items:
    - question: When would you clean, if we never close?
      answer: In your quietest window, zone by zone rather than room by room, so
        nothing is ever fully out of service. For a staffed gym that is usually
        before opening or after the last class. For a 24/7 club it is the small
        hours, and there will still be members in the building. [Whether TLB
        services unstaffed 24/7 hours. Confirm.] If we cannot cover a window, we
        will tell you at the walkthrough rather than after you have signed.
    - question: Do you clean the equipment itself, or just the floors?
      answer: The equipment is most of the job here. Every pad, grip, handle, lever
        and console gets wiped and disinfected with proper contact time, frames
        included down to the floor. Floors matter, but a member’s hands never
        touch the floor and they touch forty pieces of equipment in an hour. A
        gym quote that talks mostly about floors is an office quote with a
        different heading on it.
    - question: Will you use products that damage upholstery?
      answer: No, and it is worth asking every cleaner. Alcohol-heavy and
        solvent-based sprays crack and dry out vinyl bench upholstery over
        months, which is how a gym ends up replacing pads it should not have
        needed to. We use products rated for gym vinyl and rubber, at the right
        dilution. If your equipment manufacturer specifies something, theirs
        wins and it goes on the scope.
    - question: Can you deal with the change room drains and grout?
      answer: Yes, and they belong on the schedule rather than in a complaint. Grout
        gets agitated and treated periodically instead of mopped over, and
        drains get cleaned out and treated on a set interval, because biofilm in
        a drain is a smell you cannot chase with floor cleaner. Both go on the
        scope with a frequency, which is the only way either one actually
        happens.
    - question: What if we already have mould in the showers?
      answer: Surface mould on grout and silicone in a wet area is normal in this
        climate and comes back if only wiped, so it needs treating and then a
        schedule to keep it down. Anything growing behind a wall or under a
        floor is remediation rather than cleaning, and that is a different job.
        [Whether TLB takes on commercial wet-area mould remediation, or treats
        surface mould only. Confirm.] We have a page on mould and we will tell
        you honestly which side of the line yours is.
    - question: What happens if I get in touch?
      answer: We walk the gym at the quietest hour you have, look at the change room
        drains and the underside of the equipment rather than the reception
        desk, and tell you what is actually going on. Then you get a written
        scope split by zone, a price per visit and a schedule for the periodic
        work. No obligation.
faq:
  heading: Gym Cleaning FAQs
  items:
    - question: How much does gym cleaning cost?
      answer: It is priced per visit against a written scope. The number moves with
        how many pieces of equipment there are rather than floor area, how many
        change rooms and showers, whether the rubber flooring needs machine
        cleaning, and how many visits a day your traffic justifies. A boutique
        studio and a full gym with two change rooms are different jobs. [TLB’s
        pricing basis. Confirm.]
    - question: How often should a gym be cleaned?
      answer: Daily at minimum for equipment, floors and change rooms, and twice daily
        for change rooms in a busy club. Equipment touch points ideally get a
        pass between peak periods as well, which is what the member-facing spray
        bottle is meant to cover and largely does not. Rubber floor machine
        cleaning, grout, drains and upholstery treatment are periodic, on a set
        interval.
    - question: Why does my gym smell even though it looks clean?
      answer: "Because the smell is bacterial rather than visual. Sweat is close to
        odourless on its own; what you are smelling is bacteria feeding on skin,
        oils and sweat absorbed into upholstery, rubber flooring, mats and
        grout. Three usual culprits: disinfectant wiped off before its contact
        time, mats stacked before they dried, and biofilm in a shower or floor
        drain. None of the three are fixed by more air freshener."
    - question: What is the correct way to disinfect gym equipment?
      answer: Clean first, then disinfect, then leave it wet. Wipe the visible soil
        off, apply the disinfectant, and let it stay wet on the surface for the
        contact time printed on its own label — usually a minute or several —
        before it dries or is wiped. Spraying and immediately wiping dry is the
        most common error and it largely wastes the product. Grips, levers and
        adjustment pins matter as much as the pads.
    - question: Can you catch anything from a gym?
      answer: "Occasionally, and it is worth being straight about rather than alarmed.
        Shared wet areas are associated with tinea and plantar warts, and shared
        equipment surfaces with staph-type skin infections, particularly where
        someone has a break in the skin. It is not common and it is largely
        preventable by the same things that stop the room smelling: real
        disinfection with contact time, dry change room floors, and clean mats."
    - question: How do you clean rubber gym flooring?
      answer: With a scrubber and a neutral cleaner rated for rubber, not with a mop
        and not with anything solvent-based or high-pH. Rubber is porous and
        slightly tacky, so a mop mostly redistributes the film of sweat and oil
        across it, which is why a mopped rubber floor still feels sticky. Harsh
        chemicals degrade the surface and shorten the life of a floor that is
        expensive to replace.
