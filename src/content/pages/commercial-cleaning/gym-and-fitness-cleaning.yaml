seo:
  title: Gym and Fitness Studio Cleaning | TLB Cleaning
  description: Cleaning for gyms, fitness studios and 24/7 access clubs across the
    Northern Rivers and the Tweed. Equipment, mats, rubber floors and change
    rooms, done daily on a written scope.
hero:
  kicker: Gym and fitness studio cleaning
  headingLines:
    - Members do not cancel
    - over the equipment.
  lead: Cleaning for gyms, studios and 24/7 access clubs across the Northern
    Rivers and the Tweed. Equipment, mats, rubber floors and change rooms, on a
    scope written for a room people sweat in. {{line.fast}}
  image:
    src: /src/assets/commercial_cleaning/premises/gym-cleaner-wiping-down-strength-equipment.jpg
    alt: A cleaner wiping down the padded bench of a strength machine in a bright,
      modern fitness studio
definition:
  body:
    - type: paragraph
      text: "Gym cleaning is the daily cleaning of a fitness facility: equipment and
        upholstery, mats and rubber flooring, mirrors and glass, change rooms
        and showers, and the high-touch surfaces members put their hands on
        between sets. TLB Cleaning does this work across the Northern Rivers and
        the Tweed for gyms, boutique studios, 24/7 access clubs and studio
        spaces inside larger venues."
    - type: paragraph
      text: What makes it its own trade is what the soiling actually is. An office
        collects dust. A gym collects sweat, skin, hair and body oil, deposited
        deliberately, on upholstery and rubber and into porous surfaces, all
        day, by dozens of people. That is a biological load rather than a dirt
        load, and it means a gym cannot be cleaned with an office scope done
        more often. The products, the order of work and the wet areas all
        change.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
access:
  heading: If you are open 24 hours, there is no "after close".
  body:
    - "Most cleaning contracts assume an empty building. A 24/7 access club
      never has one: three in the morning is quiet, not empty, and the person
      who is in there at that hour is often the member who cares most about the
      place. So the schedule has to be built around presence rather than
      absence, which means quiet-hour visits, working zone by zone rather than
      room by room, and never taking a whole change room out of service at
      once."
    - It also changes who we send. A cleaner working an unstaffed gym at five in
      the morning is alone in a building with members, which is a work health
      and safety question for us and a member-experience question for you.
      [Whether TLB will service unstaffed 24/7 access hours. Confirm.] If the
      answer is no, the honest version of this page covers staffed studios and
      staffed hours, and we should say so rather than quote and then
      renegotiate.
zones:
  heading: Three zones, three different problems
  lead: A gym cannot be cleaned with an office scope done more often. The soiling
    is biological, and each of these rooms holds it differently.
  items:
    - image:
        src: /src/assets/commercial_cleaning/premises/gym-cleaner-wiping-down-strength-equipment.jpg
        alt: A cleaner wiping down the padded bench of a strength machine in a bright,
          modern fitness studio
      title: "The floor: equipment and upholstery"
      description: Every bench pad, seat back, handle, grip and adjustment lever wiped
        and disinfected, not just the ones at eye level. Cardio consoles,
        screens and rails. Dumbbell handles and racks, kettlebell handles,
        barbell sleeves and knurling, the pull-up bar and the cable attachments.
        Frames wiped down to the floor, because sweat runs down and dries where
        nobody looks.
    - image:
        src: /src/assets/commercial_cleaning/premises/gym-studio-floor-and-mats-cleaned.jpg
        alt: A cleaner mopping the timber floor of a bright, empty group fitness studio
          with the mats stacked at the rear
      title: "The studio: mats and floors"
      description: Mats cleaned on both sides and stood to dry rather than stacked
        wet, which is what makes a mat cupboard smell. Sprung timber and vinyl
        mopped with the right dilution so it is not left slippery. Rubber
        flooring deep cleaned with a scrubber and the right chemistry rather
        than a mop, because a mop on rubber just moves the film around. [Whether
        TLB has a scrubber for rubber flooring. Confirm.]
    - image:
        src: /src/assets/commercial_cleaning/premises/gym-change-room-and-showers-cleaned.jpg
        alt: A clean, empty change room in a modern fitness studio, lockers and bench
          dry and finished with the showers behind
      title: "The change rooms: the part that loses members"
      description: Showers including the grout, the screen track and the drain, floors
        mopped and squeegeed rather than left wet, toilets and basins, mirrors,
        benches, locker tops and the gaps between lockers. Consumables
        restocked. Drains and grout treated as scheduled work rather than as a
        response to a complaint, because by the time a member mentions it, three
        have already left.
odour:
  heading: Why it smells when it looks clean
  lead: Four causes, in the order they are usually responsible. None of them are
    fixed by a stronger air freshener.
  items:
    - type: feature
      icon: idea
      heading: It is bacteria, not dirt
      body:
        - "Sweat itself is close to odourless. The smell is what bacteria
          produce feeding on the skin, oils and sweat left on upholstery, rubber
          and grout. That is why a room can look clean and smell awful, and why
          an air freshener makes it worse rather than better: you now have both
          smells."
    - type: feature
      icon: spray-bottle
      heading: Wiping is not disinfecting
      body:
        - A spray wiped straight off has not had its contact time, so it removes
          the visible mark and leaves most of the load behind. Disinfectant has
          to stay wet on the surface for the time on its own label. It is the
          single most common thing done wrong in a gym, including by members
          with the provided bottle.
    - type: feature
      icon: target
      heading: The mats are stacked wet
      body:
        - A mat cleaned on one side and stacked before it dries is a sealed,
          damp, warm surface with a food source on it. Cleaned both sides and
          stood on edge to dry, the same mat is fine. Nothing else on this list
          costs so little to fix.
    - type: feature
      icon: puzzle
      heading: It is coming from the drain
      body:
        - Shower and floor drains hold biofilm and, in a dry trap, let sewer gas
          straight back into the room. A change room that smells worst first
          thing in the morning, before anyone has trained, is telling you it is
          the drain rather than the members. Scheduled drain treatment fixes it;
          more disinfectant on the floor does not.
worthKnowing:
  heading: Two cancellations a month is a cleaning budget
  body:
    - type: paragraph
      text: Nobody cancels a membership because a bench was dusty. They cancel because
        the change room smelled, or because they put their hand on a grip that
        was still wet from someone else. Cleanliness turns up near the top of
        every survey of why members leave a gym, and it is the only one of those
        reasons a gym owner can fix outright rather than compete on. Take your
        monthly membership fee, multiply it by twelve, and that is what one
        avoidable cancellation costs. Two a month is a cleaning budget.
    - type: paragraph
      text: "The second thing is that a gym is the one premises type in this cluster
        where poor cleaning has a health consequence for the people paying you.
        Shared wet areas and shared equipment are how tinea, plantar warts and
        skin infections move between members. Not often, and not dramatically,
        but often enough that a change room floor and a bench pad are not
        cosmetic surfaces. That is the argument for a written scope here: it
        makes the shower grout and the drain someone’s named job on a named day,
        instead of the thing everyone assumed was included."
