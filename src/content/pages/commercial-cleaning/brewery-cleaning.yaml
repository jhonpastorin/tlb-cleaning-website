definition:
  body:
    - type: paragraph
      text: "Brewery cleaning is the cleaning of a brewery’s environment: brew deck
        and cellar floors, trench drains and floor waste, tank exteriors and the
        walls and skirtings around them, the keg and packaging area, plus the
        taproom, bar, bathrooms and back of house. TLB Cleaning does this work
        across the Northern Rivers and the Tweed for craft breweries, taprooms
        and cellar door venues."
    - type: paragraph
      text: It stops at the outside of the vessel, and that is not a limitation we are
        apologising for. Cleaning in place — the caustic and acid cycles that
        clean the inside of tanks, lines and hoses — is part of making beer. It
        sits with your brewers, on your own schedule, with your own chemistry
        and your own verification, because it is the step that decides whether a
        batch is sound. Everything outside the vessel is a cleaning job, and
        there is a lot more of it than most brewery scopes account for.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
cip:
  heading: We do not touch the inside of a tank, a line or a hose. Ever.
  body:
    - Clean in place is brewing, not cleaning. The cycles run caustic and acid
      at concentrations and temperatures that cause serious burns and permanent
      eye injury, the vessels themselves are confined spaces that need a permit
      and atmospheric testing before anyone goes in, and the whole process is
      what determines whether your next batch is infected. It belongs to your
      brewers, with your chemistry and your verification records, and any
      cleaning contractor offering to take it over is offering to ruin your beer
      with the best of intentions.
    - "The second thing, and the one we would rather over-explain than
      under-explain: CO2. Fermentation produces it in volumes that matter, it is
      heavier than air, and it pools at floor level, in cellars and in tank pits
      with no smell and no warning — people have died walking into brewery
      spaces that looked completely ordinary. So our team is briefed to treat
      any low or enclosed space as unsafe until your people say otherwise, and
      to walk out rather than push on. [Whether TLB’s team is formally briefed
      on CO2 and oxygen depletion, and whether sites are asked to provide
      monitoring or a sign-off before entry. Confirm before this page ships.]"
zones:
