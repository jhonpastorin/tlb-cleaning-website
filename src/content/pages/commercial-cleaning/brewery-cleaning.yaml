drains:
  heading: Four things about drains
  lead: Every brewer already knows this. Every landlord and most venue managers do
    not.
  items:
    - type: feature
      icon: idea
      heading: A drain is a biology problem
      body:
        - Trench drains in a brewery carry sugar, yeast and beer all day, which
          is the ideal feedstock for the exact organisms you spend your working
          life keeping out of your beer. A drain left to itself becomes a
          reservoir of wild yeast and lactic bacteria, twenty centimetres from
          your open vessels.
    - type: feature
      icon: spray-bottle
      heading: Hosing is not cleaning it
      body:
        - A hose down the trench moves the visible material and leaves the
          biofilm on the channel walls and under the grate, which is where it
          actually lives. Grates come up, the channel gets scrubbed, and the
          corners and the outfall get done. That is a fortnightly job at
          minimum, not an annual one.
    - type: feature
      icon: target
      heading: And a hose makes it airborne
      body:
        - High-pressure water into a dirty drain aerosolises everything in it
          and puts it into the air of the room, which is the worst possible
          outcome in a space with open vessels or a packaging line. Low
          pressure, mechanical scrubbing and a squeegee, in that order, is the
          method.
    - type: feature
      icon: puzzle
      heading: The taproom has them too
      body:
        - Bar floor wastes, the drip tray drain and the cellar floor waste under
          the keg stack all do the same thing on a smaller scale, and they are
          the usual answer to a taproom that smells stale first thing in the
          morning before anyone has poured anything.
worthKnowing:
  heading: Your CIP protects the vessel. Nothing protects the room.
  body:
    - type: paragraph
      text: "A brewery is the only premises type on this site where poor environmental
        cleaning can cost you an entire batch. The organisms that spoil beer —
        wild yeast, Lactobacillus, Pediococcus — do not usually arrive from
        outside. They live in the building: in drains, in floor corners, on the
        ends of hoses left on a wet floor, in the biofilm under a grate nobody
        lifts. Your CIP protects the inside of the vessel beautifully and does
        nothing at all about the room the vessel is standing in. Take a batch,
        multiply by your wholesale value, and that is the number the floor and
        the drains are actually protecting."
    - type: paragraph
      text: The regulatory side is simpler than people expect and catches breweries
        out anyway. Beer is a food, which makes a brewery a food business, so
        the same obligation to keep premises, fixtures, fittings and equipment
        clean and sanitary applies to you as to a commercial kitchen — and if
        your taproom serves food, that side of the wall carries the full food
        service obligations too. Councils inspect both. The practical
        consequence is that your cleaning needs to exist as a written schedule
        with frequencies against each area, because that is the only form of it
        an inspector or a wholesale customer can actually look at.
