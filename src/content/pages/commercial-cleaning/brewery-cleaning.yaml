      title: "Production side: floors, drains and tank surrounds"
      description: Brew deck and cellar floors washed down and squeegeed to the drain
        rather than left standing, trench drains and floor waste cleaned out and
        the grates lifted, tank and vessel exteriors and their legs and feet,
        hose racks, the walls and skirtings behind the line, and the keg and
        packaging area floor. [Whether TLB works on a live brew deck at all, or
        only during a production stand-down. Confirm.] Everything here is
        outside the vessel.
    - image:
        src: /src/assets/commercial_cleaning/premises/brewery-taproom-reset-before-opening.jpg
        alt: A cleaner wiping down the timber bar top of a small brewery taproom before
          opening, the stainless tap bank polished behind her
      title: "Taproom side: the reset before you open"
      description: Bar top, the front and rail of the bar, the drip trays and the
        outside of the tap bank, tables and bench seats including the
        undersides, floors swept and mopped, glass and the roller door track,
        bathrooms cleaned and restocked, bins emptied, courtyard furniture and
        the paving swept. Finished and dry before your first customer. Beer
        lines and the inside of the taps are your cellar work, not ours.
    - image:
        src: /src/assets/commercial_cleaning/premises/brewery-keg-line-and-floor-drains-cleaned.jpg
        alt: A cleaner squeegeeing water towards a stainless trench drain beside a row
          of clean stainless kegs in a brewery cellar
      title: "The boundary: what stays with you"
      description: CIP of tanks, lines and hoses. Confined space entry of any kind.
        Keg washing, which is a CIP process. Beer line cleaning. Anything
        requiring isolation of plant that has not been locked and tagged by your
        team. [Whether TLB handles spent grain removal, and whether TLB touches
        trade waste or the grease and solids arrestor. Confirm — both have their
        own arrangements and neither is cleaning.]
