brandedFaq:
  heading: Booking a warehouse clean
  items:
    - question: Can your team meet our site induction?
      answer: They have to, and it should be a condition of the contract rather than a
        formality. Most industrial sites require a site-specific induction, a
        sign-in, high-visibility clothing and safety footwear as a minimum, and
        some require more. [What inductions, tickets and PPE TLB’s team can
        meet, and whether that includes a general construction induction card.
        Confirm.] Tell us your requirements at the walkthrough and we will tell
        you honestly what we hold.
    - question: When would you be on site, if we run two shifts?
      answer: In whatever gap genuinely exists, and if there is not one, zone by zone
        around live work. Amenities can be done between shifts because they
        empty out. Floor scrubbing needs an aisle with nothing moving in it, so
        it gets done aisle by aisle in your quietest window rather than in one
        pass. If you run around the clock, the floor becomes a weekend or
        shutdown job and we will say so rather than promise a nightly pass.
    - question: Do you do the floor with a machine?
      answer: That is the right question to ask every contractor quoting you, because
        it is the difference between a service and an appearance. [Whether TLB
        owns or hires an autoscrubber, and the area it covers in a shift.
        Confirm.] A mop and bucket on a warehouse floor moves the tyre rubber
        and dust film around instead of lifting it, which is why a mopped
        concrete floor can look wet-clean and still be slippery.
    - question: Can you work around forklifts?
      answer: We work around them by not being in the same aisle at the same time,
        which is a scheduling answer rather than a bravery one. Our team stays
        in pedestrian walkways, wears high-visibility clothing, and clears an
        aisle with your supervisor before working in it. What we will not do is
        drive your plant, ride on it, or work under a raised load. None of those
        are negotiable.
    - question: Will you clear the pallet wrap and strapping?
      answer: "Yes, that is part of the dock and floor scope, and it is one of the
        best-value lines on it: wrap and strapping on a floor is a trip hazard
        in the one part of the site where people and vehicles share space. Where
        it goes matters though. It gets bagged and put in your waste stream, and
        if you want it taken off site or separated for recycling, that goes on
        the scope with its own price."
    - question: What happens if I get in touch?
      answer: "We walk the site with you and look at four things: the floor and how
        much of it a machine can actually reach, the racking, the dock, and the
        crib room and bathrooms. Then you get a written scope split by zone with
        a frequency against each, a price per visit, and the periodic work
        booked to a shutdown. No obligation."
faq:
  heading: Warehouse Cleaning FAQs
  items:
    - question: How much does warehouse cleaning cost?
      answer: The floor is usually priced per square metre and the amenities per
        visit, and a good quote shows them separately so you can see what you
        are buying. The number moves with how much of the floor a machine can
        actually reach around racking and stock, how many bathrooms and crib
        rooms there are, whether the dock and hardstand are included, and
        whether there is a gap in your shifts. [TLB’s pricing basis. Confirm.]
    - question: How often should a warehouse floor be cleaned?
      answer: Aisles and pedestrian walkways weekly to fortnightly for a normal
        storage site, and daily to weekly for a busy distribution centre or
        anywhere handling food. The driver is forklift traffic rather than floor
        area, because tyre rubber and the dust it grinds in are what actually
        build up. Amenities and bathrooms are daily regardless of how quiet the
        floor is.
    - question: Why use a floor scrubber instead of a mop?
      answer: Because a mop and a scrubber do different things. A scrubber applies
        solution, agitates the floor with a brush or pad, and vacuums the dirty
        water straight back off, so the soil leaves the building. A mop puts
        solution down, moves the soil around in it, and leaves most of it behind
        in a thin film as the floor dries. On a large sealed concrete floor that
        film is what makes a "clean" floor slippery.
    - question: Is warehouse cleaning a work health and safety requirement?
      answer: "Not as a named task, but the outcome is. A business has a primary duty
        under the model work health and safety laws to provide and maintain a
        work environment without risks to health and safety, and on an
        industrial site housekeeping is a large part of how that is met: clear
        walkways, floors with grip, dock aprons without trip hazards, drains
        that are not blocked. Your regulator, SafeWork NSW, is the right primary
        source. This is general information, not safety advice."
    - question: Is dust in a warehouse a fire risk?
      answer: It can be, and it depends what the dust is. In sites handling timber,
        grain, flour, sugar, some plastics and some metals, accumulated
        combustible dust on racking, ledges and roof structure is a recognised
        fire and, in the right conditions, explosion risk. In a general storage
        warehouse it is a pest and product-contamination issue rather than a
        fire one. Either way the dust that matters most is usually the dust
        nobody can reach without an elevating work platform.
    - question: Can a cleaner clean high-level racking?
      answer: Not from the floor, and not from a forklift. Anything beyond safe reach
        needs an elevating work platform, which requires appropriate training to
        operate and, above certain machine types, a high risk work licence, plus
        a fall-prevention plan for the site. Riding a pallet on a forklift to
        get up there is unlawful and is how people die in warehouses. High-level
        work is a separate specialist engagement, usually booked into a
        shutdown.
