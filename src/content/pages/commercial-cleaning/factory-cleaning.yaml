seo:
  title: Factory Cleaning | TLB Cleaning
  description: Factory and production cleaning across the Northern Rivers and the
    Tweed. Floors, plant surrounds, wash-downs and crib rooms, booked to your
    shutdown window and finished inside it.
hero:
  kicker: Factory and production cleaning
  headingLines:
    - You get one window.
    - We finish inside it.
  lead: Factory and production cleaning across the Northern Rivers and the Tweed.
    Floors, plant surrounds, wash-downs and amenities, booked to a shutdown that
    was scheduled months ago and cannot move. {{line.fast}}
  image:
    src: /src/assets/commercial_cleaning/premises/factory-cleaner-scrubbing-a-production-floor-walkway.jpg
    alt: A cleaner in a high-visibility vest scrubbing a marked pedestrian walkway
      on a bright factory production floor with the line shut down
definition:
  body:
    - type: paragraph
      text: "Factory cleaning is the cleaning of a production site: the production
        floor and pedestrian walkways, the surrounds and exteriors of plant and
        equipment, wash-down areas and drains, the dry store, and the crib
        rooms, bathrooms and locker areas your shifts use. TLB Cleaning does
        this work across the Northern Rivers and the Tweed, scheduled into
        shutdowns rather than around them."
    - type: paragraph
      text: A warehouse stores things and a factory makes them, and that single
        difference is why the two need different scopes. A factory has
        production residue that is specific to what it produces, plant that has
        to be isolated before anyone touches near it, and a cleaning window that
        was set on a production calendar months ago. If your site stores and
        picks rather than manufactures, the warehouse page is written for you
        and this one is not.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
isolation:
  heading: Nobody from our team touches plant that has not been isolated.
  body:
    - Before any cleaning happens on or near a machine, that machine has to be
      shut down and isolated from every energy source, and locked and tagged out
      by your people under your own procedure. Not switched off. Isolated. The
      duty to do that sits with the site rather than with the contractor, and we
      will not accept it being handed to us informally at the start of a
      shutdown because the paperwork is running late.
    - The reason is that the things that hurt people are the ones that are not
      obvious. A machine with the power off can still hold hydraulic pressure,
      compressed air, a gravity load, residual heat or stored charge, and
      unexpected start-up during cleaning is one of the recognised ways people
      are killed in factories. So we clean what is isolated and tagged, we clean
      exteriors and surrounds of what is not, and we do not enter confined
      spaces at all, which need a permit and training we do not hold. [Whether
      anyone at TLB holds their own isolation training, or whether we work
      strictly under the client’s permit. Confirm.]
stages:
  heading: One window, three stages
  lead: In this order, because the floor gets dirty again while the plant is being
    done and the amenities have to be ready for the shift that walks in at the
    end.
  items:
    - image:
        src: /src/assets/commercial_cleaning/premises/factory-cleaner-scrubbing-a-production-floor-walkway.jpg
        alt: A cleaner in a high-visibility vest scrubbing a marked pedestrian walkway
          on a bright factory production floor with the line shut down
      title: "Stage one: the floor and the walkways"
      description: "Swept, then machine scrubbed where a machine fits, and
        hand-scrubbed in the plant surrounds where it does not. Pedestrian
        walkway markings and line markings done rather than skipped. Floor
        channels and grates lifted, cleaned out and put back. Product residue is
        treated as its own problem: flour, sugar, oil, timber dust and plastic
        swarf all behave differently and none of them come up with the same
        method."
    - image:
        src: /src/assets/commercial_cleaning/premises/factory-wash-down-of-stainless-production-equipment.jpg
        alt: A cleaner in a high-visibility vest and hair net wiping down the stainless
          steel housing of a food-production conveyor during a shutdown
          wash-down
      title: "Stage two: plant surrounds and the wash-down"
      description: Equipment exteriors, guarding, frames and the floor and wall behind
        and under the line. Stainless washed down and dried rather than left to
        air spot. Where a machine has been isolated and tagged out by your team,
        we clean into the opened guarding; where it has not, we clean the
        surrounds and stop at the guard. [Confirm which of those two TLB will
        offer.] The distinction goes on the scope, not into a conversation on
        the day.
    - image:
        src: /src/assets/commercial_cleaning/premises/factory-crib-room-cleaned-for-shift-change.jpg
        alt: A cleaner wiping down the table of a clean, empty factory crib room,
          kitchenette and lockers behind her, ready for the next shift
      title: "Stage three: amenities, and the food-grade question"
      description: "Crib rooms, kitchenettes, bathrooms, lockers, the first aid room
        and the front office, cleaned to be ready for the shift that walks in
        after the shutdown ends. In a food production site there is a second
        layer: cleaning inside a food environment has to run to your own
        HACCP-based food safety program, with your products and your
        verification. [Whether TLB will work inside a food production
        environment. Confirm.]"
shutdown:
  heading: A shutdown is not a booking
  blocks:
    - type: text
      body:
        - A shutdown is not a booking. It is a date that was set on a production
          calendar months ago, that a maintenance contractor, an electrician, a
          calibration technician and possibly an auditor are all working to, and
          that costs the business real money for every hour it runs over. Nobody
          in that window is waiting on the cleaner, and nobody in it can absorb
          a cleaner who has underestimated the job.
        - So the only useful thing a cleaning contractor can offer a production
          manager is an honest number of hours and enough people to hit it. That
          means walking the site during production rather than during the
          shutdown, counting the plant surrounds properly, and telling you if
          the window you have is too short. We would rather lose the job at the
          walkthrough than be the reason a line restarts late.
    - type: image
      image:
        src: /src/assets/commercial_cleaning/premises/factory-wash-down-of-stainless-production-equipment.jpg
        alt: A cleaner in a high-visibility vest and hair net wiping down the stainless
          steel housing of a food-production conveyor during a shutdown
          wash-down
    - type: text
      body:
        - "The other half is what happens between shutdowns. Most factories only
          think about cleaning in the window, which means the site degrades for
          eleven weeks and then gets rescued in one. It is the most expensive
          way to do it: residue that has been baked on for a quarter takes
          several times longer to remove than residue from a fortnight ago, so
          the shutdown job grows every cycle."
        - The better pattern is a small recurring visit for amenities, walkways
          and the floor, with the heavy plant work saved for the window. Then
          the shutdown is a shutdown rather than a recovery, and the hours you
          are buying in it stay predictable from one quarter to the next.
    - type: image
      image:
        src: /src/assets/commercial_cleaning/premises/factory-crib-room-cleaned-for-shift-change.jpg
        alt: A cleaner wiping down the table of a clean, empty factory crib room,
          kitchenette and lockers behind her, ready for the next shift
priceDrivers:
  heading: What actually decides the price
  lead: Four variables, and the first one is why nobody can quote your factory
    over the phone.
  items:
    - type: feature
      icon: idea
      heading: What you actually make
      body:
        - Flour, sugar, oil, resin, timber dust and metal swarf are six
          different cleaning problems with six different methods, and one of
          them will be yours. This is the single biggest variable and it is the
          reason a factory scope cannot be written from a template or quoted
          over the phone.
    - type: feature
      icon: chart-pie
      heading: How much of it a machine can reach
      body:
        - Open floor is fast. Plant surrounds, the gaps between units, under a
          conveyor and behind a guard are all hand work, and hand work is where
          the hours go. Two sites with the same floor area can differ threefold
          on this alone.
    - type: feature
      icon: key
      heading: How long the window is
      body:
        - A job that fits comfortably into a three-day shutdown and the same job
          compressed into an overnight are different prices, because the second
          one needs more people at once and often penalty rates. The window is
          the constraint, not the work.
    - type: feature
      icon: target
      heading: How long since the last one
      body:
        - Residue hardens, and hardened residue takes several times longer than
          fresh. The first clean on a site that has never had a proper one is
          always the biggest number you will see from us, and it should come
          down markedly by the second cycle. If it does not, ask us why.
worthKnowing:
  heading: Here, cleaning sits upstream of production
  body:
    - type: paragraph
      text: In a factory, cleaning sits upstream of production rather than beside it,
        which is why it usually belongs in an operations budget rather than a
        facilities one. Residue on a line is a contamination risk and a quality
        risk before it is a tidiness one. Residue on a floor is a slip risk in a
        building full of moving plant. Residue in the roof structure, if what
        you make is flour, sugar, timber or certain plastics and metals, is a
        fire and explosion risk. And residue anywhere is what feeds a pest
        problem, because pests follow food and harbourage rather than dirt.
    - type: paragraph
      text: The other thing that moves it upstream is the audit. If you produce food,
        your premises, fixtures, fittings and equipment have to be kept clean
        and sanitary, and in practice cleaning is a prerequisite program inside
        your own HACCP-based food safety plan — with named tasks, frequencies,
        products and verification records. Customer and certification audits go
        looking for exactly that documentation. A cleaning arrangement that
        exists as a verbal understanding with a contractor cannot produce it, no
        matter how well the site is actually being cleaned. That is the real
        argument for a written scope here, and it is why we write ours to be
        filed rather than quoted.
