seo:
  title: Strata Cleaning Services - Common Areas | TLB Cleaning
  description: "Strata and common area cleaning for apartment blocks and body
    corporates: lobbies, lifts, bins and car parks. Request a schedule and
    quote."
ctaLabel: Request a schedule and quote
hero:
  kicker: Strata and common area cleaning
  headingLines:
    - Strata cleaning services on a scope the committee can check
  lead: The first thing an owner sees is the front door. Strata cleaning services
    for apartment blocks, townhouse complexes and mixed-use buildings across the
    Northern Rivers and the Tweed. A written schedule, the same cleaner each
    week, and a record the committee can actually read. {{line.fast}}
  image:
    src: /src/assets/commercial_cleaning/premises/strata-cleaner-mopping-an-apartment-lobby.jpg
    alt: A cleaner mopping the tiled floor of a bright apartment building lobby with
      the glass entry doors behind her
definition:
  body:
    - type: paragraph
      text: "Strata cleaning is the regular cleaning of the shared parts of a building
        that no single owner is responsible for: the entry and lobby, lifts,
        stairwells and landings, corridors, common bathrooms, the carpark and
        driveway, and the bin room. TLB Cleaning cleans common areas across the
        Northern Rivers and the Tweed for owners corporations, strata managers
        and building managers."
    - type: paragraph
      text: The line that matters is common property versus lots. We clean common
        property, which is what the levies pay for. Inside an apartment is the
        owner or tenant’s own business, and if they want that done it is a
        separate arrangement with us rather than something quietly folded into
        the building’s contract. Keeping that line clean is what stops a common
        area budget from turning into an argument at the next general meeting.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
areas:
  heading: Every common area, with a frequency against it
  lead: Six areas, and the periodic work that keeps each one from degrading
    between panics. Follow a row through to the service that does it.
  items:
    - icon: house
      title: Entry, lobby and letterboxes
      description: Glass doors and sidelights inside and out, entry matting, the floor
        mopped or vacuumed, letterbox bank wiped, cobwebs off the ceiling and
        light fittings. This is the ten square metres that sets what a
        prospective buyer thinks of the whole building.
      href: /commercial-cleaning/
    - icon: office
      title: Lifts, stairwells and landings
      description: Lift floors, walls and the stainless doors and buttons, stair
        treads and risers, handrails, and the glass balustrades that show every
        fingerprint. Landings get the corners and the skirtings, which is where
        a thin scope stops.
      href: /commercial-cleaning/
    - icon: spark
      title: Corridors and common carpet
      description: Vacuumed on the schedule, with spot treatment as things happen.
        Carpet in a corridor wears in one narrow lane and needs extraction once
        or twice a year on top of vacuuming, or the traffic path goes
        permanently grey.
      href: /commercial-cleaning/commercial-carpet-cleaning/
    - icon: key
      title: Carpark, driveway and hard surfaces
      description: Swept, litter and leaves cleared, drains checked clear, oil spots
        treated. Concrete driveways, paths and the ramp go dark with algae in a
        Northern Rivers wet season and need pressure cleaning periodically
        rather than sweeping.
      href: /commercial-cleaning/commercial-pressure-cleaning/
    - icon: puzzle
      title: Bin room and waste area
      description: Floor hosed and squeegeed to the drain, walls and the chute door
        wiped, deodorised, and loose rubbish cleared from around the bins.
        Presenting and returning bins on collection day is [included / a
        separate add-on. Confirm], because it is a scheduled task rather than a
        cleaning task.
      href: /commercial-cleaning/
    - icon: target
      title: Common bathrooms, laundries and pool surrounds
      description: "Where the building has them: toilets and basins cleaned and
        disinfected, mirrors, floors mopped, laundry benches and machine tops
        wiped, and the hard surround of a pool or BBQ area swept and hosed. Not
        the pool water, which is a pool contractor."
      href: /commercial-cleaning/
binRoom:
  heading: Do not cut the bin room to save money.
  body:
    - It is the first line a committee strikes out of a quote and it is the one
      that comes back hardest. A bin room that is not hosed and deodorised on a
      schedule becomes a smell in the lift lobby within a fortnight in a
      Northern Rivers summer, then a cockroach problem, then a pest control
      invoice larger than the cleaning line you saved.
    - It is also the area most likely to put the owners corporation in the
      wrong. Waste that is overflowing, blocking access or sitting outside the
      room is a work health and safety exposure on common property, and it is
      exactly what a resident photographs and sends to council.
binRoomPhoto:
  image:
    src: /src/assets/commercial_cleaning/premises/strata-bin-room-hosed-out-and-tidy.jpg
    alt: A clean, empty communal bin room in an apartment building, freshly hosed
      out with the floor draining
  caption: A bin room on a schedule. This is what the line item you were about to
    cut actually buys.
reporting:
  heading: Three people read this page
  blocks:
    - type: text
      body:
        - Three different people read this page and they want three different
          things. A committee member wants to stop hearing complaints in the
          owners group chat. A strata manager wants a contractor who invoices
          correctly, holds current insurance and does not generate phone calls.
          An on-site building manager wants someone who turns up when they said
          and does not need supervising.
        - We write the scope so all three can use it. It names each area, what
          happens in it, and how often, with nothing left as "general tidy".
          That one document is what a committee approves, what a manager files,
          and what a building manager checks against.
    - type: image
      image:
        src: /src/assets/commercial_cleaning/premises/strata-cleaner-cleaning-a-lift-lobby-glass-balustrade.jpg
        alt: A cleaner wiping down a glass balustrade on the open landing of an
          apartment building, the lift lobby behind her
    - type: text
      body:
        - The other half of it is being visible without being intrusive.
          Residents live here. We work in the morning where we can, keep half a
          corridor walkable while we mop it, and never leave a cord across a
          fire stair. If a resident stops one of our team to ask about something
          inside their own apartment, we tell them honestly that it is not on
          the building’s scope and give them our number.
        - "And you get told what happened. Not a glossy report nobody reads,
          just a short record of the visit and anything we found: a blown light
          in the stairwell, a lock that is not catching, a bin room door propped
          open again. Most of what a building manager needs to know, someone
          with a mop notices first."
    - type: image
      image:
        src: /src/assets/commercial_cleaning/premises/strata-carpark-and-driveway-swept.jpg
        alt: A cleaner sweeping the concrete floor of a clean apartment basement carpark
          towards the daylight at the ramp
scopeFailures:
  heading: Three ways a strata scope goes wrong
  lead: All three are visible in the document before a single visit happens.
  items:
    - type: feature
      icon: idea
      heading: It says "general clean"
      body:
        - Two words that cover everything and guarantee nothing. When a resident
          complains about the stairwell, nobody can point at a line that was or
          was not met, so it becomes a matter of opinion between the committee
          and the contractor. Every area on a real scope has a task and a
          frequency against it.
    - type: feature
      icon: chart-pie
      heading: The frequency was set once, in 2019
      body:
        - Buildings change. A block that fills with short-stay tenants generates
          more lobby traffic and more bin room work than the same block did full
          of owner-occupiers. A scope that has never been reviewed is usually
          either paying for visits the building does not need or missing the
          ones it does.
    - type: feature
      icon: suitcase
      heading: Periodic work was never scheduled
      body:
        - Carpet extraction, external glass, pressure cleaning the driveway and
          high dusting are not weekly jobs, so they fall off a weekly scope
          entirely and only happen when something looks bad enough to trigger a
          special quote. Put them on the schedule with a month against each one
          and the building stops degrading between panics.
