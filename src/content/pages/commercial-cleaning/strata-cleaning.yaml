brandedFaq:
  heading: Working with us on your building
  items:
    - question: Who do you invoice, us or the strata manager?
      answer: Whichever the owners corporation prefers. Most of our strata work is
        invoiced monthly to the strata manager against the approved scope, with
        the committee copied so nobody is surprised at the next meeting. If the
        building is self-managed we invoice the treasurer directly. Either way
        the invoice references the scope, so it can be checked without a phone
        call.
    - question: Can you give us something to take to the committee?
      answer: Yes, and it is the main thing we produce. After the walkthrough you get
        a written scope with every common area listed, the tasks in it and the
        frequency of each, and a price per visit. It is written to be read out
        at a meeting and voted on, not to be interpreted. If the committee wants
        two options at different frequencies, we quote both.
    - question: Do you use subcontractors?
      answer: No. Our cleaners are employed by TLB and paid to the Cleaning Services
        Award, which matters more in strata than almost anywhere else, because
        it is what keeps one clear answer about who attends your building and
        who is insured. You get the same cleaner, and we can tell you their
        name.
    - question: What if a resident asks our cleaner to do something extra?
      answer: They tell them politely that it is not on the building’s scope and hand
        over our number. Nothing gets added to a common area visit informally,
        because the levy payers as a whole are paying for that time and one
        resident cannot reallocate it. If they want their own apartment cleaned,
        that is a separate private arrangement with us.
    - question: Will you work around residents?
      answer: Yes. We clean common areas in the morning where the building allows it,
        keep a walkable path while floors are wet, never block a fire exit or
        run a cord across a stair, and keep noise down before eight. If your
        by-laws set contractor hours, tell us at the walkthrough and the
        schedule is built inside them.
    - question: What happens if I get in touch?
      answer: We walk the building with you, top to bottom including the bin room and
        the carpark, and note what is actually happening rather than what the
        last scope said. Then you get a written scope, a price per visit and a
        suggested schedule for the periodic work. No obligation, and nothing to
        sign at the walkthrough.
faq:
  heading: Strata cleaning services, common questions
  items:
    - question: How much does strata cleaning cost?
      answer: Common area cleaning is priced per visit against a written scope, and
        the number moves with how many levels and lifts the building has, how
        much common carpet and glass there is, whether there is a carpark and
        bin room, and how often you want it done. A weekly single-level
        townhouse complex and a three-times-weekly high-rise are different jobs
        entirely. [TLB’s pricing basis and any minimum charge. Confirm.]
    - question: How often should common areas be cleaned?
      answer: Lobbies and lifts in a building with more than about twenty lots
        generally need two or three visits a week, because entry glass and lift
        floors show traffic immediately. Stairwells, corridors and carparks
        usually work weekly or fortnightly. Bin rooms want at least weekly year
        round and more often over summer. Periodic work such as carpet
        extraction, external glass and pressure cleaning is once or twice a year
        on a set month.
    - question: Is the owners corporation required to clean common property?
      answer: In New South Wales an owners corporation has a duty under the Strata
        Schemes Management Act 2015 to properly maintain common property and
        keep it in a state of good and serviceable repair, and in practice
        regular cleaning is part of meeting it. What that means for a particular
        task depends on the scheme’s own by-laws. Your strata manager or NSW
        Fair Trading is the right source for your building. This is general
        information, not legal advice.
    - question: What is the difference between common property and a lot?
      answer: "Broadly, a lot is the part an individual owns, usually the inside of
        the apartment or townhouse, and common property is everything shared:
        entry, lobby, lifts, stairs, corridors, external walls and roof,
        driveways and the bin room. Cleaning contracts paid from levies cover
        common property only. Where the boundary sits in a specific building is
        set by its strata plan, so check yours rather than assuming."
    - question: Do strata cleaners need insurance and inductions?
      answer: Yes. Any contractor working on common property should hold current
        public liability cover and workers compensation, and most strata
        managers set a minimum level and ask for the certificate annually.
        Larger buildings also require a site induction and a signed-in visit.
        [TLB’s public liability level and whether it meets the common strata
        minimum. Confirm.]
    - question: Can the same cleaner do the common areas and individual apartments?
      answer: They can, but the two should never sit on one invoice. Common area work
        is paid from levies on behalf of every owner, and an individual
        apartment is a private arrangement. Mixing them is how a committee ends
        up unable to explain a line item. We are happy to do both in one
        building, quoted and billed entirely separately.
