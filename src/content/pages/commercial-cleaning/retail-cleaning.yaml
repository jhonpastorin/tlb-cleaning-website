  caption: Glass first, every visit. It is the only thing between a browser on the
    footpath and your stock.
tenancy:
  heading: Check your lease before you buy any of this.
  body:
    - If your shop is inside a centre or a managed strip, the landlord’s
      cleaning contract usually covers the mall floor, the shared bathrooms, the
      loading dock and the common bin area, and you are already paying for it
      through outgoings. What it almost never covers is anything inside your
      lease line, which is your floor, your glass, your fitting rooms, your
      counter and your stockroom.
    - The two ways that costs a tenant money are opposite. Some pay for a scope
      that duplicates what outgoings already fund. Others assume the centre’s
      cleaner does their glass and never notice it has not been done in a year.
      Read the cleaning clause, or send it to us and we will quote to your lease
      line rather than over it.
worthKnowing:
  heading: The customers you lose never come in
  body:
    - type: paragraph
      text: The thing about a shop is that the people you lose never come in, so you
        never find out. A browser looks at your window from the footpath, and if
        the glass is streaked or fingerprinted or has last month’s tape residue
        on it, they read the whole business through it and keep walking. There
        is no complaint and no data. It is the only premises type in this
        cluster where the cost of poor cleaning is entirely invisible to the
        person paying for it.
    - type: paragraph
      text: That is also why glass is worth insisting on rather than treating as an
        extra. Coastal shopfronts in this region get a salt film that a dry
        cloth just smears, and the low morning sun on a main street shows every
        mark on it. Washed properly and squeegeed it disappears; wiped, it looks
        worse than before it was touched. If you only buy one line on the scope,
        buy that one, and buy it often enough that it is never a job someone has
        to notice.
