definition:
  body:
    - type: paragraph
      text: "Retail cleaning is the daily cleaning of a shop or shopfront: floors,
        entry and matting, internal and external glass, the counter and fitting
        rooms, shelving and display surfaces, staff areas and the bathroom. TLB
        Cleaning does this work across the Northern Rivers and the Tweed for
        single shops, cafés and takeaway front of house, salons, galleries and
        strips of tenancies."
    - type: paragraph
      text: In retail the cleaning is part of the merchandising rather than
        maintenance, and the priority order is not what most people expect.
        Glass comes first, because a customer decides whether to come in from
        the footpath and the only thing between them and the stock is a pane of
        glass with the morning sun on it. Then the floor, then the entry, then
        the counter. Everything else is real work, but those four are what a
        browser reacts to before anyone has said hello.
  backgroundImage: /src/assets/home/house-cleaning-cleaner-wiping-tall-interior-window.png
clock:
  heading: What happens, and when
  lead: Ordered by the clock rather than by room, because that is the order a shop
    actually runs on.
  items:
    - icon: spark
      title: Before you open
      description: Internal glass and the entry doors done first, floors swept and
        mopped or vacuumed and dry before trade, entry matting lifted and
        cleaned underneath, counter and card terminal wiped, bins emptied and
        relined, fitting room mirrors and floors done. Finished and dry, not
        finished and wet with a sign out.
      href: /commercial-cleaning/
    - icon: target
      title: External glass and the footpath
      description: Shopfront glass outside as well as in, the frames and the
        threshold, and the footpath immediately outside swept. Coastal
        shopfronts collect salt film that fresh water alone will not shift, so
        the glass needs washing rather than wiping. [Whether TLB does external
        glass, and up to what height. Confirm.] Anything above ground level
        needs its own plan.
      href: /house-cleaning/window-cleaning/
    - icon: house
      title: Back of house, which nobody quotes
      description: Staff bathroom cleaned and restocked, kitchenette and sink, the
        stockroom floor swept and kept clear, and the bin area. The stockroom is
        the room a scope always leaves out and the room a health or fire
        inspection actually looks at, because a blocked exit path starts as a
        delivery nobody unpacked.
      href: /commercial-cleaning/
    - icon: bloom
      title: Display surfaces, on your terms
      description: Shelf and plinth surfaces dusted, mirrors and cabinet glass done,
        and the tops of fixtures nobody can see from the floor but everybody can
        see from the mezzanine. We do not move or restyle merchandise. We dust
        around it, or we dust it and put it back exactly as it was, and which of
        those it is goes on the scope rather than being assumed.
      href: /commercial-cleaning/
    - icon: chart-bars
      title: Periodically, outside trade
      description: Carpet extraction where there is carpet, hard floor machine
        scrubbing or polishing, high dusting and light fittings, air vents, and
        pressure cleaning the footpath and entry threshold. All of it booked
        into a closed day or an early morning, because none of it can happen
        with customers in the shop.
      href: /commercial-cleaning/commercial-pressure-cleaning/
glassPhoto:
