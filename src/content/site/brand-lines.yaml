line:
  instant: Easy to book, instant pricing, cost effective.
  fast: Easy to book, fast quoting, cost effective.
lineHeading:
  instant: Easy to book, instant pricing, cost effective
  fast: Easy to book, fast quoting, cost effective
managedForYou:
  recurring: Managed for you. Set day, set team, a reminder before, a message on
    the way, and told first when something changes.
  oneOff: Managed for you. A date that suits you, a confirmation in writing, a
    message when we are on the way, and told first if anything changes.
body:
  regular:
    - Book online in a couple of minutes, or send a text, ring us or email,
      whichever you'd actually do. Tell us the bedrooms, the bathrooms and how
      often you want us. That's enough to price a regular clean properly.
    - Regular cleaning is the one job that can be priced without seeing it
      first, because size and frequency genuinely predict the work. So you get a
      number straight away rather than waiting on someone to come and look. The
      price doesn't move once we're there, unless you ask us to do more.
    - It's cost effective because the same team comes back to a place they
      already know. Nothing gets learned from scratch each visit, so the time
      goes on cleaning rather than on working out where things live. No lock-in,
      no minimum term and no exit fee.
  turnover:
    - Book online in a couple of minutes, or send a text, ring us or email,
      whichever you'd actually do. Tell us the property, the bedrooms and how
      you handle the linen.
    - A turnover is the same property to the same scope every time, so it gets
      priced once rather than quoted after every checkout. You get a rate per
      turnover you can build into your nightly price. It doesn't move because a
      guest left late or the season got busy.
    - It's cost effective because a turnover you've priced once is a turnover
      you stop managing. We work off your calendar rather than a phone call each
      time a booking ends. No lock-in, no minimum term and no exit fee.
  residential:
    - Book online in a couple of minutes, or send a text, ring us or email,
      whichever you'd actually do.
    - Condition drives the price on work like this, so the honest answer is a
      fast quote rather than an instant one. Tell us what you've got and roughly
      what state it's in, and we'll come back with a number quickly. Photos are
      usually enough. If it needs eyes on it, we'll say so rather than guess.
    - You'll know the price before we start, not after. If the job turns out
      smaller than you described, we'll tell you rather than hold you to the
      bigger number. If it needs more time than we quoted, you'll hear that
      before we begin.
  condition:
    - Book online in a couple of minutes, or send a text, ring us or email,
      whichever you'd actually do.
    - Condition is what sets the price on this work, and a job like it can't be
      priced properly sight unseen. So you get a fast quote on the actual
      property instead of an instant number that has to be revised later. Tell
      us honestly what state it's in when you book, because nothing you say will
      surprise us.
    - You'll know the price before we start, not after. Being straight about the
      condition is what lets us allow the right amount of time, rather than
      running short on the day. If it needs more than we've quoted, you'll hear
      that before we begin rather than on the invoice.
  commercial:
    - Book a walkthrough online, or send a text, ring us or email, whichever
      suits. We come and look at the premises rather than pricing it off a form.
    - Commercial work gets priced on the site, because hours on the ground are
      what set the number. You get a written scope and a price per visit, so you
      know what you're paying for. Anything outside that scope is quoted before
      it happens, not added afterwards.
    - It's cost effective because a written scope is something you can hold us
      to. You're buying a defined amount of work, on a set day, from the same
      team each visit. No lock-in term.
howItWorks:
  heading: How it works
  general:
    - Tell us about the job.
    - We confirm the price and agree a time and access.
    - We do the clean, and you get a message when we're on the way.
    - If something needs fixing, you hear it from us first.
  turnover:
    - Tell us about your property.
    - We link to your booking calendar and agree access.
    - We take care of every turnover, and you get photos each time.
    - If something needs fixing, you hear it from us first.
