        type: file
        path: src/content/pages/why-tlb.yaml
        format: yaml
        fields:
          - { name: seo, component: seo }
          - name: hero
            component: hero
            description: "No photo yet: the slot shows a labelled box until a real photo of the TLB team is chosen, and it must not go live like that. The button jumps to the comparison table (#compare)."
          - name: definition
            component: textBlock
            label: "Intro (under the trust bar)"
