              - { name: blurb, label: One line about it, type: text, required: true }

      - name: premises
        label: "Cross-links: commercial premises"
        type: file
        path: src/content/site/premises.yaml
        format: yaml
        fields:
          - name: pages
            label: Premises pages
            type: object
            list:
              min: 13
              max: 13
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - { name: label, label: Name, type: string, required: true }
              - { name: href, label: Page, type: string, readonly: true }
              - { name: blurb, label: One line about it, type: text, required: true }
          - name: services
            label: Commercial services
            type: object
            list: true
            fields:
              - { name: label, label: Name, type: string, required: true }
              - { name: href, label: Page, type: string, required: true }

      - name: guides
        label: "Cross-links: guides"
