            fields:
              - { name: label, label: Name, type: string, required: true }
              - { name: href, label: Page, type: string, required: true }
              - { name: icon, component: serviceIcon }
              - { name: description, label: One line about it, type: text, required: true }

  - name: reviews
    label: Google reviews
    type: file
    path: src/content/site/reviews.yaml
    format: yaml
    fields:
      - name: profileUrl
        label: Google Business Profile link
        type: string
        description: Leave empty until the profile is public. Adds a "Read all our reviews on Google" link.
      - name: reviews
        label: Reviews (newest first)
        type: object
        description: "Only reviews that are live on Google, copied word for word, with the name exactly as Google shows it. Never edit, shorten or combine a review. No star averages."
        list:
          collapsible:
            collapsed: true
            summary: "{author} ({date})"
        fields:
          - { name: author, label: Name as Google shows it, type: string, required: true }
          - { name: rating, label: Stars, type: number, required: true, options: { min: 1, max: 5 } }
          - { name: text, label: Review, type: text, required: true }
          - { name: date, label: Month posted (YYYY-MM), type: string, required: true, pattern: "^\\d{4}-\\d{2}$" }
          - { name: reviewUrl, label: The review's share link, type: string }
          - name: topics
            label: Lead with it on
            type: select
            options:
              multiple: true
              values:
                - { name: airbnb, label: The Airbnb page }

  - name: locations
    label: Locations
    type: group
    items:
      - name: locations-settings
        label: Live towns and region photos
        type: file
        path: src/content/site/locations.yaml
        format: yaml
        fields:
          - name: liveTowns
            component: townPicker
            label: Live town pages
            description: "Towns whose page is linked from the menu, the location bands and the region pages. Every town is still named everywhere; only these are clickable."
          - { name: subheading, label: Subheading over the town lists, type: string, required: true }
          - { name: nswSubheading, label: Subheading on NSW-only pages, type: string, required: true }
          - name: regionPhotos
            label: Region photos
            type: object
            description: "None of these is a photo of a specific town, so the descriptions must not name one."
            fields:
              - { name: hinterlandHome, component: image, label: Hinterland home }
              - { name: coastalHome, component: image, label: Coastal home }
              - { name: valley, component: image, label: Valley }

      - name: towns
        label: Town pages
        type: collection
        path: src/content/towns
        format: yaml
        view:
          primary: town
        operations: { create: false, delete: false, rename: false }
        fields:
          - { name: town, label: Town, type: string, readonly: true }
          - name: hero
            component: image
            label: Photo
            description: "A scene characteristic of the town, not a photo OF it, unless TLB took it there. The description says what is in the frame and never names the town, a landmark or a street unless the photo is really of it."
          - name: local
            component: paragraphList
            label: About this town
            description: "Two or three sentences only true of this town, from someone who works there. This is what stops the page being a near-copy of the other 55. Never invent TLB's experiences."
          - name: nearby
            component: townPicker
            label: Nearby towns (optional)
            description: Leave empty to work them out from the map. Pick six to override.

      - name: regions
        label: Region pages
        type: collection
        path: src/content/regions
        format: yaml
        operations: { create: false, delete: false, rename: false }
        fields:
          - { name: seo, component: seo }
          - name: headingLines
            label: Main heading (H1)
            type: string
            list: true
            required: true
          - { name: lead, label: Intro sentence, type: text, required: true }
          - name: intro
            component: paragraphList
            label: About the region
            description: "The /locations/ hub shows these same paragraphs. Rewriting one of the two so they differ is still an open item."

