      - name: reviews
        label: Reviews (newest first)
        type: object
        description: "Only reviews that are live on Google, copied word for word, with the name exactly as Google shows it. Never edit, shorten or combine a review. No star averages."
        list:
          collapsible:
            collapsed: true
            summary: "{author} ({date})"
        fields:
          - { name: author, label: Name as Google shows it, type: string, required: true }
          - { name: rating, label: Stars, type: number, required: true, options: { min: 1, max: 5 } }
          - { name: text, label: Review, type: text, required: true }
          - { name: date, label: Month posted (YYYY-MM), type: string, required: true, pattern: "^\\d{4}-\\d{2}$" }
          - { name: reviewUrl, label: The review's share link, type: string }
          - name: topics
            label: Lead with it on
            type: select
            options:
              multiple: true
              values:
                - { name: airbnb, label: The Airbnb page }

  - name: locations
    label: Locations
    type: group
    items:
      - name: locations-settings
        label: Live towns and region photos
        type: file
        path: src/content/site/locations.yaml
        format: yaml
        fields:
          - name: liveTowns
            component: townPicker
            label: Live town pages
            description: "Towns whose page is linked from the menu, the location bands and the region pages. Every town is still named everywhere; only these are clickable."
          - { name: subheading, label: Subheading over the town lists, type: string, required: true }
          - { name: nswSubheading, label: Subheading on NSW-only pages, type: string, required: true }
          - name: regionPhotos
            label: Region photos
            type: object
            description: "None of these is a photo of a specific town, so the descriptions must not name one."
            fields:
              - { name: hinterlandHome, component: image, label: Hinterland home }
              - { name: coastalHome, component: image, label: Coastal home }
              - { name: valley, component: image, label: Valley }

      - name: towns
        label: Town pages
        type: collection
        path: src/content/towns
        format: yaml
        view:
          primary: town
        operations: { create: false, delete: false, rename: false }
        fields:
          - { name: town, label: Town, type: string, readonly: true }
          - name: hero
            component: image
            label: Photo
            description: "A scene characteristic of the town, not a photo OF it, unless TLB took it there. The description says what is in the frame and never names the town, a landmark or a street unless the photo is really of it."
          - name: local
            component: paragraphList
            label: About this town
            description: "Two or three sentences only true of this town, from someone who works there. This is what stops the page being a near-copy of the other 55. Never invent TLB's experiences."
          - name: nearby
            component: townPicker
            label: Nearby towns (optional)
            description: Leave empty to work them out from the map. Pick six to override.

      - name: regions
        label: Region pages
        type: collection
        path: src/content/regions
        format: yaml
        operations: { create: false, delete: false, rename: false }
        fields:
          - { name: seo, component: seo }
          - name: headingLines
            label: Main heading (H1)
            type: string
            list: true
            required: true
          - { name: lead, label: Intro sentence, type: text, required: true }
          - name: intro
            component: paragraphList
            label: About the region
            description: "The /locations/ hub shows these same paragraphs. Rewriting one of the two so they differ is still an open item."
      - name: locations-hub
        label: Locations hub (/locations/)
        type: file
        path: src/content/pages/locations/index.yaml
        format: yaml
        fields:
          - name: seo
            component: seo
            description: "Any text on this page can use {townCount}, {regionCount}, {stateCount}, {northernRiversCount}, {tweedCount} and {southernGoldCoastCount}. Each is counted from the town list, so the number never drifts from it. A misspelt one stops the site from publishing."
          - name: hero
            label: Hero (top of the page)
            type: object
            description: "The photo is the valley region photo, under Locations > Live towns and region photos. {townCount} shows the number of towns."
            fields:
              - name: kicker
                label: Small label above the heading
                type: string
              - name: headingLines
                label: Main heading (H1)
                type: string
                list: true
                required: true
              - name: subheading
                label: Line under the heading
                type: string
              - name: lead
                label: Intro sentence
                type: text
                required: true
              - name: cta
                component: link
                label: Button (leave empty to use the page's usual button)
          - name: definition
            component: textBlock
            label: "Intro (under the trust bar)"
            description: "Any text on this page can use {townCount}, {regionCount}, {stateCount}, {northernRiversCount}, {tweedCount} and {southernGoldCoastCount}. Each is counted from the town list, so the number never drifts from it. A misspelt one stops the site from publishing."
          - name: numbers
            label: The service area, in three numbers
            type: object
            fields:
              - name: heading
                label: Heading
                type: string
              - name: lead
                label: Intro sentence
                type: text
              - name: metrics
                label: Numbers
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{value} {caption}"
                fields:
                  - name: value
                    label: Number
                    type: string
                    required: true
                    description: "Use {townCount}, {regionCount} or {stateCount} so the number is counted from the town list. The intro promises these are counted, not typed in."
                  - name: caption
                    label: What it counts
                    type: string
                    required: true
          - name: regions
            component: textGrid
            label: Three regions, three different jobs
            description: "Exactly three cells, in this order: Northern Rivers, the Tweed, Southern Gold Coast. The photos between them are the region photos. {northernRiversCount}, {tweedCount} and {southernGoldCoastCount} show each region's number of towns."
          - name: towns
            component: tagCloud
            label: The towns we clean
            description: "The towns come from the town list; which ones link to a page is set under Locations > Live towns and region photos. Leave the tags empty."
          - name: services
            component: sectionIntro
            label: What we do (list of services)
            description: "The six services and their sentences are edited under Site settings > Menus > Our services."
          - name: faq
            component: faq
            label: FAQs
            description: "The travel charge answer promises no travel charge anywhere on the list, including the outer towns. Check it with TLB before changing it. {townCount} shows the number of towns."
          - name: closingCta
            component: callToAction
            label: Closing call to action
            description: "Any text on this page can use {townCount}, {regionCount}, {stateCount}, {northernRiversCount}, {tweedCount} and {southernGoldCoastCount}. Each is counted from the town list, so the number never drifts from it. A misspelt one stops the site from publishing."

      - name: town-template
        label: Town page template (all 56 town pages)
        type: file
        path: src/content/pages/locations/town.yaml
        format: yaml
        fields:
          - name: seo
            component: seo
            description: "Shared by every town page. Type {town} for the town's name, {region} for its region after \"the\" (Northern Rivers, Tweed, Southern Gold Coast), {regionName} for the region on its own (The Tweed) and {state} for NSW or QLD. These work in any text on this page; a misspelt one stops the site from publishing."
          - name: hero
            label: Hero (top of the page)
            type: object
            description: "Each town's photo is set in its own file under Locations > Town pages. Placeholders: {town}, {region}, {regionName}, {state}."
            fields:
              - name: kicker
                label: Small label above the heading
                type: string
              - name: headingLines
                label: Main heading (H1)
                type: string
                list: true
                required: true
              - name: subheading
                label: Line under the heading
                type: string
              - name: lead
                label: Intro sentence
                type: text
                required: true
              - name: cta
                component: link
                label: Button (leave empty to use the page's usual button)
          - name: definition
            component: textBlock
            label: "Intro (under the trust bar)"
            description: "True of every town. Each town's own paragraph follows it, from Locations > Town pages > About this town. Placeholders: {town}, {region}, {regionName}, {state}."
          - name: services
            component: sectionIntro
            label: What we do in the town (list of services)
            description: "The six services and their sentences are edited under Site settings > Menus > Our services, and are deliberately the same on every town page. Placeholders: {town}, {region}, {regionName}, {state}."
          - name: choose
            component: comparisonTable
            label: Which clean do you actually need? (table)
            description: "Placeholders: {town}, {region}, {regionName}, {state}."
          - name: beforeAfter
            component: beforeAfter
            label: Before and after
            description: "Never name the town in a caption or description unless the job really was there: a reader takes a real job photo on a town page as a job in that town."
          - { name: reviews, component: sectionHeading, label: "Google reviews heading" }
          - name: nearby
            label: Suburbs we clean around the town
            type: object
            description: "The suburbs are each town's neighbours, set under Locations > Town pages. Placeholders: {town}, {region}, {regionName}, {state}."
            fields:
              - name: heading
                label: Heading
                type: string
                required: true
              - name: subheading
                label: Subheading
                type: string
                required: true
              - name: groupLabel
                label: Label over the suburbs
                type: string
                required: true
              - name: note
                component: paragraphList
                label: Note under the suburbs
          - name: faq
            component: faq
            label: FAQs
            description: "These answers appear on all 56 town pages, so a wrong one is wrong 56 times. The travel charge and lead time answers are promises TLB has not yet confirmed. Placeholders: {town}, {region}, {regionName}, {state}."
          - name: closingCta
            component: callToAction
            label: Closing call to action
            description: "Placeholders: {town}, {region}, {regionName}, {state}."

      - name: region-template
        label: Region page template (both region pages)
        type: file
        path: src/content/site/region-page.yaml
        format: yaml
        fields:
          - name: hero
            label: Hero (top of the page)
            type: object
            description: "Shared by both region pages. Each region's heading, intro sentence and paragraphs are under Locations > Region pages. Type {region} for the region with \"the\" (the Northern Rivers), {regionAndState} for it with its state (Northern Rivers NSW), {state} for NSW or QLD and {townCount} for its number of towns. These work in any text on this page; a misspelt one stops the site from publishing."
            fields:
              - name: kicker
                label: Small label above the heading
                type: string
              - name: cta
                component: link
                label: Button (leave empty to use the page's usual button)
          - name: definition
            label: "Intro heading (under the trust bar)"
            type: object
            description: "The paragraphs are each region's own, under Locations > Region pages. Placeholders: {region}, {regionAndState}, {state}, {townCount}."
            fields:
              - name: heading
                label: Heading
                type: string
              - name: cta
                component: link
                label: Button (optional)
              - name: backgroundImage
                component: backgroundPhoto
          - name: services
            component: sectionIntro
            label: What we do across the region (list of services)
            description: "The six services and their sentences are edited under Site settings > Menus > Our services. Placeholders: {region}, {regionAndState}, {state}, {townCount}."
          - name: towns
            label: Towns we clean in the region
            type: object
            description: "The towns are the region's own; which ones link to a page is set under Locations > Live towns and region photos. Placeholders: {region}, {regionAndState}, {state}, {townCount}."
            fields:
              - name: heading
                label: Heading
                type: string
                required: true
              - name: subheading
                label: Subheading
                type: string
                required: true
              - name: note
                component: paragraphList
                label: Note under the towns
          - name: faq
            component: faq
            label: FAQs
            description: "The travel charge answer is a promise TLB has not yet confirmed, and it still shows its [CONFIRM] note to readers. Placeholders: {region}, {regionAndState}, {state}, {townCount}."
          - name: closingCta
            component: callToAction
            label: Closing call to action
            description: "Placeholders: {region}, {regionAndState}, {state}, {townCount}."

