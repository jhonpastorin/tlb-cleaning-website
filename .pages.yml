      - name: appliances
        label: "Cross-links: appliances"
        type: file
        path: src/content/site/appliances.yaml
        format: yaml
        fields:
          - name: services
            label: Services
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - { name: label, label: Name, type: string, required: true }
              - { name: href, label: Page, type: string, required: true }
