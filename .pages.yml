          - name: pathways
            component: pathwayCards
            label: "Three ways to read this page (cards)"
            description: "Links starting with # jump to a section of this page: #compare is the comparison table, #switching is \"Changing cleaners is awkward\"."
          - name: tradeOff
            component: textGrid
            label: "Local and embedded, professionally run"
            description: "\"Family first\" and \"Employed, not subcontracted\" are copied word for word from the About page: change both pages together. The employed claim has legal weight, so keep it only while it is true of every team member."
          - { name: resolution, component: textBlock, label: "One-line resolution (dark band with photo)" }
          - name: comparison
            label: "How TLB Cleaning compares (table)"
            type: object
