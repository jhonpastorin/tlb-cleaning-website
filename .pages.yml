                options: { values: ["End of lease & tenancy", "Homes, hosting & commercial"] }
              - { name: blurb, label: One line about it, type: text, required: true }
              - { name: icon, component: serviceIcon }
          - name: lastReviewed
            label: Review date line (on the two legal guides)
