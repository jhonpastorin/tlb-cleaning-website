    type: file
    path: src/content/site/reviews.yaml
    format: yaml
    fields:
      - name: profileUrl
        label: Google Business Profile link
        type: string
        description: Leave empty until the profile is public. Adds a "Read all our reviews on Google" link.
      - name: reviews
        label: Reviews (newest first)
        type: object
        description: "Only reviews that are live on Google, copied word for word, with the name exactly as Google shows it. Never edit, shorten or combine a review. No star averages."
        list:
          collapsible:
            collapsed: true
            summary: "{author} ({date})"
        fields:
          - { name: author, label: Name as Google shows it, type: string, required: true }
          - { name: rating, label: Stars, type: number, required: true, options: { min: 1, max: 5 } }
          - { name: text, label: Review, type: text, required: true }
          - { name: date, label: Month posted (YYYY-MM), type: string, required: true, pattern: "^\\d{4}-\\d{2}$" }
          - { name: reviewUrl, label: The review's share link, type: string }
          - name: topics
            label: Lead with it on
            type: select
            options:
              multiple: true
              values:
                - { name: airbnb, label: The Airbnb page }

