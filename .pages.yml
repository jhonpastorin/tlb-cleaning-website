          - name: definition
            component: textBlock
            label: "Intro (under the trust bar)"
            description: The background photo also sits behind the trust bar. Check the text is still easy to read after changing it.
          - name: pathways
            component: pathwayCards
            label: "People arrive here with three questions (cards)"
            description: "This page's own cards. The last card, \"Who is in my home\", is shared and edited under Site settings."
          - name: method
            component: iconGrid
            label: "How our venetian blind cleaning works (grid)"
