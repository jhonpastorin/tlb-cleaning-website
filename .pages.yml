        - "Miami"
  trustIcon:
    type: select
    label: Icon
    options:
      values:
        - { name: map-pin, label: Map pin }
        - { name: shield-check, label: Shield with tick }
        - { name: building, label: Building }
        - { name: team, label: Team }
        - { name: chat, label: Speech bubble }
        - { name: sparkle, label: Sparkle }

  paragraphList:
    type: text
    label: Paragraphs
    list: true

content:
  - name: main-pages
    label: Main pages
    type: group
    items:
      - name: how-booking-works
        label: How booking works
        type: file
        path: src/content/pages/how-booking-works.yaml
        format: yaml
        fields:
          - { name: seo, component: seo }
          - { name: hero, component: hero }
          - { name: definition, component: textBlock, label: "Intro (under the trust bar)" }
          - { name: steps, component: storySteps, label: "The three steps" }
          - { name: onTheDay, component: textBlock, label: "What happens on the day (dark band)" }
          - { name: practical, component: textGrid, label: "The practical bits" }
          - { name: notOnline, component: callout, label: "You don't have to book online (callout)" }
          - { name: otherBookings, component: linkList, label: "Booking something other than a house" }
          - { name: whereWeClean, component: tagCloud, label: "Where we clean" }
          - { name: faq, component: faq, label: "FAQs" }
          - { name: beforeYouBook, component: sectionIntro, label: "Before you book (links to the team pages)" }
          - { name: closingCta, component: callToAction, label: "Closing call to action" }
      - name: index
        label: Home
        type: file
        path: src/content/pages/index.yaml
        format: yaml
        fields:
          - { name: seo, component: seo }
          - { name: hero, component: hero }
          - name: definition
            component: textBlock
            label: "Intro (under the trust bar)"
            description: The background photo also sits behind the trust bar. Check the text is still easy to read after changing it.
          - { name: pathways, component: pathwayCards, label: "Tell us what you need (cards)" }
          - name: whatWeDo
            label: "What we do (list with icons)"
            type: object
            fields:
              - { name: heading, label: Heading, type: string, required: true }
              - { name: lead, label: Intro sentence, type: text }
              - { name: note, label: Note under the list, type: text }
              - name: items
                label: Rows
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - name: icon
                    component: serviceIcon
                  - { name: title, label: Title, type: string, required: true }
                  - { name: description, label: Sentence under the title, type: text, required: true }
                  - name: href
                    label: Links to
                    type: string
                    required: true
                    description: A page on this site, starting and ending with a slash, e.g. /house-cleaning/deep-cleaning/
                    pattern: "^(/|https://)"
          - name: team
            component: storyMosaic
            label: "Local team, run properly"
            description: The team photo is an empty, labelled slot until a real photo of the TLB team exists. Do not fill it with a stock or unrelated photo.
