                collapsed: true
                summary: "{shortLabel}"
            fields:
              - { name: label, label: Full title, type: string, required: true }
              - { name: shortLabel, label: Short title (for cards and links), type: string, required: true }
              - { name: href, label: Page, type: string, readonly: true }
              - name: cluster
                label: Group
