          - { name: comparison, component: comparisonTable, label: "Deep clean, regular clean or bond clean (table)" }
          - { name: beforeAfter, component: beforeAfter, label: "Before and after" }
          - { name: video, component: videoFeature, label: "Video (hidden on the site for now)" }
          - name: booking
            component: textBlock
            label: "Easy to book, fast quoting (dark band)"
            description: "This page's own paragraphs, starting with its \"Managed for you\" line. The How it works steps below them come from Site settings > Brand lines. Leave the button empty to keep \"Get a fast quote\"."
          - { name: reviews, component: sectionHeading, label: "Google reviews heading" }
          - { name: whereWeClean, component: tagCloud, label: "Where we clean" }
          - name: faq
            component: faq
            label: "FAQs"
            description: "Three answers still need Teagan's read-through: how long a deep clean takes, what isn't included, and bringing your own products. The moving furniture answer is worth checking with her too."
          - { name: closingCta, component: callToAction, label: "Closing call to action" }
      - name: blind-cleaning
