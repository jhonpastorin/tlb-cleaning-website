        - "Burleigh Waters"
        - "Miami"
  trustIcon:
    type: select
    label: Icon
    options:
      values:
        - { name: map-pin, label: Map pin }
        - { name: shield-check, label: Shield with tick }
        - { name: building, label: Building }
        - { name: team, label: Team }
        - { name: chat, label: Speech bubble }
        - { name: sparkle, label: Sparkle }

  paragraphList:
    type: text
    label: Paragraphs
    list: true

content:
  - name: main-pages
    label: Main pages
    type: group
    items:
      - name: how-booking-works
        label: How booking works
        type: file
        path: src/content/pages/how-booking-works.yaml
        format: yaml
        fields:
          - { name: seo, component: seo }
          - { name: hero, component: hero }
          - { name: definition, component: textBlock, label: "Intro (under the trust bar)" }
          - { name: steps, component: storySteps, label: "The three steps" }
          - { name: onTheDay, component: textBlock, label: "What happens on the day (dark band)" }
          - { name: practical, component: textGrid, label: "The practical bits" }
          - { name: notOnline, component: callout, label: "You don't have to book online (callout)" }
          - { name: otherBookings, component: linkList, label: "Booking something other than a house" }
          - { name: whereWeClean, component: tagCloud, label: "Where we clean" }
          - { name: faq, component: faq, label: "FAQs" }
          - { name: beforeYouBook, component: sectionIntro, label: "Before you book (links to the team pages)" }
          - { name: closingCta, component: callToAction, label: "Closing call to action" }

  - name: site-settings
    label: Site settings
    type: group
    items:
      - name: contact
        label: Contact details
        type: file
        path: src/content/site/contact.yaml
        format: yaml
        fields:
          - name: phone
            label: Phone number (as shown)
            type: string
            required: true
            description: Shown in the header, the footer and on the contact page, e.g. 0404 742 065
          - name: phoneHref
            label: Phone number (for the call link)
            type: string
            required: true
            pattern: "^tel:\\+?[0-9]+$"
            description: "tel: and then the number in international form with no spaces, e.g. tel:+61404742065. Change it with the number above."
          - name: schemaTelephone
            label: Phone number (for Google)
            type: string
            required: true
            description: International form with spaces, e.g. +61 404 742 065. Goes into the business details Google reads.
          - name: email
            label: Email address
            type: string
            required: true
          - name: address
            label: Area line in the footer
            type: string
            required: true
          - name: copyright
            label: Copyright line
            type: string
            required: true

      - name: buttons
        label: Site-wide buttons
        type: file
        path: src/content/site/buttons.yaml
        format: yaml
        fields:
          - name: quote
            component: link
            label: Quote button (on most pages)
            description: Changing this changes the button on every page that uses it.
          - name: book
            component: link
            label: Booking button
          - name: walkthroughLabel
            label: Commercial pages' button text
            type: string
            required: true
            description: The button on all commercial pages. It links to the quote button's page.

      - name: navigation
        label: Menus
        type: file
        path: src/content/site/navigation.yaml
        format: yaml
        fields:
          - name: primary
            label: Top bar links
            type: object
            description: The phone number and email are added after these automatically, from Contact details.
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - { name: label, label: Text, type: string, required: true }
              - { name: href, label: Links to, type: string, required: true }
          - name: services
            label: Our services (footer and homepage)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Service, type: string, required: true }
              - { name: description, label: One line about it (homepage only), type: text, required: true }
              - { name: href, label: Links to, type: string, required: true }
          - name: header
            label: Main menu
            type: object
            description: The full menu, including items kept out of it. Tick "Hidden" to keep an item or a row out of the menu without deleting it.
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - { name: label, label: Menu item, type: string, required: true }
              - { name: href, label: Links to, type: string }
              - { name: hidden, label: Hidden (keep it, and everything under it, out of the menu), type: boolean }
              - name: townMenu
                label: Lists the live towns
                type: boolean
                readonly: true
                description: This item's dropdown is built from the live towns under Locations, not from rows here.
              - { name: note, label: Note, type: text, readonly: true }
              - name: groups
                label: Dropdown columns
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - { name: label, label: Column heading, type: string }
                  - name: items
                    label: Rows
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: "{label}"
                    fields:
                      - { name: label, label: Text, type: string, required: true }
                      - { name: href, label: Links to, type: string }
                      - { name: hidden, label: Hidden (keep this row out of the menu), type: boolean }
                      - { name: note, label: Note, type: text, readonly: true }

      - name: trust-bar
        label: Trust bar
        type: file
        path: src/content/site/trust-bar.yaml
        format: yaml
        fields:
          - name: cards
            label: Proof points
            type: object
            description: Shown on almost every page. Keep it at four, which fits on one row; five wraps to two rows. Both numbers here must be true and current.
            list:
              min: 1
              max: 5
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: icon, component: trustIcon, required: true }
              - { name: title, label: Short label, type: string, required: true }
              - { name: description, label: The claim, type: string, required: true }

      - name: brand-lines
        label: Brand lines
        type: file
        path: src/content/site/brand-lines.yaml
        format: yaml
        fields:
          - name: line
            label: The line (end of hero intros)
            type: object
            description: "Inserted into page copy wherever {{line.instant}} or {{line.fast}} appears. \"Instant\" is only for regular cleans and turnovers, which can genuinely be priced instantly."
            fields:
              - { name: instant, label: Instant pricing version, type: string, required: true }
              - { name: fast, label: Fast quoting version, type: string, required: true }
          - name: lineHeading
            label: The line as a heading
            type: object
            fields:
              - { name: instant, label: Instant pricing version, type: string, required: true }
              - { name: fast, label: Fast quoting version, type: string, required: true }
          - name: managedForYou
            label: Managed for you
            type: object
            fields:
              - { name: recurring, label: For regular and commercial work, type: text, required: true }
              - { name: oneOff, label: For one-off jobs, type: text, required: true }
          - name: body
            label: Paragraphs under the line
            type: object
            fields:
              - { name: regular, component: paragraphList, label: Regular home cleaning }
              - { name: turnover, component: paragraphList, label: Holiday let turnovers }
              - { name: residential, component: paragraphList, label: One-off home jobs (carpets, windows, gutters) }
              - { name: condition, component: paragraphList, label: Deep, bond and mould cleans }
              - { name: commercial, component: paragraphList, label: Commercial }
          - name: howItWorks
            label: How it works steps
            type: object
            fields:
              - { name: heading, label: Heading, type: string, required: true }
              - { name: general, label: Steps (most pages), type: string, list: true }
              - { name: turnover, label: Steps (Airbnb page), type: string, list: true }

      - name: comparison
        label: Comparison table
        type: file
        path: src/content/site/comparison.yaml
        format: yaml
        fields:
          - name: columns
            label: Columns
            type: object
            description: The last column is TLB's and is the highlighted one.
            list: true
            fields:
              - { name: label, label: Column heading, type: string, required: true }
          - name: rows
            label: Rows
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: id
                label: Fixed name
                type: string
                readonly: true
                description: Some pages look this row up by this name. Do not delete a row that has one.
              - { name: label, label: Row heading, type: string, required: true }
              - name: values
                label: One cell per column, left to right
                type: string
                list: true

      - name: contact-form
        label: Contact form
        type: file
        path: src/content/site/contact-form.yaml
        format: yaml
        fields:
          - { name: heading, label: Heading, type: string, required: true }
          - { name: lead, label: Intro sentence, type: text, required: true }
          - { name: submitLabel, label: Send button, type: string, required: true }
          - { name: submittingLabel, label: Send button while sending, type: string, required: true }
          - { name: successHeading, label: After sending, heading, type: string, required: true }
          - { name: successBody, label: After sending, message, type: text, required: true }
          - { name: errorHeading, label: If sending fails, heading, type: string, required: true }
          - { name: errorBody, label: If sending fails, message, type: text, required: true }
          - { name: unconfiguredHeading, label: If the form is not connected, heading, type: string, required: true }
          - { name: unconfiguredBody, label: If the form is not connected, message, type: text, required: true }
          - name: serviceOptions
            label: Type of service options
            type: string
            list: true
            description: "These are sent to the Monday.com board word for word. Changing or adding one means updating the board's dropdown column the same day, or those enquiries arrive with the service blank."

      - name: who-is-in-your-home
        label: '"Who is in my home" card'
