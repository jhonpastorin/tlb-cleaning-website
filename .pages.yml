            component: textBlock
            label: "Intro (under the trust bar)"
            description: The background photo also sits behind the trust bar. Check the text is still easy to read after changing it.
          - { name: pathways, component: pathwayCards, label: "Not sure a deep clean is the one? (cards)" }
          - name: inclusions
            component: textGrid
            label: "What's included in a deep clean (grid)"
