          - { name: moreAbout, component: sectionIntro, label: "More about how we work (links to the team pages)" }
          - { name: reviews, component: sectionHeading, label: "Google reviews heading" }
          - { name: whereWeClean, component: tagCloud, label: "Where we clean" }
          - name: faq
            component: faq
            label: "FAQs"
            description: Questions about insurance and police checks are held back on purpose. Add them only once the policy and the check are confirmed, and say exactly what they are.
          - { name: closingCta, component: callToAction, label: "Closing call to action" }
      - name: why-tlb
